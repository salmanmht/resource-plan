<style>
  :root { --rp-bg:#f5f5f7; --rp-surface:#fff; --rp-border:#d2d2d7; --rp-text:#1d1d1f; --rp-muted:#86868b; --rp-accent:#007aff; --rp-accent-soft:#e8f0fe; --rp-danger:#ff3b30; --rp-radius:10px; --rp-radius-large:14px; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; background:var(--rp-bg); color:var(--rp-text); font-size:13px; letter-spacing:-.01em; }
  input, select { font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }
  .rp-page { min-height:100vh; background:var(--rp-bg); }
  .rp-card { background:var(--rp-surface); border:1px solid var(--rp-border); border-radius:var(--rp-radius-large); box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02); }
  .rp-header { background:rgba(255,255,255,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--rp-border); box-shadow:0 1px 3px rgba(0,0,0,.04); }
  @media screen and (max-width:700px){ body{font-size:12px;} }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    .page-break { page-break-before: always; }
    /* Each pump's calculation starts on a fresh sheet of paper */
    .calc-page { page-break-after: always; break-after: page; page-break-inside: avoid; }
    .calc-page:last-child { page-break-after: auto; break-after: auto; }
    @page { margin: 9mm; }
  }

  /* ── Schedule-review workspace ───────────────────────────────────────── */
  .schedule-review{display:flex;flex-direction:column;gap:14px;}

  .schedule-health{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;}

  .health-card.pass{border-top:3px solid #34c759;}.health-card.review{border-top:3px solid #ff9500;}.health-card.blocked{border-top:3px solid #ff3b30;}.health-card.capacity{border-top:3px solid #007aff;}
  .schedule-card{background:#fff;border:1px solid #d2d2d7;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;}
  .schedule-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid #e8e8ed;flex-wrap:wrap;}.schedule-card-head h2{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#1d1d1f;}.schedule-card-head p{font-size:10px;color:#86868b;margin-top:3px;}
  .schedule-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #e8e8ed;flex-wrap:wrap;background:#fafafb;}.schedule-toolbar input,.schedule-toolbar select{width:auto;min-width:130px;padding:7px 10px;border:1px solid #d2d2d7;border-radius:8px;font-size:11px;background:#fff;color:#1d1d1f;outline:none;}.schedule-toolbar input{flex:1 1 220px;}.schedule-toolbar input:focus,.schedule-toolbar select:focus{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.12);}.toolbar-spacer{flex:1;}.density-switch{display:inline-flex;border:1px solid #d2d2d7;border-radius:8px;overflow:hidden;background:#fff;}.density-switch button{border:0;background:#fff;color:#86868b;padding:7px 10px;font-size:10px;font-weight:650;cursor:pointer;}.density-switch button.on{background:#e8f0fe;color:#007aff;}

lor:#86868b;margin-top:2px;}.schedule-action{border:1px solid #d2d2d7;background:#fff;color:#007aff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer;}.schedule-action:hover{border-color:#007aff;background:#e8f0fe;}.empty-schedule{padding:34px 20px;text-align:center;color:#86868b;font-size:12px;}.schedule-mobile{display:none;gap:8px;padding:10px;}.schedule-mobile-card{border:1px solid #d2d2d7;border-radius:12px;padding:12px;background:#fff;cursor:pointer;}.schedule-mobile-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}.schedule-mobile-name{font-weight:750;color:#1d1d1f;font-size:12px;line-height:1.35;}.schedule-mobile-tag{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#86868b;margin-top:2px;}.schedule-mobile-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #ededf0;}.schedule-mobile-metrics span{font-size:9px;color:#86868b;display:block;}.schedule-mobile-metrics b{display:block;font-size:12px;color:#1d1d1f;margin-top:2px;font-variant-numeric:tabular-nums;}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:500;}.inspection-drawer{position:fixed;z-index:501;top:0;right:0;width:min(480px,100vw);height:100dvh;background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.16);display:flex;flex-direction:column;animation:drawer-in .18s ease-out;}.inspection-drawer header{padding:18px 20px;border-bottom:1px solid #d2d2d7;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}.inspection-drawer h3{font-size:16px;letter-spacing:-.02em;color:#1d1d1f;line-height:1.3;}.inspection-drawer .close{border:0;background:#f5f5f7;color:#424245;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer;}.inspection-drawer main{padding:18px 20px;overflow:auto;flex:1;}.drawer-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}.drawer-metric{background:#f5f5f7;border:1px solid #e2e2e7;border-radius:10px;padding:10px;}.drawer-metric span{font-size:9px;color:#86868b;text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:block;}.drawer-metric b{font-size:16px;color:#1d1d1f;margin-top:4px;display:block;font-variant-numeric:tabular-nums;}.drawer-section{border-top:1px solid #e7e7eb;padding-top:14px;margin-top:14px;}.drawer-section h4{font-size:10px;color:#86868b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;}.drawer-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:11px;border-bottom:1px solid #f0f0f2;}.drawer-line span{color:#86868b;}.drawer-line b{color:#1d1d1f;text-align:right;}.drawer-warning{margin-top:8px;padding:9px 10px;border-radius:8px;font-size:11px;line-height:1.45;}.drawer-warning.review{background:#fff4e0;color:#a76200;}.drawer-warning.blocked{background:#fff0ee;color:#d8332b;}.drawer-footer{border-top:1px solid #d2d2d7;padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;}.drawer-footer button{border:1px solid #d2d2d7;background:#fff;color:#424245;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:650;cursor:pointer;}.drawer-footer button.primary{background:#007aff;border-color:#007aff;color:#fff;}
  @keyframes drawer-in{from{transform:translateX(24px);opacity:.7}to{transform:translateX(0);opacity:1}}
  @media screen and (max-width:900px){.schedule-health{grid-template-columns:repeat(3,minmax(130px,1fr));}.schedule-table-wrap{display:none;}.schedule-mobile{display:grid;}.schedule-card-head{padding:14px;}.schedule-toolbar{padding:10px;}.schedule-toolbar input{flex-basis:100%;}.toolbar-spacer{display:none;}.inspection-drawer{width:100%;}.schedule-context{padding:2px 0;}.schedule-title{font-size:18px;}}

  @media print{.schedule-health,.schedule-toolbar,.inspection-drawer,.drawer-backdrop,.schedule-context-status,.schedule-action{display:none!important;}.schedule-review{gap:4px;}.schedule-card{border:none;box-shadow:none;}.schedule-card-head{padding:4px 0 8px;}.schedule-table-wrap{display:block!important;overflow:visible!important;max-height:none!important;}.schedule-mobile{display:none!important;}.schedule-table{min-width:0;font-size:9px;}.schedule-table th,.schedule-table td{position:static!important;padding:5px!important;box-shadow:none!important;}.schedule-table th.system,.schedule-table td.system{min-width:0;max-width:none;}.schedule-table th.tag,.schedule-table td.tag{min-width:0;}.schedule-table thead tr.labels th{top:auto;}.schedule-table thead tr.group th{display:none;}}


  /* ── Global Resource Planning design system ────────────────────────────── */
  :root{
    --app-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
    --app-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    --app-bg:#f5f5f7;--app-surface:#fff;--app-surface-subtle:#fafafb;--app-border:#d2d2d7;
    --app-text:#1d1d1f;--app-text-2:#424245;--app-muted:#86868b;--app-blue:#007aff;
    --app-blue-soft:#e8f0fe;--app-green:#34c759;--app-green-soft:#e8faf0;
    --app-amber:#ff9500;--app-amber-soft:#fff4e0;--app-red:#ff3b30;--app-red-soft:#fff0ee;
    --app-radius:10px;--app-radius-large:14px;--app-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  }
  #root,#root *{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root{color:var(--app-text);font-size:13px;line-height:1.45;}
  #root input,#root select,#root textarea{font-family:var(--app-sans)!important;border-color:var(--app-border)!important;border-radius:var(--app-radius)!important;color:var(--app-text)!important;background:#fff!important;}
  #root input:focus,#root select:focus,#root textarea:focus{outline:none!important;border-color:var(--app-blue)!important;box-shadow:0 0 0 3px rgba(0,122,255,.12)!important;}
  #root button{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root button:focus-visible,#root a:focus-visible,#root input:focus-visible,#root select:focus-visible{outline:3px solid rgba(0,122,255,.26)!important;outline-offset:2px;}
  .global-page{background:var(--app-bg)!important;min-height:100dvh!important;}
  .app-header{position:relative!important;background:rgba(255,255,255,.9)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:0 1px 3px rgba(0,0,0,.04)!important;padding:14px 24px!important;}
  .app-header *{color:var(--app-text)!important;}.app-header [style*="color:\"#86868b\""]{color:var(--app-muted)!important;}
  .app-tabbar{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(18px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:none!important;}
  .app-tabbar button{border-radius:0!important;font-weight:650!important;}.app-tabbar button:hover{background:var(--app-surface-subtle)!important;color:var(--app-text)!important;}
  .app-content{padding:20px 24px 30px!important;}
  .global-page [style*="borderRadius:12"],.global-page [style*="borderRadius:16"]{box-shadow:var(--app-shadow)!important;}
  .global-page [style*="textTransform:\"uppercase\""]{font-size:10px!important;letter-spacing:.06em!important;font-weight:700!important;}
  /* Input workspace */
  .pump-input-workspace{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .pump-input-workspace [style*="borderTop"]{border-color:#ececf0!important;}
  .live-calc{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .live-calc-summary{background:var(--app-surface-subtle)!important;border-bottom:1px solid var(--app-border)!important;}
  .live-calc-summary *{color:var(--app-text)!important;}.live-calc-summary [style*="color:"]{color:var(--app-muted)!important;}
  .live-calc-summary [style*="fontSize:15"]{color:var(--app-text)!important;font-family:var(--app-display)!important;font-weight:750!important;}
  .live-calc-section{background:#f5f5f7!important;color:var(--app-muted)!important;border-color:#e8e8ed!important;}
  .live-calc-row{border-bottom:1px solid #f0f0f2!important;padding:6px 14px!important;}
  /* Calculation sheets */
  .calc-sheet{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .calc-sheet-header{background:var(--app-surface)!important;color:var(--app-text)!important;border-bottom:1px solid var(--app-border)!important;padding:16px 20px!important;}
  .calc-sheet-header *{color:var(--app-text)!important;}.calc-sheet-header > div > div:first-child > div:first-child,.calc-sheet-header > div > div:last-child{color:var(--app-muted)!important;}
  .calc-sheet-header [style*="fontSize:13"]{font-family:var(--app-display)!important;font-size:16px!important;font-weight:750!important;letter-spacing:-.02em!important;}
  .calc-basis{background:var(--app-blue-soft)!important;border-bottom:1px solid #c8dafa!important;color:#265c9f!important;font-family:var(--app-sans)!important;padding:7px 20px!important;letter-spacing:0!important;}
  .calc-section{background:#1e3a5f!important;color:#fff!important;padding:6px 20px!important;font-size:10px!important;letter-spacing:.07em!important;}
  .calc-step-row{border-bottom:1px solid #ececf0!important;padding:7px 20px!important;min-height:36px!important;}.calc-step-row span{font-family:var(--app-sans)!important;}.calc-step-row [style*="fontSize:14"]{font-family:var(--app-display)!important;}
  .calc-result-banner{background:#1d1d1f!important;padding:14px 20px!important;}.calc-result-banner *{font-family:var(--app-sans)!important;}.calc-result-banner [style*="fontSize:15"]{font-family:var(--app-display)!important;}
  .duty-point-wrap{background:var(--app-surface-subtle)!important;padding:12px 20px!important;}.duty-point-table{font-family:var(--app-sans)!important;}.duty-point-table th{color:var(--app-muted)!important;font-size:9px!important;letter-spacing:.05em!important;text-transform:uppercase!important;}.duty-point-table td{font-variant-numeric:tabular-nums;}
  /* Reference data and project cards */
  .project-card,.reference-panel{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .project-card:hover{border-color:#b8b8c0!important;box-shadow:0 6px 18px rgba(0,0,0,.07)!important;}
  /* Consistent labels and numerical alignment across all pages */
  #root label{font-size:10px!important;font-weight:700!important;letter-spacing:.04em!important;color:var(--app-text-2)!important;}
  #root [style*="fontFamily"]{font-family:var(--app-sans)!important;font-variant-numeric:tabular-nums;}
  @media screen and (max-width:700px){.app-header{padding:12px 14px!important;}.app-content{padding:14px 12px 24px!important;}.calc-sheet-header{padding:14px!important;}.calc-basis,.calc-section,.calc-step-row,.duty-point-wrap,.calc-result-banner{padding-left:14px!important;padding-right:14px!important;}}
  @media print{#root,#root *{font-family:Arial,sans-serif!important;letter-spacing:0!important;}.calc-sheet{box-shadow:none!important;border-radius:0!important;}.calc-sheet-header{border-bottom:2px solid #1e3a5f!important;}.calc-result-banner{background:#fff!important;border-top:2px solid #1e3a5f!important;}.calc-result-banner *{color:#1d1d1f!important;}.calc-section{background:#1e3a5f!important;color:#fff!important;}}


  /* ── Calculation Sheets: Resource Planning project-card treatment ─────── */
  .calc-project-card{background:#fff;border:1px solid #d2d2d7;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.04);overflow:hidden;margin:0 0 16px;transition:border-color .15s,box-shadow .15s;}
  .calc-project-card:hover{border-color:#b9b9c0;box-shadow:0 6px 20px rgba(0,0,0,.08);}.calc-project-card.collapsed{box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .calc-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 20px;cursor:pointer;user-select:none;background:#fff;}.calc-card-head:hover{background:#fafafb;}
  .calc-card-brand{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#86868b;margin-bottom:5px;}.calc-card-title{font-family:var(--app-display)!important;font-size:16px;font-weight:750;letter-spacing:-.025em;color:#1d1d1f;line-height:1.25;}.calc-card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:10px;color:#6e6e73;margin-top:6px;}.calc-card-meta b{color:#424245;font-weight:700;}.calc-card-expand{font-size:10px;color:#007aff;font-weight:700;white-space:nowrap;align-self:center;}

  /* ── Phone layout ──────────────────────────────────────────────────────
     The project row and the reference-data grids were both laid out for a
     desktop width only. On a phone the four project buttons stayed on one
     flex line and Delete was pushed off-screen, and the reference grids
     compressed every column until the inputs were unreadable. Both are laid
     out with inline styles in JS, so these rules use !important to override
     them rather than threading a breakpoint through the components. */
  @media screen and (max-width:700px){
    /* Project row: title above, then a 2x2 button grid that always fits. */
    .project-card{flex-direction:column!important;align-items:stretch!important;gap:12px!important;padding:14px!important;}
    .project-card>div:first-child{width:100%;}
    .project-card>div:last-child{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex-shrink:1!important;}
    .project-card>div:last-child>button{width:100%;padding:10px 8px!important;font-size:12px!important;}
    /* Open is the primary action — give it the full first row. */
    .project-card>div:last-child>button:first-child{grid-column:span 2;}
    /* Reference-data grids scroll sideways instead of crushing the columns. */
    .refgrid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .refgrid-scroll>div{min-width:560px;}
    /* Header actions wrap rather than overflowing the notch area. */
    .app-header>div{flex-wrap:wrap!important;gap:10px!important;}
    /* Two- and three-column field grids are unreadable at phone width. They
       are laid out with inline styles in JS, hence !important here. */
    .fg2,.fg3,.fg5{grid-template-columns:1fr!important;}
    .pump-input-workspace{padding:14px!important;}
  }
  /* The pump editor is three side-by-side panes on desktop: list, form, live
     calculation. Below 900px they must stack, otherwise the form is crushed
     into a few characters' width and the live panel is unreadable. */
  @media screen and (max-width:900px){
    .pumpwork{flex-direction:column!important;gap:12px!important;}
    .pumpwork>.pumplist,.pumpwork>.pumpcalc{width:100%!important;flex:1 1 auto!important;}
    /* Sticky positioning only makes sense beside the form, not above it. */
    .pumpcalc .live-calc{position:static!important;max-height:none!important;}
    .pumpcalc .live-calc>div:last-child{max-height:420px!important;}
    /* The pump picker becomes a horizontal strip so the form stays in view. */
    .pumplist-items{display:flex!important;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .pumplist-items>div{flex:0 0 auto;min-width:150px;margin-bottom:0!important;}
    .pumplist-add{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;}
    .pumplist-add>button{margin-bottom:0!important;}
  }
  @media print{

    .screen-hide{display:block!important}
    .calcsplit{display:block!important}
    .calcsplit-pane{display:block!important}
    .calcpick{display:none!important}
    .calcwrap{display:block!important}
    /* Print at true A4 — undo every preview-scaling rule. */
    .ppreview{height:auto!important;overflow:visible!important;position:static!important}
    .ppreview-page{position:static!important;transform:none!important;width:auto!important}}

const lbl = {fontSize:9,fontWeight:700,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.05em",display:"block",marginBottom:3};

function Field({label, value, onChange, type="text", min, step, note}) {
  return (
    <div>
      <label style={lbl}>{label}</label>
      <input type={type} value={value} min={min} step={step}
        onChange={e=>onChange(e.target.value)}
        style={inp}
        onFocus={e=>e.target.style.borderColor="#007aff"}
        onBlur={e=>e.target.style.borderColor="#d2d2d7"} />
      {note && <p style={{fontSize:10,color:"#86868b",fontStyle:"italic",marginTop:3}}>{note}</p>}
    </div>
  );
}
function Sel({label, value, onChange, options}) {
  return (
    <div>
      <label style={lbl}>{label}</label>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{...inp,cursor:"pointer"}}>
        {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}
function AuthScreen({onAuthed}) {
  const [mode, setMode]     = useState("login"); // "login" | "signup"
  const [email, setEmail]   = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr]       = useState("");
  const [busy, setBusy]     = useState(false);
  const [info, setInfo]     = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        const normalizedEmail = email.trim().toLowerCase();
        if (data && data.session) {
          const { data: roster } = await sb.from('engineers').select('id,active').eq('email', normalizedEmail).maybeSingle();
          if (!roster || roster.active === false) {
            const { error: requestError } = await sb.from('pending_users').upsert(
              {email:normalizedEmail, status:'pending', requested_at:new Date().toISOString()},
              {onConflict:'email', ignoreDuplicates:true}
            );
            if (requestError) throw requestError;
          }
          setInfo("Account created and your access request is pending administrator approval.");
        } else {
          setInfo("Account created. Check your inbox to confirm your email, then sign in to submit or view your access request.");
        }
      }
    } catch (e2) {
      setErr(e2.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#f5f5f7",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",width:480,height:480,borderRadius:"50%",background:"radial-gradient(circle,rgba(0,122,255,.08) 0%,transparent 70%)",top:-140,right:-60,pointerEvents:"none"}} />
      <div style={{position:"absolute",width:360,height:360,borderRadius:"50%",background:"radial-gradient(circle,rgba(52,199,89,.07) 0%,transparent 70%)",bottom:-80,left:-80,pointerEvents:"none"}} />
      <div style={{position:"relative",zIndex:1,width:"min(400px,94vw)",background:"#fff",borderRadius:20,padding:"40px 36px 32px",textAlign:"center",boxShadow:"0 2px 4px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)"}}>
        <img src={MEINHARDT_LOGO_SRC} alt="Meinhardt" style={{display:"block",width:176,height:"auto",margin:"0 auto 16px"}} />
        <div style={{width:52,height:52,borderRadius:14,margin:"0 auto 20px",background:"linear-gradient(160deg,#007aff 0%,#0055d4 100%)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,122,255,.3)",color:"white",fontSize:23}}>▥</div>
        <div style={{fontSize:21,fontWeight:700,color:"#1d1d1f",marginBottom:5,letterSpacing:"-.03em"}}>MEP Specifications</div>
        <div style={{fontSize:13,color:"#6e6e73",marginBottom:28}}>Sign in to continue</div>
        <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:10,textAlign:"left"}}>
          <input type="email" autoComplete="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1px solid #d2d2d7",borderRadius:10,fontSize:12,color:"#1d1d1f",background:"#fff",outline:"none"}} />
          <input type="password" autoComplete={mode==="login"?"current-password":"new-password"} placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1px solid #d2d2d7",borderRadius:10,fontSize:12,color:"#1d1d1f",background:"#fff",outline:"none"}} />
          {err  && <div style={{fontSize:11,color:"#ff3b30",background:"#fff0ee",padding:"8px 10px",borderRadius:8}}>{err}</div>}
          {info && <div style={{fontSize:11,color:"#16803a",background:"#e8faf0",padding:"8px 10px",borderRadius:8}}>{info}</div>}
          <button type="submit" disabled={busy} style={{marginTop:2,padding:"10px 0",background:"#007aff",color:"white",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:busy?"default":"pointer",opacity:busy?0.6:1}}>
            {busy ? "Please wait…" : mode==="login" ? "Sign In" : "Request Access"}
          </button>
        </form>
        <div style={{marginTop:14,textAlign:"center",fontSize:11,color:"#86868b"}}>
          {mode==="login" ? (
            <>Don’t have an account? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");setErr("");setInfo("");}} style={{color:"#007aff",fontWeight:600,textDecoration:"underline"}}>Request Access</a></>
          ) : (
            <>Already have an account? <a href="#" onClick={e=>{e.preventDefault();setMode("login");setErr("");setInfo("");}} style={{color:"#007aff",fontWeight:600,textDecoration:"underline"}}>Sign In</a></>
          )}
        </div>
        <div style={{marginTop:26,fontSize:9,color:"#86868b",lineHeight:1.6}}>MEP Specifications · Secure cloud projects<br/><span style={{fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace",letterSpacing:".02em"}}>{BUILD_LABEL}</span></div>
      </div>
    </div>
  );
}
const EMPTY_META = {revision:"01", date:new Date().toISOString().slice(0,10), calcBy:"", calcDate:"", checkedBy:"", checkedDate:"", reviewedBy:"", reviewedDate:"", designBasis:[], closure:{status:"draft"}};
function fmtWhen(d) { if(!d) return ''; const t=new Date(d); return isNaN(t)?String(d):t.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDay(d)  { if(!d) return ''; const t=new Date(d); return isNaN(t)?String(d):t.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function closureOf(meta) { return (meta && meta.closure) || {status:'draft'}; }
function normalizeStageMeta(raw) {
  const m = {...EMPTY_META, ...(raw||{})};
  const c = closureOf(m), status = c.status || 'draft';
  if (status === 'closed') return {
    ...m,
    checkedBy: m.checkedBy || c.lead_signed_by || '',
    checkedDate: m.checkedDate || c.lead_signed_at || '',
    reviewedBy: m.reviewedBy || c.mep_lead_signed_by || c.closed_by || '',
    reviewedDate: m.reviewedDate || c.closed_at || ''
  };
  if (status === 'awaiting_approver') return {
    ...m,
    checkedBy: m.checkedBy || c.lead_signed_by || '',
    checkedDate: m.checkedDate || c.lead_signed_at || '',
    reviewedBy: '', reviewedDate: ''
  };
  return {...m, checkedBy:'', checkedDate:'', reviewedBy:'', reviewedDate:''};
}
function PrintPreview({children, active, measureKey}) {
  const A4 = 794;
  const boxRef = React.useRef(null);
  const pageRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const [h, setH] = React.useState(0);
  React.useLayoutEffect(() => {
    const box = boxRef.current, page = pageRef.current;
    if (!box || !page) return;
    const fit = () => {
      const w = box.clientWidth || A4;
      const sc = Math.min(1, w / A4);
      setScale(sc);
      setH(page.scrollHeight * sc);
    };
    fit();
    let ro;
    if (typeof ResizeObserver !== "undefined") { ro = new ResizeObserver(fit); ro.observe(box); }
    window.addEventListener("resize", fit);
    // Content height changes after fonts/images settle, so re-measure shortly after.
    const t = setTimeout(fit, 350);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", fit); clearTimeout(t); };
  }, [active, measureKey]);
  return (
    <div className="ppreview" ref={boxRef} style={{height: h || undefined}}>
      <div className="ppreview-page" ref={pageRef} style={{width: A4, transform: "scale("+scale+")"}}>
        {children}
      </div>
    </div>
  );

function grpDiv(g) {

  if (/fire|suppress|sprinkler|standpipe|hydrant|extinguish/i.test(g.grp) || g.items.some(i => /^fp_/.test(i.k))) return '21';

function sysGroups() {

const ITEM_FIELDS = [['code','Code'],['section_num','Section no.'],['grp','Group'],['item','Item'],['material','Material / option'],['rating','Rating / class'],['jointing','Jointing'],['standards','Standards'],['application','Application / limits'],['include_when','Include when (blank = always)'],['status','Status',['Verified','Draft','TBC']],['source','Source'],['sort','Sort','num'],['active','Active','bool']];

const OPT_FIELDS = [['key','Key'],['grp','Group'],['col','Screen column (0-2)','num'],['label','Label'],['type','Type (blank = checkbox, sel, num, txt)'],['choices','Choices (JSON)','json'],['default_value','Default (JSON)','json'],['dep','Enabled when (condition)'],['sub','Indent level','num'],['sort','Sort','num'],['active','Active','bool']];
const LOC_FIELDS = [['country_code','Country code'],['country_name','Country name'],['city','City (* = country base)'],['data','Data (JSON)','json'],['sort','Sort','num']];
const LIB_TABLES = {
  items:   {table:'spec_items',     key:'code',              fields:ITEM_FIELDS, title:'Items (materials)'},
  vendors: {table:'spec_vendors',   key:'code',              fields:VEN_FIELDS,  title:'Manufacturers'},
  options: {table:'spec_options',   key:'key',               fields:OPT_FIELDS,  title:'Project options'},
  locations:{table:'spec_locations',key:'country_code,city', fields:LOC_FIELDS,  title:'Locations'},
};
function RowEditor({cfg, row, isNew, onClose, onSaved, canEdit, who}) {
  const [v, setV] = useState(() => { const o = {}; cfg.fields.forEach(([k,, t]) => { const x = row[k]; o[k] = t === 'json' ? (x === undefined || x === null ? '' : JSON.stringify(x, null, 1)) : (x ?? (t === 'bool' ? true : '')); }); return o; });
  const [msg, setMsg] = useState('');
  const save = async () => {
    const out = {};
    for (const [k, , t] of cfg.fields) {
      let x = v[k];
      if (t === 'json') { if (String(x).trim() === '') x = (k === 'data') ? {} : null; else { try { x = JSON.parse(x); } catch (e) { setMsg(k + ': invalid JSON'); return; } } }
      else if (t === 'num') x = Number(x) || 0;
      else if (t === 'bool') x = !!x;
      else x = String(x ?? '').trim() === '' ? null : String(x).trim();
      out[k] = x;
    }
    for (const k of cfg.key.split(',')) if (!out[k]) { setMsg(k + ' is required.'); return; }
    if ('updated_by' in row || cfg.table === 'spec_items' || cfg.table === 'spec_vendors') out.updated_by = who;
    const unk = condKeys(out.include_when || out.dep || '').filter(x => !OPTMAP[x]);
    if (unk.length && !window.confirm('Unknown option key(s): ' + unk.join(', ') + '. This row will never be included. Save anyway?')) return;
    const {error} = await sb.from(cfg.table).upsert(out, {onConflict:cfg.key});
    if (error) { setMsg('Save failed: ' + error.message); return; }
    onSaved();
  };
  return <Modal title={(isNew ? 'New ' : 'Edit ') + cfg.title.toLowerCase()} onClose={onClose}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 12px'}}>{cfg.fields.map(([k, label, t]) => <div key={k} style={{gridColumn:(t === 'json' || ['makers','standards','application','material'].includes(k)) ? '1/3' : 'auto'}}>
      <label style={lbl}>{label}</label>
      {Array.isArray(t) ? <select disabled={!canEdit} value={v[k] || t[1]} onChange={e => setV({...v, [k]:e.target.value})} style={inp}>{t.map(o => <option key={o}>{o}</option>)}</select>
      : t === 'bool' ? <input type="checkbox" disabled={!canEdit} checked={!!v[k]} onChange={e => setV({...v, [k]:e.target.checked})}/>
      : t === 'json' ? <textarea disabled={!canEdit} value={v[k]} onChange={e => setV({...v, [k]:e.target.value})} rows={k === 'data' ? 10 : 3} style={{...inp,fontFamily:'ui-monospace,Menlo,Consolas,monospace',fontSize:11}}/>
      : <input disabled={!canEdit || (!isNew && cfg.key.split(',').includes(k))} value={v[k] ?? ''} onChange={e => setV({...v, [k]:e.target.value})} list={k === 'include_when' || k === 'dep' ? 'optKeyList' : k === 'section_num' ? 'secNumList' : undefined} style={inp}/>}
    </div>)}</div>
    <datalist id="optKeyList">{Object.keys(OPTMAP).map(k => <option key={k} value={k}>{OPTMAP[k].t}</option>)}</datalist>
    <datalist id="secNumList">{LIB.map(S => <option key={S.num} value={S.num}>{S.title}</option>)}</datalist>
    {msg && <div className="ai-msg bad" style={{marginTop:8}}>{msg}</div>}
    <div className="ai-row" style={{marginTop:12}}><span style={{flex:1}}/>{!canEdit && <span className="ai-note">Read-only — only Admin, Lead or Associate can edit the library.</span>}<button onClick={onClose}>Cancel</button>{canEdit && <button className="pri" onClick={save}>Save to library</button>}</div>
  </Modal>;
}
function SectionEditor({S, onClose, onSaved, canEdit, who}) {
  const [f, setF] = useState(() => ({num:S ? S.num : '', title:S ? S.title : '', division:S ? S.div : '', include_when:S ? S.cond : '', sort:S ? S.sort : (LIB.reduce((a, x) => Math.max(a, x.sort || 0), 0) + 10), body:S ? S.body : NEW_SECTION_TEMPLATE}));
  const [msg, setMsg] = useState(''); const [hist, setHist] = useState(null); const [paste, setPaste] = useState(null);
  const preview = useMemo(() => { const s = sectionFromRow({num:f.num || '?? ????', title:f.title, include_when:f.include_when, body:f.body}); const o = defaultOpts(); OPTS.forEach(g => g.items.forEach(i => { if (!i.type) o[i.k] = true; })); const C = Object.keys(COUNTRIES)[0]; return genSection(s, o, tokens({country:C, city:'*', pf:profileFor(C, '')}, o)); }, [f]);
  const unknown = [...new Set([...condKeys(f.include_when), ...((f.body.match(/\[if:([^\]]+)\]/g) || []).flatMap(x => condKeys(x.slice(4, -1))))])].filter(k => !OPTMAP[k]);
  const save = async () => {
    const nm = String(f.num).trim().match(/^(\d{2})\s?(\d{2})\s?(\d{2})(\.\d+)?$/); if (!nm) return setMsg('Section number must be CSI format, e.g. 22 4000');

  // ── #20 UI: item specifications ─────────────────────────────────────────
  function lineDiff(a, b) {
    const A = String(a || '').replace(/\s+$/, '').split('\n'), B = String(b || '').replace(/\s+$/, '').split('\n');
    const n = A.length, m = B.length, L = Array.from({length:n + 1}, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) { if (A[i] === B[j]) { out.push(['=', A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }
    while (i < n) out.push(['-', A[i++]]); while (j < m) out.push(['+', B[j++]]);
    return out;
  }
  function DiffView({a, b, label}) {
    const d = lineDiff(a, b), changed = d.some(x => x[0] !== '=');
    return <div style={{marginTop:6}}><div style={{...lbl,marginBottom:3}}>{label}{!changed && ' — no change'}</div>
      {changed && <div style={{border:'1px solid #e1e1e6',borderRadius:8,padding:'6px 8px',font:'11px ui-monospace,Menlo,Consolas,monospace',maxHeight:180,overflow:'auto',whiteSpace:'pre-wrap'}}>
        {d.map((x, k) => <div key={k} style={{background:x[0] === '+' ? '#e8faf0' : x[0] === '-' ? '#fff0ee' : 'transparent',color:x[0] === '+' ? '#16803a' : x[0] === '-' ? '#b42318' : '#6e6e73',textDecoration:x[0] === '-' ? 'line-through' : 'none'}}>{x[0] === '=' ? '  ' : x[0] + ' '}{x[1] || ' '}</div>)}</div>}</div>;
  }
  function badLines(t) { return String(t || '').split('\n').filter(l => { let s = l.trim(); if (!s) return false; s = s.replace(/^\[if:[^\]]+\]\s*/, ''); return !s.startsWith('- '); }).length; }
  function itemPreview(it, f) {
    const o = defaultOpts(); OPTS.forEach(g => g.items.forEach(i => { if (!i.type) o[i.k] = true; }));
    const C = Object.keys(COUNTRIES)[0], T = tokens({country:C, city:'*', pf:profileFor(C, '')}, o), S = {num:it.section_num}, inc = incSet(o);
    const h = String(itemHeading(it, {heading:f.heading})).toUpperCase();

  // ── install ─────────────────────────────────────────────────────────────

    LIB_TABLES.warranty = {table:'spec_warranty', key:'row_type,countries,division,description', fields:WAR_FIELDS, title:'Warranty row', auto:true, chx:true, audit:true, canDelete:true,
      help:'Annexure C – Schedule of Equipment Warranty. Rows print only in projects of the country named here. "item" rows form the table; "note" rows print under it. Run spec_choices_v2_migration.sql first.'};
    LIB_TABLES.presets = {table:'spec_presets', key:'key', fields:CH_PRESET_FIELDS, title:'Preset', auto:true, chx:true, audit:true,

    addBuiltin();

    loadLibrary = async function () { addBuiltin(); const ok = await orig.loadLibrary(); try { await loadAuto(); } catch (e) { AU.missing = 'Automation data could not be loaded: ' + (e.message || e); } try { await loadChoices(); } catch (e) { CH.loaded = false; CH.missing = 'Choices could not be loaded: ' + (e.message || e); } addBuiltin(); return ok; };

  }
  // ══ CHOICES: selections per item, variants, presets, limits (phase 1) ══════
  const CH = AU.ch = {items:[], defs:{}, opts:{}, presets:[], loaded:false, missing:''};
  AU.sel = {}; AU.dp = {};
  const ID_LINE = 'Finish, material, model and manufacturer: as selected by the Architect / Interior Designer in the finishes schedule, subject to the requirements of this section.';
  const OTHER = '__other';
  // Country filter: an item or warranty row belongs to a country when its "countries" text names the project's country
  // code or any word of its name (e.g. 'KSA,Saudi' or 'UAE,Emirates'). Blank or ALL = every country.
  AU.ctry = null;
  const ctryOk = txt => {
    const t = String(txt || '').trim(); if (!t || /^all$/i.test(t)) return true;
    const c = AU.ctry; if (!c) return true;
    return t.split(',').map(x => x.trim().toLowerCase()).filter(Boolean).some(tok => tok === 'all' || tok === c[0] || (c[1] && c[1].includes(tok)));
  };
  const chAll = () => CH.items.filter(i => ctryOk(i.countries));
  CH.warranty = [];
  AU.warrantyRows = div => CH.warranty.filter(r => String(r.division || '22') === String(div) && ctryOk(r.countries)).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  async function loadChoices() {
    try { const w = await sb.from('spec_warranty').select('*').order('sort').range(0, 9999); CH.warranty = w.error ? [] : actv(w.data); } catch (e) { CH.warranty = []; }
    const q = t => sb.from(t).select('*').order('sort').range(0, 9999);
    const [i, d, o, p] = await Promise.all([q('spec_choice_items'), q('spec_choice_defs'), q('spec_choice_opts'), q('spec_presets')]);
    const err = i.error || d.error || o.error || p.error;
    if (err) { CH.items = []; CH.defs = {}; CH.opts = {}; CH.presets = []; CH.loaded = false; CH.missing = 'Choice tables are not set up (' + err.message + '). Run spec_choices_migration.sql, then spec_choices_seed_valves.sql, in Supabase.'; return; }
    CH.items = actv(i.data); CH.defs = {}; CH.opts = {};
    actv(d.data).forEach(x => { (CH.defs[x.item_key] = CH.defs[x.item_key] || []).push(x); });
    actv(o.data).forEach(x => { const k = x.item_key + '|' + x.choice_key; (CH.opts[k] = CH.opts[k] || []).push(x); });
    CH.presets = actv(p.data); CH.missing = ''; CH.loaded = true;
  }
  const chDefs = it => CH.defs[it.item_key] || [];
  const chOpts = (it, c) => CH.opts[it.item_key + '|' + c.choice_key] || [];
  const chOpt = (it, c, key) => chOpts(it, c).find(x => x.opt_key === key);
  const chLines = t => String(t || '').split('\n').map(x => x.trim().replace(/^-\s*/, '')).filter(Boolean);
  // a rule on an option: rating below the project design pressure, or a project-option condition
  function optBlock(it, o, opts) {
    const dp = (AU.dp || {})[it.pgroup] || 0, bar = Number(o.rating_bar) || 0;
    if (bar > 0 && dp > 0 && bar < dp) return {level:'Block', reason:`Rated ${bar} bar, below the project design pressure of ${dp} bar.`};
    if (o.block_when && evalCond(o.block_when, opts || {})) return {level:o.block_level === 'Warn' ? 'Warn' : 'Block', reason:o.block_reason || 'Not allowed for the selected systems.'};
    return {level:null, reason:''};
  }
  const variantTitle = (v, i, n) => (v.label || '').trim() || (n > 1 ? 'Type ' + (i + 1) : '');
  function choiceLines(it, variants, o, T) {
    const lines = [], defs = chDefs(it), multi = variants.length > 1 || variants.some(v => (v.label || '').trim());
    variants.forEach((v, vi) => {
      const lv = multi ? 1 : 0, vt = variantTitle(v, vi, variants.length);
      if (multi) lines.push({lvl:0, html:'<b>' + esc(vt) + '</b>'});
      defs.forEach(c => {
        if (c.selector === 'Architect / ID') { lines.push({lvl:lv, html:esc(String(c.clause || '').trim() || ID_LINE)}); return; }
        const p = (v.picks || {})[c.choice_key], where = esc(it.label) + (vt ? ' – ' + esc(vt) : '') + ': ' + esc(c.label);
        if (!p) { lines.push({lvl:lv, html:`<span class="unres">[${where} – not chosen]</span>`}); return; }
        if (p === OTHER) { const ot = (v.other || {})[c.choice_key]; lines.push({lvl:lv, html:(ot && String(ot.text || '').trim()) ? esc(String(ot.text).trim()) : `<span class="unres">[${where} – "Other" text missing]</span>`}); return; }
        const op = chOpt(it, c, p);
        lines.push({lvl:lv, html:op ? fill(op.clause, T) : `<span class="unres">[${where} – option no longer in the catalogue]</span>`});
      });
    });
    const com = chLines(it.common);
    if (com.length) { if (multi) lines.push({lvl:0, html:'<b>Common to all types</b>'}); com.forEach(t => lines.push({lvl:multi ? 1 : 0, html:fill(t, T)})); }
    return lines;
  }
  function linesHtml(lines) {
    const cnt = [0, 0, 0, 0];
    return lines.map(x => { const l = Math.min(x.lvl, 3), n = cnt[l]++; for (let j = l + 1; j < 4; j++) cnt[j] = 0; return `<p class="l${l}"><span>${clauseLbl(l, n)}</span>${x.html}</p>`; }).join('');
  }
  function choiceArticles(S, o, T) {
    if (!CH.loaded) return [];
    const out = [];
    chAll().filter(i => i.section_num === S.num).forEach(it => {
      const vs = (AU.sel || {})[it.item_key]; if (!vs || !vs.length) return;
      out.push({title:String(it.label).toUpperCase(), html:linesHtml(choiceLines(it, vs, o, T))});
    });
    return out;
  }
  function choiceStds(S) {
    const codes = [];
    if (!CH.loaded) return codes;
    chAll().filter(i => i.section_num === S.num).forEach(it => {
      const vs = (AU.sel || {})[it.item_key] || [];
      vs.forEach(v => chDefs(it).forEach(c => { const p = (v.picks || {})[c.choice_key]; if (!p || p === OTHER) return; const op = chOpt(it, c, p); String((op && op.standards) || '').split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(s => { if (AU.std[s] && !codes.includes(s)) codes.push(s); }); }));
    });
    return codes;
  }
  // status of every engineer choice in the project (drives the sign-off block)
  function choiceStatus(nums, sel, o) {
    const r = {items:0, variants:0, choices:0, unset:0, unconf:0, blocked:0, other:0};
    if (!CH.loaded) return r;
    chAll().forEach(it => {
      if (!nums.has(it.section_num)) return;
      const vs = (sel || {})[it.item_key]; if (!vs || !vs.length) return;
      r.items++; r.variants += vs.length;
      vs.forEach(v => chDefs(it).forEach(c => {
        if (c.selector !== 'Engineer') return;
        r.choices++;
        const p = (v.picks || {})[c.choice_key];
        if (!p) { r.unset++; return; }
        if (p === OTHER) { r.other++; if (!(v.conf || {})[c.choice_key]) r.unconf++; return; }
        const op = chOpt(it, c, p);
        if (!op) { r.unset++; return; }
        if (optBlock(it, op, o).level === 'Block') r.blocked++;
        if (!(v.conf || {})[c.choice_key]) r.unconf++;
      }));
    });
    return r;
  }
  AU.choiceSig = (num, sel) => { const a = chAll().filter(i => i.section_num === num).map(i => [i.item_key, ((sel || {})[i.item_key] || []).map(v => [v.label || '', v.picks || {}, v.other || {}])]).filter(x => x[1].length); return a.length ? JSON.stringify(a) : ''; };
  AU.choiceStatus = choiceStatus;
  function presetPicks(it, p, o) {
    const out = {};
    chDefs(it).forEach(c => {
      if (c.selector !== 'Engineer' || c.code_critical) return;
      const ok = chOpts(it, c).filter(x => optBlock(it, x, o).level !== 'Block');
      const ex = (p.picks || {})[it.item_key + '|' + c.choice_key];
      let pick = ex && ok.find(x => x.opt_key === ex);
      if (!pick && p.tier) pick = ok.find(x => x.cost === p.tier);
      if (!pick) pick = ok[0];
      if (pick) out[c.choice_key] = pick.opt_key;
    });
    return out;
  }
  // ── Project › Selections ────────────────────────────────────────────────
  function SelectionsPanel({state, setState, opts, included, T, locked, isLead, editedNums}) {
    const [open, setOpen] = useState({}), [show, setShow] = useState({}), [q, setQ] = useState('');

    const nums = new Set(included.map(S => S.num)), sel = state.sel || {}, dp = AU.dp || {};
    const items = chAll().map((i, k) => ({i, k})).filter(x => nums.has(x.i.section_num) && (!q || (x.i.label + ' ' + x.i.item_key).toLowerCase().includes(q.toLowerCase()))).sort((a, b) => String(a.i.section_num).localeCompare(String(b.i.section_num)) || a.k - b.k).map(x => x.i);
    const outside = CH.items.filter(i => !nums.has(i.section_num) || !ctryOk(i.countries)).length;
    const unused = items.filter(i => !(sel[i.item_key] || []).length);
    const addMany = list => { if (locked || !list.length) return; setState(s => { const n = {...(s.sel || {})}; list.forEach(it => { if (!(n[it.item_key] || []).length) n[it.item_key] = [{id:Math.random().toString(36).slice(2, 8), label:'', picks:{}, other:{}, conf:{}}]; }); return {...s, sel:n}; }); };
    const st = choiceStatus(nums, sel, opts);
    const labels = [...new Set([...Object.values(sel).flat().map(v => v.label).filter(Boolean), 'FOH', 'BOH'])];
    const setVars = (key, fn) => { if (locked) return; setState(s => { const cur = (s.sel || {})[key] || [], next = fn(cur), n = {...(s.sel || {})}; if (next.length) n[key] = next; else delete n[key]; return {...s, sel:n}; }); };
    const patch = (key, id, fn) => setVars(key, cur => cur.map(v => v.id === id ? fn(v) : v));
    const addVar = key => setVars(key, cur => [...cur, {id:Math.random().toString(36).slice(2, 8), label:'', picks:{}, other:{}, conf:{}}]);
    const delVar = (key, id) => { if (window.confirm('Remove this variant and its choices?')) setVars(key, cur => cur.filter(v => v.id !== id)); };
    const pick = (it, v, c, val) => patch(it.item_key, v.id, x => ({...x, picks:{...x.picks, [c.choice_key]:val}, conf:{...x.conf, [c.choice_key]:false}}));
    const canConf = (c, v) => !locked && ((!c.code_critical && (v.picks || {})[c.choice_key] !== OTHER) || isLead);
    const confirm = (it, v, c, val) => patch(it.item_key, v.id, x => ({...x, conf:{...x.conf, [c.choice_key]:val}}));
    const confirmAll = (it, v) => patch(it.item_key, v.id, x => { const conf = {...x.conf}; chDefs(it).forEach(c => { const p = (x.picks || {})[c.choice_key]; if (c.selector !== 'Engineer' || !p) return; const op = p === OTHER ? null : chOpt(it, c, p); if (p !== OTHER && (!op || optBlock(it, op, opts).level === 'Block')) return; if (canConf(c, x)) conf[c.choice_key] = true; }); return {...x, conf}; });
    const applyPreset = (it, v, key) => { const p = CH.presets.find(x => x.key === key); if (!p) return; const picks = presetPicks(it, p, opts); patch(it.item_key, v.id, x => { const conf = {...x.conf}; Object.keys(picks).forEach(k => { conf[k] = false; }); return {...x, picks:{...x.picks, ...picks}, conf}; }); };
    const card = (l, v, n, k) => <div className={'health-card ' + (k || 'capacity')} style={{cursor:'default'}}><div className="h-label">{l}</div><div className="h-value">{v}</div><div className="h-note">{n}</div></div>;
    const chip = (k, t, title) => <span className={'status-chip ' + k} title={title}>{t}</span>;
    return <div className="no-print">
      <div className="sys-top"><div><div className="schedule-eyebrow">Selections</div><div className="schedule-title">Choices, variants and presets</div></div>
        <input className="piw-search" style={{maxWidth:260}} value={q} onChange={e => setQ(e.target.value)} placeholder="Search items"/></div>
      <div className="schedule-health" style={{marginBottom:10}}>
        {card('Items in use', st.items, `${st.variants} variant${st.variants === 1 ? '' : 's'}`)}
        {card('To confirm', st.unconf + st.unset, st.unset ? `${st.unset} not chosen yet` : 'proposed, not confirmed', st.unconf + st.unset ? 'review' : 'pass')}
        {card('Not allowed', st.blocked, 'below design pressure or code rule', st.blocked ? 'blocked' : 'pass')}
        {card('"Other" (Lead review)', st.other, 'typed text, not from the catalogue', st.other ? 'review' : 'pass')}
        {card('Design pressure', `${dp.plumbing || '—'} / ${dp.fire || '—'}`, 'plumbing / fire, bar (Setup)', dp.plumbing || dp.fire ? 'capacity' : 'review')}
      </div>
      <datalist id="chxlabels">{labels.map(l => <option key={l} value={l}/>)}</datalist>
      {!locked && unused.length > 0 && <div style={{display:'flex',alignItems:'center',gap:10,margin:'0 0 10px',padding:'8px 12px',background:'#eef4ff',border:'1px solid #cfe0ff',borderRadius:8,fontSize:12,color:'#424245'}}><span style={{flex:1}}><b>{unused.length}</b> item{unused.length === 1 ? '' : 's'} not used yet{q ? ' (matching your search)' : ''}. Add them all, then choose the options for each.</span><button className="schedule-action" onClick={() => addMany(unused)}>＋ Use all {unused.length} items</button></div>}
      {items.length === 0 && <div className="piw-empty big">No catalogue items belong to the sections and country of this project.</div>}
      {items.map((it, ix) => { const secHead = ix === 0 || items[ix - 1].section_num !== it.section_num; const secUnused = items.filter(x => x.section_num === it.section_num && !(sel[x.item_key] || []).length);
        return <React.Fragment key={it.item_key}>
        {secHead && <div style={{display:'flex',alignItems:'center',gap:10,margin:'14px 2px 6px'}}><span className="spec-div" style={{padding:0,flex:1}}>Section {fmtNum(it.section_num)}{(included.find(S => S.num === it.section_num) || {}).title ? ' – ' + titleCase(included.find(S => S.num === it.section_num).title) : ''}</span>{!locked && secUnused.length > 1 && <button className="schedule-action" onClick={() => addMany(secUnused)}>＋ Use all in this section ({secUnused.length})</button>}</div>}
        {(() => {
        const vs = sel[it.item_key] || [], isOpen = open[it.item_key] !== undefined ? open[it.item_key] : vs.length > 0;
        const defs = chDefs(it), edited = editedNums.has(it.section_num);
        const stI = choiceStatus(new Set([it.section_num]), {[it.item_key]:vs}, opts), pend = stI.unset + stI.unconf;
        return <div key={it.item_key} className="chx-card">
          <div className="chx-head" onClick={() => setOpen({...open, [it.item_key]:!isOpen})}>
            <span className="chx-caret">{isOpen ? '▾' : '▸'}</span><b>{it.label}</b><span className="chx-sub">{it.item_key} · section {fmtNum(it.section_num)}</span>
            {it.status === 'Check' && chip('review', 'check source', it.note || '')}
            <span style={{flex:1}}/>
            {vs.length > 0 && chip('draft', vs.length + (vs.length === 1 ? ' variant' : ' variants'))}
            {vs.length > 0 && (pend ? chip('review', pend + ' to confirm') : stI.blocked ? chip('blocked', 'not allowed') : chip('pass', 'confirmed'))}
            {!locked && <button className="schedule-action" onClick={e => { e.stopPropagation(); addVar(it.item_key); setOpen({...open, [it.item_key]:true}); }}>{vs.length ? '+ Add variant' : '+ Use in this project'}</button>}
          </div>
          {isOpen && <div className="chx-body">
            {it.note && <div className="chx-note">{it.note}</div>}
            {edited && vs.length > 0 && <div className="chx-note red">Section {fmtNum(it.section_num)} has project edits, so this article is not printed there. Open Sections › "↺ Library text" to regenerate it.</div>}
            {vs.length === 0 && <div style={{fontSize:11,color:'#86868b',padding:'6px 2px'}}>Not used in this project yet. Add a variant to include it in the specification.</div>}
            {vs.map((v, vi) => <div key={v.id} className="chx-var">
              <div className="chx-vh">
                <input list="chxlabels" disabled={locked} value={v.label} onChange={e => patch(it.item_key, v.id, x => ({...x, label:e.target.value}))} placeholder={vs.length > 1 ? 'Variant name (e.g. FOH, BOH, Type A)' : 'Variant name (optional – e.g. FOH, BOH, Type A)'}/>
                {!locked && CH.presets.length > 0 && <select value="" onChange={e => applyPreset(it, v, e.target.value)}><option value="">Apply preset…</option>{CH.presets.map(p => <option key={p.key} value={p.key}>{p.label}</option>)}</select>}
                {!locked && <button className="schedule-action" onClick={() => confirmAll(it, v)}>Confirm all</button>}
                {!locked && <button className="schedule-action" style={{color:'#b91c1c'}} onClick={() => delVar(it.item_key, v.id)}>Remove</button>}
              </div>
              <table className="chx-t"><tbody>
                {defs.map(c => {
                  if (c.selector === 'Architect / ID') return <tr key={c.choice_key}><td className="chx-l">{c.label}</td><td colSpan={3} className="chx-id">By the Architect / Interior Designer (finishes schedule). The specification prints one standard line; nothing to choose here.</td></tr>;
                  const p = (v.picks || {})[c.choice_key], op = p && p !== OTHER ? chOpt(it, c, p) : null, bl = op ? optBlock(it, op, opts) : {level:null};
                  const cs = !p ? 'none' : (op && bl.level === 'Block') ? 'blocked' : (v.conf || {})[c.choice_key] ? 'ok' : 'prop';
                  const lockSel = locked || (c.code_critical && !isLead);
                  return <tr key={c.choice_key}>
                    <td className="chx-l">{c.label}{c.code_critical && <span className="chx-lock" title="Code-critical: only a Lead can change it">Lead</span>}</td>
                    <td className="chx-s"><select disabled={lockSel} value={p || ''} onChange={e => pick(it, v, c, e.target.value)}>
                      <option value="">— choose —</option>
                      {chOpts(it, c).map(x => { const b = optBlock(it, x, opts); return <option key={x.opt_key} value={x.opt_key} disabled={b.level === 'Block'}>{x.label}{x.status === 'Check' ? ' (check)' : ''}{b.level === 'Block' ? ' — not allowed' : b.level === 'Warn' ? ' — warning' : ''}</option>; })}
                      {c.allow_other && <option value={OTHER}>Other (type it)…</option>}
                    </select>
                    {p === OTHER && <div className="chx-oth"><input disabled={lockSel} value={((v.other || {})[c.choice_key] || {}).text || ''} onChange={e => patch(it.item_key, v.id, x => ({...x, other:{...x.other, [c.choice_key]:{...((x.other || {})[c.choice_key] || {}), text:e.target.value}}, conf:{...x.conf, [c.choice_key]:false}}))} placeholder="Clause text as it should print"/><input disabled={lockSel} value={((v.other || {})[c.choice_key] || {}).reason || ''} onChange={e => patch(it.item_key, v.id, x => ({...x, other:{...x.other, [c.choice_key]:{...((x.other || {})[c.choice_key] || {}), reason:e.target.value}}}))} placeholder="Reason (client request, availability…)"/></div>}
                    {op && op.notes && <div className="chx-hint">{op.notes}</div>}
                    {op && bl.level && <div className={'chx-hint ' + (bl.level === 'Block' ? 'bad' : 'warn')}>{bl.level === 'Block' ? 'Not allowed: ' : 'Warning: '}{bl.reason}</div>}
                    {c.choice_key === 'rating' && !dp[it.pgroup] && <div className="chx-hint warn">Set the {it.pgroup} design pressure on Setup so ratings can be checked.</div>}
                    </td>
                    <td className="chx-b">{op && (op.source || op.standards) ? <span className="chx-src" title={'Source: ' + (op.source || '') + (op.standards ? '\nStandards: ' + op.standards : '')}>source</span> : null}</td>
                    <td className="chx-c">{cs === 'none' ? chip('blocked', 'not chosen') : cs === 'blocked' ? chip('blocked', 'not allowed') : cs === 'ok' ? <button className="chx-ok" disabled={!canConf(c, v)} onClick={() => confirm(it, v, c, false)} title="Confirmed – click to unconfirm">✓ Confirmed</button> : <button className="chx-pr" disabled={!canConf(c, v)} onClick={() => confirm(it, v, c, true)} title={canConf(c, v) ? 'Click to confirm' : 'Only a Lead can confirm this'}>Proposed</button>}{p === OTHER && chip('review', 'Lead review')}</td>
                  </tr>; })}
              </tbody></table>
            </div>)}
            {vs.length > 0 && <div style={{marginTop:6}}><a href="#" style={{fontSize:11,fontWeight:700,color:'#007aff'}} onClick={e => { e.preventDefault(); setShow({...show, [it.item_key]:!show[it.item_key]}); }}>{show[it.item_key] ? 'Hide' : 'Show'} specification text</a>
              {show[it.item_key] && <div className="spec-doc sd" style={{border:'1px solid #e1e1e6',borderRadius:8,padding:'10px 14px',marginTop:6,background:'#fff'}} dangerouslySetInnerHTML={{__html:`<p class="ar"><span>x.x</span>${esc(String(it.label).toUpperCase())}</p>` + linesHtml(choiceLines(it, vs, opts, T))}}/>}</div>}
          </div>}
        </div>; })()}</React.Fragment>; })}
      {outside > 0 && <div style={{fontSize:10.5,color:'#86868b',marginTop:8}}>{outside} catalogue item{outside === 1 ? '' : 's'} belong to other sections or other countries and are hidden.</div>}
    </div>;
  }
  AU.SelectionsPanel = SelectionsPanel;
  const CH_ITEM_FIELDS = [['item_key','Key (e.g. Ball valve - fire protection)'],['label','Prints as (article heading)'],['section_num','Section no.'],['pgroup','Pressure group',['fire','plumbing']],['countries','Countries (blank = all; e.g. KSA,Saudi or UAE,Emirates)'],['common','Common clauses (one per line, printed for every variant)','text'],['note','Note'],['status','Status',['Verified','Check']],['source','Source'],['sort','Sort','num'],['active','Active','bool']];
  const CH_DEF_FIELDS = [['item_key','Item key'],['choice_key','Choice key'],['label','Label'],['selector','Selected by',['Architect / ID','Engineer']],['code_critical','Code-critical (Lead only)','bool'],['allow_other','Allow "Other (type it)"','bool'],['clause','Architect / ID: own wording (blank = standard line)','text'],['sort','Sort','num'],['active','Active','bool']];
  const CH_OPT_FIELDS = [['item_key','Item key'],['choice_key','Choice key'],['opt_key','Option key'],['label','Label (dropdown text)'],['clause','Clause printed in the specification','text'],['standards','Standards cited (separate with ;)'],['cost','Cost tag (Low / Medium / High, blank = none)'],['rating_bar','Rating in bar (0 = not a rating)','num'],['block_when','Rule: when this project option is on (condition)'],['block_level','Rule level (Block / Warn)'],['block_reason','Rule reason'],['status','Status',['Verified','Check']],['source','Source'],['notes','Notes'],['sort','Sort','num'],['active','Active','bool']];
  const WAR_FIELDS = [['row_type','Row type',['note','item']],['countries','Countries (e.g. KSA,Saudi; ALL = every country)'],['division','Division (e.g. 22)'],['group_label','Group heading (e.g. PLUMBING)'],['description','Description (equipment, or the note text)','text'],['warranty_years','Warranty from the Taking Over Certificate (years)','num'],['employer_inspection','Factory inspection by Employer (X or -)'],['fat','FAT / third party / random sample test (X or -)'],['service_life_years','Service life (years)','num'],['remarks','Remarks'],['sort','Sort','num'],['active','Active','bool']];
  const CH_PRESET_FIELDS = [['key','Key'],['label','Label'],['tier','Picks options tagged (Low / Medium / High)'],['picks','Explicit picks (JSON: {"Item key|choice_key":"opt_key"})','json'],['note','Note'],['sort','Sort','num'],['active','Active','bool']];

  AU.itemSig = (num, o) => { const m = {}; if (AU.itemsLoaded) includedItems({num}, o).forEach(it => { const r = AU.itemRev[it.code]; if (r) m[it.code] = r.rev; }); return m; };
  AU._test = {analyse, parseRel, parseStd, markXrefs, genSectionAuto, loadAuto, install};
  try { install(); } catch (e) { console.error('spec_auto: install failed – page runs without automation', e); }
})();

ReactDOM.createRoot(document.getElementById("root")).render(<RootApp/>);
</script> 
</body>
