  /* ── Global Resource Planning design system ────────────────────────────── */
  :root{
    --app-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
    --app-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    --app-bg:#f5f5f7;--app-surface:#fff;--app-surface-subtle:#fafafb;--app-border:#d2d2d7;
    --app-text:#1d1d1f;--app-text-2:#424245;--app-muted:#86868b;--app-blue:#007aff;
    --app-blue-soft:#e8f0fe;--app-green:#34c759;--app-green-soft:#e8faf0;
    --app-amber:#ff9500;--app-amber-soft:#fff4e0;--app-red:#ff3b30;--app-red-soft:#fff0ee;
    --app-radius:10px;--app-radius-large:14px;--app-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  }
  #root,#root *{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root{color:var(--app-text);font-size:13px;line-height:1.45;}
  #root input,#root select,#root textarea{font-family:var(--app-sans)!important;border-color:var(--app-border)!important;border-radius:var(--app-radius)!important;color:var(--app-text)!important;background:#fff!important;}
  #root input:focus,#root select:focus,#root textarea:focus{outline:none!important;border-color:var(--app-blue)!important;box-shadow:0 0 0 3px rgba(0,122,255,.12)!important;}
  #root button{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root button:focus-visible,#root a:focus-visible,#root input:focus-visible,#root select:focus-visible{outline:3px solid rgba(0,122,255,.26)!important;outline-offset:2px;}
  .global-page{background:var(--app-bg)!important;min-height:100dvh!important;}
  .app-header{position:relative!important;background:rgba(255,255,255,.9)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:0 1px 3px rgba(0,0,0,.04)!important;padding:14px 24px!important;}
  .app-header *{color:var(--app-text)!important;}.app-header [style*="color:\"#86868b\""]{color:var(--app-muted)!important;}
  .app-tabbar{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(18px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:none!important;}
  .app-tabbar button{border-radius:0!important;font-weight:650!important;}.app-tabbar button:hover{background:var(--app-surface-subtle)!important;color:var(--app-text)!important;}
  .app-content{padding:20px 24px 30px!important;}
  .global-page [style*="borderRadius:12"],.global-page [style*="borderRadius:16"]{box-shadow:var(--app-shadow)!important;}
  .global-page [style*="textTransform:\"uppercase\""]{font-size:10px!important;letter-spacing:.06em!important;font-weight:700!important;}
  /* Input workspace */
  .pump-input-workspace{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .pump-input-workspace [style*="borderTop"]{border-color:#ececf0!important;}
  .live-calc{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .live-calc-summary{background:var(--app-surface-subtle)!important;border-bottom:1px solid var(--app-border)!important;}
  .live-calc-summary *{color:var(--app-text)!important;}.live-calc-summary [style*="color:"]{color:var(--app-muted)!important;}
  .live-calc-summary [style*="fontSize:15"]{color:var(--app-text)!important;font-family:var(--app-display)!important;font-weight:750!important;}
  .live-calc-section{background:#f5f5f7!important;color:var(--app-muted)!important;border-color:#e8e8ed!important;}
  .live-calc-row{border-bottom:1px solid #f0f0f2!important;padding:6px 14px!important;}
  /* Calculation sheets */
  .calc-sheet{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .calc-sheet-header{background:var(--app-surface)!important;color:var(--app-text)!important;border-bottom:1px solid var(--app-border)!important;padding:16px 20px!important;}
  .calc-sheet-header *{color:var(--app-text)!important;}.calc-sheet-header > div > div:first-child > div:first-child,.calc-sheet-header > div > div:last-child{color:var(--app-muted)!important;}
  .calc-sheet-header [style*="fontSize:13"]{font-family:var(--app-display)!important;font-size:16px!important;font-weight:750!important;letter-spacing:-.02em!important;}
  .calc-basis{background:var(--app-blue-soft)!important;border-bottom:1px solid #c8dafa!important;color:#265c9f!important;font-family:var(--app-sans)!important;padding:7px 20px!important;letter-spacing:0!important;}
  .calc-section{background:#1e3a5f!important;color:#fff!important;padding:6px 20px!important;font-size:10px!important;letter-spacing:.07em!important;}
  .calc-step-row{border-bottom:1px solid #ececf0!important;padding:7px 20px!important;min-height:36px!important;}.calc-step-row span{font-family:var(--app-sans)!important;}.calc-step-row [style*="fontSize:14"]{font-family:var(--app-display)!important;}
  .calc-result-banner{background:#1d1d1f!important;padding:14px 20px!important;}.calc-result-banner *{font-family:var(--app-sans)!important;}.calc-result-banner [style*="fontSize:15"]{font-family:var(--app-display)!important;}
  .duty-point-wrap{background:var(--app-surface-subtle)!important;padding:12px 20px!important;}.duty-point-table{font-family:var(--app-sans)!important;}.duty-point-table th{color:var(--app-muted)!important;font-size:9px!important;letter-spacing:.05em!important;text-transform:uppercase!important;}.duty-point-table td{font-variant-numeric:tabular-nums;}
  /* Reference data and project cards */
  .project-card,.reference-panel{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .project-card:hover{border-color:#b8b8c0!important;box-shadow:0 6px 18px rgba(0,0,0,.07)!important;}
  /* Consistent labels and numerical alignment across all pages */
  #root label{font-size:10px!important;font-weight:700!important;letter-spacing:.04em!important;color:var(--app-text-2)!important;}
  #root [style*="fontFamily"]{font-family:var(--app-sans)!important;font-variant-numeric:tabular-nums;}
  @media screen and (max-width:700px){.app-header{padding:12px 14px!important;}.app-content{padding:14px 12px 24px!important;}.calc-sheet-header{padding:14px!important;}.calc-basis,.calc-section,.calc-step-row,.duty-point-wrap,.calc-result-banner{padding-left:14px!important;padding-right:14px!important;}}
  @media print{#root,#root *{font-family:Arial,sans-serif!important;letter-spacing:0!important;}.calc-sheet{box-shadow:none!important;border-radius:0!important;}.calc-sheet-header{border-bottom:2px solid #1e3a5f!important;}.calc-result-banner{background:#fff!important;border-top:2px solid #1e3a5f!important;}.calc-result-banner *{color:#1d1d1f!important;}.calc-section{background:#1e3a5f!important;color:#fff!important;}}

  /* ── Phone layout ──────────────────────────────────────────────────────
     The project row and the reference-data grids were both laid out for a
     desktop width only. On a phone the four project buttons stayed on one
     flex line and Delete was pushed off-screen, and the reference grids
     compressed every column until the inputs were unreadable. Both are laid
     out with inline styles in JS, so these rules use !important to override
     them rather than threading a breakpoint through the components. */
  @media screen and (max-width:700px){
    /* Project row: title above, then a 2x2 button grid that always fits. */
    .project-card{flex-direction:column!important;align-items:stretch!important;gap:12px!important;padding:14px!important;}
    .project-card>div:first-child{width:100%;}
    .project-card>div:last-child{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex-shrink:1!important;}
    .project-card>div:last-child>button{width:100%;padding:10px 8px!important;font-size:12px!important;}
    /* Open is the primary action — give it the full first row. */
    .project-card>div:last-child>button:first-child{grid-column:span 2;}
    /* Reference-data grids scroll sideways instead of crushing the columns. */
    .refgrid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .refgrid-scroll>div{min-width:560px;}
    /* Header actions wrap rather than overflowing the notch area. */
    .app-header>div{flex-wrap:wrap!important;gap:10px!important;}
    /* Two- and three-column field grids are unreadable at phone width. They
       are laid out with inline styles in JS, hence !important here. */
    .fg2,.fg3,.fg5{grid-template-columns:1fr!important;}
    .pump-input-workspace{padding:14px!important;}
  }
  /* The pump editor is three side-by-side panes on desktop: list, form, live
     calculation. Below 900px they must stack, otherwise the form is crushed
     into a few characters' width and the live panel is unreadable. */
  @media screen and (max-width:900px){
    .pumpwork{flex-direction:column!important;gap:12px!important;}
    .pumpwork>.pumplist,.pumpwork>.pumpcalc{width:100%!important;flex:1 1 auto!important;}
    /* Sticky positioning only makes sense beside the form, not above it. */
    .pumpcalc .live-calc{position:static!important;max-height:none!important;}
    .pumpcalc .live-calc>div:last-child{max-height:420px!important;}
    /* The pump picker becomes a horizontal strip so the form stays in view. */
    .pumplist-items{display:flex!important;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .pumplist-items>div{flex:0 0 auto;min-width:150px;margin-bottom:0!important;}
    .pumplist-add{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;}
    .pumplist-add>button{margin-bottom:0!important;}
  }
  @media print{

    .screen-hide{display:block!important}
    .calcsplit{display:block!important}
    .calcsplit-pane{display:block!important}
    .calcpick{display:none!important}
    .calcwrap{display:block!important}
    /* Print at true A4 — undo every preview-scaling rule. */
    .ppreview{height:auto!important;overflow:visible!important;position:static!important}
    .ppreview-page{position:static!important;transform:none!important;width:auto!important}}

    if (el.nodeType !== 1) return;

          {canEdit && <button className="schedule-action" onClick={() => setEdit(tab === 'sections' ? {sec:null} : {row:tab === 'items' ? {code:'IT-' + String((rows.items || []).length + 1).padStart(4, '0'), status:'Draft', active:true} : tab === 'vendors' ? {code:'VN-' + String((rows.vendors || []).length + 1).padStart(3, '0'), status:'Draft', active:true} : {active:true}, isNew:true})}>＋ New</button>}

            {LIB.filter(S => !f || (S.num + ' ' + S.title).toLowerCase().includes(f.toLowerCase())).map(S => { const cl = S.parts.reduce((a, P) => a + P.arts.reduce((b, A) => b + A.items.length, 0), 0); const unk = condKeys(S.cond).filter(k => !OPTMAP[k]); return <tr key={S.num} onClick={() => setEdit({sec:S})}><td className="tag-code">{S.num}</td><td>{S.title}</td><td>{isAnnexNum(S.num) ? <Chip k="draft">Annexure B</Chip> : S.cond ? <Chip k="review">Project-specific</Chip> : <Chip k="pass">General</Chip>}{hardLocWords(S.body).length ? <div style={{fontSize:9,color:'#b42318',marginTop:3}} title="Replace with {{CD}}, {{MUNI}}, {{WATER}}, {{FIRE_CODE}} etc. so the text follows the project location">Hard-coded location: {hardLocWords(S.body).join(', ')}</div> : null}{hasLibMfrArticle(S) && !isAnnexNum(S.num) ? <div style={{fontSize:9,color:'#a76200',marginTop:3}} title="2.1 MANUFACTURERS is generated automatically">Own MANUFACTURERS article ignored</div> : null}</td><td style={{fontSize:10}}>{condLabel(S.cond) || 'every project'}{unk.length ? <div style={{color:'#d8332b'}}>unknown key: {unk.join(', ')}</div> : null}</td><td className="num">{cl}</td><td style={{fontSize:10}}>{S.updated ? fmtDay(S.updated) + ' ' + (S.by || '') : ''}</td><td><button className="schedule-action">{canEdit ? 'Edit' : 'View'}</button></td></tr>; })}
            {(rows.inactive || []).length > 0 && <tr><td colSpan={7} style={{background:'#f5f5f7',fontSize:10,fontWeight:800}}>DEACTIVATED ({rows.inactive.length}) — open and save to restore</td></tr>}
            {(rows.inactive || []).map(r => <tr key={'x' + r.num} style={{opacity:.55}} onClick={async () => { const {data} = await sb.from('spec_sections').select('*').eq('num', r.num).single(); setEdit({sec:sectionFromRow(data)}); }}><td className="tag-code">{r.num}</td><td>{r.title}</td><td><Chip k="draft">Inactive</Chip></td><td colSpan={3}/><td><button className="schedule-action">Open</button></td></tr>)}
          </tbody></table>
          : <table className="schedule-table" style={{minWidth:900,tableLayout:'auto'}}><thead><tr className="labels">{cfg.fields.filter(x => !['sort','choices','default_value','data','source'].includes(x[0])).map(([k, l]) => <th key={k}>{l}</th>)}<th></th></tr></thead><tbody>
            {list.map((r, i) => <tr key={i} onClick={() => setEdit({row:r, isNew:false})} style={{opacity:r.active === false ? .5 : 1}}>{cfg.fields.filter(x => !['sort','choices','default_value','data','source'].includes(x[0])).map(([k]) => <td key={k} style={{fontSize:10.5,maxWidth:260,whiteSpace:'normal'}}>{k === 'status' ? stChip(r[k]) : k === 'active' ? (r[k] === false ? 'No' : 'Yes') : k === 'include_when' || k === 'dep' ? (condLabel(r[k]) || 'always') : String(r[k] ?? '')}</td>)}<td><button className="schedule-action">{canEdit ? 'Edit' : 'View'}</button></td></tr>)}
            {!list.length && <tr><td colSpan={20} className="empty-schedule">No rows.</td></tr>}

        </div>

      </div>
    </div>
    {edit && edit.sec !== undefined && <SectionEditor key={'s' + ver} S={edit.sec} onClose={() => setEdit(null)} onSaved={done} canEdit={canEdit} who={who}/>}
    {edit && edit.row && <RowEditor key={'r' + ver} cfg={cfg} row={edit.row} isNew={edit.isNew} onClose={() => setEdit(null)} onSaved={done} canEdit={canEdit} who={who}/>}
  </div>;
}

// v1.12.0 · project picture for the project card (same as the pump calculator; shown on the card only, never printed)
async function specCardImage(projectId, file) {
  if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 5242880) throw new Error("Use a PNG, JPEG or WebP picture up to 5 MB.");
  const im = await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("The picture could not be read.")); }; i.src = u; });
  const W = Math.min(1200, im.naturalWidth), H = Math.max(1, Math.round(im.naturalHeight * W / im.naturalWidth)), c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(im, 0, 0, W, H);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82)); if (!blob) throw new Error("The picture could not be prepared.");
  const path = `spec-projects/${projectId}/card_${Date.now()}.jpg`;   // v1.12.1: own folder, allowed by spec_card_pictures_v1.sql
  const { error } = await sb.storage.from("mep-client-logos").upload(path, blob, {upsert:false, contentType:"image/jpeg"});
  if (error) throw new Error("Picture upload failed: " + error.message + (/row-level security/i.test(error.message) ? " — run spec_card_pictures_v1.sql in Supabase › SQL Editor." : ""));
  const { data } = sb.storage.from("mep-client-logos").getPublicUrl(path);
  return {url:data.publicUrl, path};
}

}

// ══════════════════════════════════════════════════════════════════════════
// v1.18.1 · TEAM & ACCESS — one sign-off level per person
//   Engineer → writes · Checker (Senior / Principal / Lead) → first sign-off
//   Approver (Associate) → final approval · View only → no sign-off
// Stored in engineer_roles (engineer / lead / associate / viewer), shared with the Equipment Calculator.
// ══════════════════════════════════════════════════════════════════════════
const TA_LEVELS = [
  ['engineer', 'Engineer', 'Writes the specification', ['engineer']],
  ['checker', 'Checker', 'Senior / Principal / Lead · first sign-off', ['engineer', 'lead']],
  ['approver', 'Approver', 'Associate · final approval', ['engineer', 'associate']],
  ['none', 'View only', 'No sign-off', ['viewer']],
];
const TA_MANAGED = ['engineer', 'lead', 'associate', 'viewer'];
const taSuggest = desig => { const d = String(desig || ''); return /associate|director|partner/i.test(d) ? 'approver' : /senior|principal|lead|manager|head/i.test(d) ? 'checker' : 'engineer'; };
const taGuess = email => { const n = String(email || '').split('@')[0].replace(/[._\-]+/g, ' ').replace(/\d+/g, '').trim().replace(/\b\w/g, c => c.toUpperCase()); return {name:n, initials:n.split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 3).toUpperCase()}; };
function TeamAccess({session, me, team, roles, reload, onBack}) {
  const userId = session.user.id, myEmail = (session.user.email || '').toLowerCase();
  const [tab, setTab] = useState('requests'); const [pend, setPend] = useState(null); const [hist, setHist] = useState(false);
  const [msg, setMsg] = useState(''); const [busy, setBusy] = useState(''); const [q, setQ] = useState(''); const [form, setForm] = useState({}); const [edit, setEdit] = useState({}); const [add, setAdd] = useState(null);
  const loadPend = useCallback(async () => { const {data, error} = await sb.from('pending_users').select('*').order('requested_at', {ascending:false}).range(0, 999); if (error) { setMsg('Access requests could not be read: ' + error.message); setPend([]); return; } setPend(data || []); }, []);
  useEffect(() => { loadPend(); }, [loadPend]);
  const lc = x => String(x || '').toLowerCase();
  const rolesOf = em => roles.filter(r => lc(r.email) === lc(em));
  const hasRole = (em, k) => rolesOf(em).some(r => r.role === k && r.active !== false);
  const isAdm = t => !!t.is_admin || hasRole(t.email, 'admin');
  const levelOf = em => hasRole(em, 'associate') ? 'approver' : hasRole(em, 'lead') ? 'checker' : hasRole(em, 'engineer') ? 'engineer' : 'none';
  const ok = r => { if (r.error) throw new Error(r.error.message); return r; };
  const run = async (label, fn, done) => { setBusy(label); setMsg(''); let good = false; try { await fn(); good = true; setMsg(done); } catch (e) { setMsg('Failed: ' + ((e && e.message) || e)); } try { await reload(true); await loadPend(); } catch (e) {} setBusy(''); return good; };
  const dupIni = (ini, em) => !!ini && team.some(t => lc(t.email) !== lc(em) && String(t.initials || '').toUpperCase() === ini.toUpperCase());
  const setRole = async (em, k, on) => {
    const ex = rolesOf(em).filter(r => r.role === k);
    if (ex.length) { for (const r of ex) if ((r.active !== false) !== on) ok(await sb.from('engineer_roles').update({active:on}).eq('id', r.id)); return; }
    if (on) ok(await sb.from('engineer_roles').insert({email:lc(em), role:k, scope:'global', active:true, created_by:userId}));
  };
  const setLevel = async (em, lv) => { const want = (TA_LEVELS.find(x => x[0] === lv) || TA_LEVELS[0])[3]; for (const k of TA_MANAGED) await setRole(em, k, want.includes(k)); };
  const saveProfile = async (em, f) => {
    const ex = team.find(t => lc(t.email) === lc(em));
    const row = {name:f.name.trim(), initials:f.initials.trim().toUpperCase(), desig:(f.desig || '').trim() || null, active:true};
    if (ex) ok(await sb.from('engineers').update(row).eq('id', ex.id)); else ok(await sb.from('engineers').insert({...row, email:lc(em)}));
  };
  const check = (em, f) => !f.name.trim() ? 'Enter the full name.' : !f.initials.trim() ? 'Enter the initials (used on sign-offs).' : dupIni(f.initials.trim(), em) ? `Initials ${f.initials.toUpperCase()} are already used by another person — sign-offs would be ambiguous.` : '';
  const formOf = p => form[p.id] || (() => { const g = taGuess(p.email), ex = team.find(t => lc(t.email) === lc(p.email)); const desig = (ex && ex.desig) || ''; return {name:(ex && ex.name) || g.name, initials:(ex && ex.initials) || g.initials, desig, level:taSuggest(desig), admin:false}; })();
  const setF = (p, patch) => setForm(s => ({...s, [p.id]:{...formOf(p), ...patch}}));
  const approve = p => { const f = formOf(p), bad = check(p.email, f); if (bad) return setMsg(bad);
    run('Approving…', async () => {
      await saveProfile(p.email, f); await setLevel(p.email, f.level); if (f.admin) await setRole(p.email, 'admin', true);
      ok(await sb.from('pending_users').update({status:'approved', reviewed_at:new Date().toISOString(), reviewed_by:userId, note:null}).eq('id', p.id));
    }, `${f.name} approved as ${TA_LEVELS.find(x => x[0] === f.level)[1]}. They can sign in to both apps now (they may need to refresh).`); };
  const reject = p => { const n = window.prompt(`Reject access for ${p.email}?\n\nReason (shown to them):`, ''); if (n === null) return;
    run('Rejecting…', async () => ok(await sb.from('pending_users').update({status:'rejected', reviewed_at:new Date().toISOString(), reviewed_by:userId, note:n.trim() || 'Access not approved.'}).eq('id', p.id)), p.email + ' rejected.'); };
  const changeLevel = (t, lv) => run('Saving…', () => setLevel(t.email, lv), `${t.name} is now ${TA_LEVELS.find(x => x[0] === lv)[1]}.`);
  const toggleAdmin = (t, on) => {
    if (!on && lc(t.email) === myEmail) return setMsg('You cannot remove your own Admin rights.');
    if (!on && team.filter(x => x.active !== false && isAdm(x)).length <= 1) return setMsg('This is the last Admin — make someone else Admin first.');
    if (!on && t.is_admin && !hasRole(t.email, 'admin')) return setMsg(`${t.name} is Admin through the profile flag in Supabase (engineers.is_admin) — change it there.`);
    run('Saving…', () => setRole(t.email, 'admin', on), `${t.name}: Admin ${on ? 'given' : 'removed'}.`);
  };
  const toggleActive = t => { if (lc(t.email) === myEmail) return setMsg('You cannot deactivate yourself.');
    const on = t.active === false; if (!on && !window.confirm(`Deactivate ${t.name}?\n\nThey can no longer open either app. Their past sign-offs stay on record.`)) return;
    run('Saving…', async () => ok(await sb.from('engineers').update({active:on}).eq('id', t.id)), `${t.name} ${on ? 'reactivated' : 'deactivated'}.`); };
  const saveEdit = t => { const f = edit[t.id]; const bad = check(t.email, f); if (bad) return setMsg(bad);
    run('Saving…', () => saveProfile(t.email, f), `${f.name} saved.`).then(g => g && setEdit(e => { const n = {...e}; delete n[t.id]; return n; })); };
  const addMember = () => { const f = add, em = lc(f.email).trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return setMsg('Enter a valid email.');
    if (team.some(t => lc(t.email) === em)) return setMsg(em + ' is already on the team.');
    const bad = check(em, f); if (bad) return setMsg(bad);
    run('Adding…', async () => { await saveProfile(em, f); await setLevel(em, f.level); if (f.admin) await setRole(em, 'admin', true); }, `${f.name} added. They sign up with "Request Access" using ${em}; no approval step is needed.`).then(g => g && setAdd(null)); };
  const pending = (pend || []).filter(p => p.status === 'pending'), done = (pend || []).filter(p => p.status !== 'pending');
  const shown = team.filter(t => !q || [t.name, t.email, t.initials, t.desig, TA_LEVELS.find(x => x[0] === levelOf(t.email))[1]].join(' ').toLowerCase().includes(q.toLowerCase()));
  const i1 = {padding:'5px 8px', fontSize:12, border:'1px solid #d2d2d7', borderRadius:7, width:'100%', background:'#fff'};
  const levelSel = (val, onChange, dis) => <select disabled={dis} style={{...i1, fontWeight:700}} value={val} onChange={e => onChange(e.target.value)}>{TA_LEVELS.map(([k, l, d]) => <option key={k} value={k}>{l} — {d}</option>)}</select>;
  const counts = TA_LEVELS.map(([k, l]) => [l, team.filter(t => t.active !== false && levelOf(t.email) === k).length]);
  const tabBtn = on => on ? {background:'#fff', color:'#007aff', boxShadow:'0 1px 2px rgba(0,0,0,.08)'} : undefined;
  return <div className="global-page pl-page">
    <header className="pl-head"><div className="pl-head-in">
      <div className="pl-brand"><div className="pl-logo"><SpecIcon size={18}/></div><div><b>Team &amp; Access</b><span className="build-pill">{BUILD_LABEL}</span></div></div>
      <nav className="pl-nav"><button type="button" onClick={onBack}>← All projects</button><a href="pump.html">▥ Equipment Calculator</a></nav>
      <div className="pl-user"><UserBadge session={session} me={me} roles={roles}/></div>
    </div></header>
    <main className="pl-main">
      <div className="pl-top"><div><h1>Team &amp; Access</h1><p>{counts.map(([l, n]) => `${n} ${l}`).join(' · ')} · {pending.length} request{pending.length === 1 ? '' : 's'} waiting</p></div>
        <div className="pl-top-act"><div className="pl-nav">
          <button type="button" onClick={() => setTab('requests')} style={tabBtn(tab === 'requests')}>Access requests{pending.length > 0 && <i className="pl-badge">{pending.length}</i>}</button>
          <button type="button" onClick={() => setTab('team')} style={tabBtn(tab === 'team')}>Team members</button></div></div></div>
      <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:14, padding:'10px 14px', background:'#fff', border:'1px solid #e1e1e6', borderRadius:12, fontSize:12}}>
        <b style={{marginRight:4}}>Sign-off route:</b>
        <span className="pl-tag sh">1 · Engineer writes</span><span>→</span>
        <span className="pl-tag wait">2 · Checker signs (Senior / Principal / Lead)</span><span>→</span>
        <span className="pl-tag ok">3 · Approver signs and closes (Associate)</span>
        <span style={{color:'#86868b', fontSize:11}}>· three different people · Admin is separate and only manages the library, vendors and this page</span>
      </div>
      {msg && <div className={/^Failed|cannot|already|Enter|Initials|last Admin|profile flag/.test(msg) ? 'pl-err' : 'ai-msg'} style={{marginBottom:12}}>{msg}</div>}
      {busy && <div className="ai-msg" style={{marginBottom:12, background:'#eef5ff', color:'#0a4fa0'}}>{busy}</div>}
      {tab === 'requests' && <div className="schedule-card">
        <div className="schedule-card-head"><div><h2>Waiting for approval</h2><p>People who signed up with “Request Access”. The level is suggested from the designation — check it before approving.</p></div></div>
        {pend === null ? <div className="piw-empty">Loading…</div> : !pending.length ? <div className="piw-empty">No requests waiting ✓</div> :
          <div className="schedule-table-wrap" style={{maxHeight:'none'}}><table className="schedule-table" style={{minWidth:1060, tableLayout:'auto'}}>
            <thead><tr className="labels">{['Email', 'Requested', 'Full name', 'Initials', 'Designation', 'Sign-off level', 'Admin', ''].map(h => <th key={h}>{h}</th>)}</tr></thead>

              <td style={{minWidth:170}}><input style={i1} value={f.desig} placeholder="e.g. Senior Engineer - PH&E" onChange={e => setF(p, {desig:e.target.value, level:taSuggest(e.target.value)})}/></td>
              <td style={{minWidth:250}}>{levelSel(f.level, v => setF(p, {level:v}))}</td>
              <td className="ctr"><input type="checkbox" checked={!!f.admin} onChange={e => setF(p, {admin:e.target.checked})}/></td>
              <td style={{whiteSpace:'nowrap'}}><button className="lib-new" disabled={!!busy} onClick={() => approve(p)}>Approve</button> <button className="schedule-action" style={{color:'#b42318'}} disabled={!!busy} onClick={() => reject(p)}>Reject</button></td>
            </tr>; })}</tbody></table></div>}
        <div style={{padding:'8px 14px', borderTop:'1px solid #f0f0f2'}}><a href="#" style={{fontSize:11, fontWeight:700, color:'#007aff'}} onClick={e => { e.preventDefault(); setHist(!hist); }}>{hist ? 'Hide' : 'Show'} decided requests ({done.length})</a>

          <button className="lib-new" disabled={!!busy} onClick={addMember}>Add</button>

// automation (merged into spec.html).js — Specification automation, Phase 1
//   #13 Related Requirements built from library links
//   #14 Reference Standards built from a central standards register
//   #16 Common text blocks ({{>KEY}})
//   #19 Cross-reference check (Section XX XXXX that is not in the project)
// It installs itself after the main page script has run. If anything goes
// wrong it leaves the page exactly as it was.
// ══════════════════════════════════════════════════════════════════════════
(function () {
  const AU = window.SPEC_AUTO = {rel:[], std:{}, stdList:[], secstd:[], blocks:{}, loaded:false, missing:'', revs:[], itemRev:{}, itemDraft:{}, itemsLoaded:false, itemsMissing:'', version:'2.0'};

  let orig = {};

  // ── data ────────────────────────────────────────────────────────────────
  function indexRevs() {
    AU.itemRev = {}; AU.itemDraft = {};
    AU.revs.forEach(r => {
      if (r.status === 'approved') { const c = AU.itemRev[r.item_code]; if (!c || r.rev > c.rev) AU.itemRev[r.item_code] = r; }
      if (r.status === 'draft') { const d = AU.itemDraft[r.item_code]; if (!d || r.rev > d.rev) AU.itemDraft[r.item_code] = r; }
    });
  }
  async function loadAuto() {
    const q = t => sb.from(t).select('*').order('sort').range(0, 9999);
    const [r, s, ss, b, rv] = await Promise.all([q('spec_relations'), q('spec_standards'), q('spec_section_standards'), q('spec_blocks'),
      sb.from('spec_item_revs').select('*').order('item_code').order('rev').range(0, 19999)]);
    if (rv.error) { AU.revs = []; AU.itemsLoaded = false; AU.itemsMissing = 'Item specifications are not set up (' + rv.error.message + '). Run spec_item_specs_migration.sql in Supabase.'; }
    else { AU.revs = rv.data || []; AU.itemsLoaded = true; AU.itemsMissing = ''; }
    indexRevs();
    const err = r.error || s.error || ss.error || b.error;
    if (err) { AU.missing = 'Automation tables are not set up (' + err.message + '). Run spec_automation_migration.sql in Supabase.'; AU.loaded = false; return; }
    AU.rel = actv(r.data); AU.stdList = s.data || []; AU.std = {}; actv(s.data).forEach(x => { AU.std[x.code] = x; });
    AU.secstd = actv(ss.data); AU.blocks = {}; actv(b.data).forEach(x => { AU.blocks[x.key] = x; });

  function addBuiltin() {

    if (!BUILTIN_OPTS.find(x => x.k === b.k)) BUILTIN_OPTS.push(b);

  }

  function incSet(o) { const ex = AU.excl || {}; return new Set(LIB.filter(S => !isAnnexNum(S.num) && evalCond(S.cond, o) && !ex[S.num]).map(S => S.num)); }
  function countryCode(T) { const k = Object.keys(COUNTRIES).find(c => COUNTRIES[c].name === T.COUNTRY); return k || T.COUNTRY || ''; }
  function relatedLines(S, o, inc) {
    const seen = new Set(), out = [];
    AU.rel.filter(r => r.from_num === S.num && evalCond(r.include_when || '', o)).sort((a, b) => (a.sort || 0) - (b.sort || 0) || byNum(a.to_num, b.to_num)).forEach(r => {
      if (seen.has(r.to_num)) return; seen.add(r.to_num);
      const L = LIB.find(x => x.num === r.to_num);
      if (L) { if (isAnnexNum(L.num) || !inc.has(L.num)) return; out.push({lvl:0, text:`Section ${fmtNum(L.num)} - ${titleCase(L.title)}.`}); return; }
      const div = String(r.to_num).slice(0, 2);

      if (!evalCond('rel_external', o)) return;

    actv(ITEMS.items).filter(i => i.section_num === S.num && evalCond(i.include_when || '', o)).forEach(i =>
      String(i.standards || '').split(';').map(x => x.trim()).filter(Boolean).forEach(s => { const c = reg.find(k => s === k || s.startsWith(k + ' ')); if (c) add(c); }));

  // ── converter: typed lists → library data ───────────────────────────────

  function lineDiff(a, b) {
    const A = String(a || '').replace(/\s+$/, '').split('\n'), B = String(b || '').replace(/\s+$/, '').split('\n');
    const n = A.length, m = B.length, L = Array.from({length:n + 1}, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) { if (A[i] === B[j]) { out.push(['=', A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }
    while (i < n) out.push(['-', A[i++]]); while (j < m) out.push(['+', B[j++]]);
    return out;
  }

  // ── install ─────────────────────────────────────────────────────────────

    LIB_TABLES.presets = {table:'spec_presets', key:'key', fields:CH_PRESET_FIELDS, title:'Preset', auto:true, chx:true, audit:true,

    loadLibrary = async function () { addBuiltin(); const ok = await orig.loadLibrary(); try { await loadAuto(); } catch (e) { AU.missing = 'Automation data could not be loaded: ' + (e.message || e); } try { await loadChoices(); } catch (e) { CH.loaded = false; CH.missing = 'Choices could not be loaded: ' + (e.message || e); } addBuiltin(); return ok; };

  }
  // ══ CHOICES: selections per item, variants, presets, limits (phase 1) ══════
  const CH = AU.ch = {items:[], defs:{}, opts:{}, presets:[], loaded:false, missing:''};
  AU.sel = {}; AU.dp = {};
  const ID_LINE = 'Finish, material, model and manufacturer: as selected by the Architect / Interior Designer in the finishes schedule, subject to the requirements of this section.';
  const OTHER = '__other';
  // Country filter: an item or warranty row belongs to a country when its "countries" text names the project's country
  // code or any word of its name (e.g. 'KSA,Saudi' or 'UAE,Emirates'). Blank or ALL = every country.
  AU.ctry = null;
  const ctryOk = txt => {
    const t = String(txt || '').trim(); if (!t || /^all$/i.test(t)) return true;
    const c = AU.ctry; if (!c) return true;
    return t.split(',').map(x => x.trim().toLowerCase()).filter(Boolean).some(tok => tok === 'all' || tok === c[0] || (c[1] && c[1].includes(tok)));
  };
  const chAll = () => CH.items.filter(i => ctryOk(i.countries));
  CH.warranty = [];
  AU.warrantyRows = div => CH.warranty.filter(r => String(r.division || '22') === String(div) && ctryOk(r.countries)).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  async function loadChoices() {
    try { const w = await sb.from('spec_warranty').select('*').order('sort').range(0, 9999); CH.warranty = w.error ? [] : actv(w.data); } catch (e) { CH.warranty = []; }
    const q = t => sb.from(t).select('*').order('sort').range(0, 9999);
    const [i, d, o, p] = await Promise.all([q('spec_choice_items'), q('spec_choice_defs'), q('spec_choice_opts'), q('spec_presets')]);
    const err = i.error || d.error || o.error || p.error;
    if (err) { CH.items = []; CH.defs = {}; CH.opts = {}; CH.presets = []; CH.loaded = false; CH.missing = 'Choice tables are not set up (' + err.message + '). Run spec_choices_migration.sql, then spec_choices_seed_valves.sql, in Supabase.'; return; }
    CH.items = actv(i.data); CH.defs = {}; CH.opts = {};

    actv(o.data).forEach(x => { const k = x.item_key + '|' + x.choice_key; (CH.opts[k] = CH.opts[k] || []).push(x); });
    CH.presets = actv(p.data); CH.missing = ''; CH.loaded = true;
  }
  const chDefs = it => CH.defs[it.item_key] || [];
  const chOpts = (it, c) => CH.opts[it.item_key + '|' + c.choice_key] || [];

  const chLines = t => String(t || '').split('\n').map(x => x.trim().replace(/^-\s*/, '')).filter(Boolean);
  // a rule on an option: rating below the project design pressure, or a project-option condition
  function optBlock(it, o, opts) {
    const dp = (AU.dp || {})[it.pgroup] || 0, bar = Number(o.rating_bar) || 0;
    if (bar > 0 && dp > 0 && bar < dp) return {level:'Block', reason:`Rated ${bar} bar, below the project design pressure of ${dp} bar.`};
    if (o.block_when && evalCond(o.block_when, opts || {})) return {level:o.block_level === 'Warn' ? 'Warn' : 'Block', reason:o.block_reason || 'Not allowed for the selected systems.'};
    return {level:null, reason:''};
  }
  const variantTitle = (v, i, n) => (v.label || '').trim() || (n > 1 ? 'Type ' + (i + 1) : '');
  function choiceLines(it, variants, o, T) {
    const lines = [], defs = chDefs(it), multi = variants.length > 1 || variants.some(v => (v.label || '').trim());
    variants.forEach((v, vi) => {
      const lv = multi ? 1 : 0, vt = variantTitle(v, vi, variants.length);
      if (multi) lines.push({lvl:0, html:'<b>' + esc(vt) + '</b>'});
      defs.forEach(c => {
        if (c.selector === 'Architect / ID') { lines.push({lvl:lv, html:esc(String(c.clause || '').trim() || ID_LINE)}); return; }
        const p = (v.picks || {})[c.choice_key], where = esc(it.label) + (vt ? ' – ' + esc(vt) : '') + ': ' + esc(c.label);
        if (!p) { lines.push({lvl:lv, html:`<span class="unres">[${where} – not chosen]</span>`}); return; }
        if (p === OTHER) { const ot = (v.other || {})[c.choice_key]; lines.push({lvl:lv, html:(ot && String(ot.text || '').trim()) ? esc(String(ot.text).trim()) : `<span class="unres">[${where} – "Other" text missing]</span>`}); return; }
        const op = chOpt(it, c, p);
        lines.push({lvl:lv, html:op ? fill(op.clause, T) : `<span class="unres">[${where} – option no longer in the catalogue]</span>`});
      });
    });
    const com = chLines(it.common);
    if (com.length) { if (multi) lines.push({lvl:0, html:'<b>Common to all types</b>'}); com.forEach(t => lines.push({lvl:multi ? 1 : 0, html:fill(t, T)})); }
    return lines;
  }
  function linesHtml(lines) {
    const cnt = [0, 0, 0, 0];
    return lines.map(x => { const l = Math.min(x.lvl, 3), n = cnt[l]++; for (let j = l + 1; j < 4; j++) cnt[j] = 0; return `<p class="l${l}"><span>${clauseLbl(l, n)}</span>${x.html}</p>`; }).join('');
  }
  function choiceArticles(S, o, T) {
    if (!CH.loaded) return [];
    const out = [];
    chAll().filter(i => i.section_num === S.num).forEach(it => {
      const vs = (AU.sel || {})[it.item_key]; if (!vs || !vs.length) return;
      out.push({title:String(it.label).toUpperCase(), html:linesHtml(choiceLines(it, vs, o, T))});
    });
    return out;
  }
  function choiceStds(S) {
    const codes = [];
    if (!CH.loaded) return codes;
    chAll().filter(i => i.section_num === S.num).forEach(it => {
      const vs = (AU.sel || {})[it.item_key] || [];
      vs.forEach(v => chDefs(it).forEach(c => { const p = (v.picks || {})[c.choice_key]; if (!p || p === OTHER) return; const op = chOpt(it, c, p); String((op && op.standards) || '').split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(s => { if (AU.std[s] && !codes.includes(s)) codes.push(s); }); }));
    });
    return codes;
  }
  // status of every engineer choice in the project (drives the sign-off block)
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  function choiceStatus(nums, sel, o) {
    const r = {items:0, variants:0, choices:0, unset:0, unconf:0, blocked:0, other:0, nodp:0, nodpGroups:[]};
    if (!CH.loaded) return r;
    chAll().forEach(it => {
      if (!nums.has(it.section_num)) return;
      const vs = (sel || {})[it.item_key]; if (!vs || !vs.length) return;
      r.items++; r.variants += vs.length;
      vs.forEach(v => chDefs(it).forEach(c => {
        if (c.selector !== 'Engineer') return;
        r.choices++;
        const p = (v.picks || {})[c.choice_key];
        if (!p) { r.unset++; return; }
        if (p === OTHER) { r.other++; if (!(v.conf || {})[c.choice_key]) r.unconf++; return; }
        const op = chOpt(it, c, p);
        if (!op) { r.unset++; return; }
        if (optBlock(it, op, o).level === 'Block') r.blocked++;
        if (Number(op.rating_bar) > 0 && !((AU.dp || {})[it.pgroup] > 0)) { r.nodp++; if (!r.nodpGroups.includes(it.pgroup)) r.nodpGroups.push(it.pgroup); }
        if (!(v.conf || {})[c.choice_key]) r.unconf++;
      }));
    });
    return r;
  }
  AU.choiceSig = (num, sel) => { const a = chAll().filter(i => i.section_num === num).map(i => [i.item_key, ((sel || {})[i.item_key] || []).map(v => [v.label || '', v.picks || {}, v.other || {}])]).filter(x => x[1].length); return a.length ? JSON.stringify(a) : ''; };
  AU.choiceStatus = choiceStatus;
  function presetPicks(it, p, o) {
    const out = {};

      if (c.selector !== 'Engineer' || c.code_critical) return;
      const ok = chOpts(it, c).filter(x => optBlock(it, x, o).level !== 'Block');
      const ex = (p.picks || {})[it.item_key + '|' + c.choice_key];
      let pick = ex && ok.find(x => x.opt_key === ex);
      if (!pick && p.tier) pick = ok.find(x => x.cost === p.tier);
      if (!pick) pick = ok[0];
      if (pick) out[c.choice_key] = pick.opt_key;
    });
    return out;
  }
  // ── Project › Selections ────────────────────────────────────────────────
