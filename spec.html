<style>
  :root { --rp-bg:#f5f5f7; --rp-surface:#fff; --rp-border:#d2d2d7; --rp-text:#1d1d1f; --rp-muted:#86868b; --rp-accent:#007aff; --rp-accent-soft:#e8f0fe; --rp-danger:#ff3b30; --rp-radius:10px; --rp-radius-large:14px; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; background:var(--rp-bg); color:var(--rp-text); font-size:13px; letter-spacing:-.01em; }
  input, select { font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }
  .rp-page { min-height:100vh; background:var(--rp-bg); }
  .rp-card { background:var(--rp-surface); border:1px solid var(--rp-border); border-radius:var(--rp-radius-large); box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02); }
  .rp-header { background:rgba(255,255,255,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--rp-border); box-shadow:0 1px 3px rgba(0,0,0,.04); }
  @media screen and (max-width:700px){ body{font-size:12px;} }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    .page-break { page-break-before: always; }
    /* Each pump's calculation starts on a fresh sheet of paper */
    .calc-page { page-break-after: always; break-after: page; page-break-inside: avoid; }
    .calc-page:last-child { page-break-after: auto; break-after: auto; }
    @page { margin: 9mm; }
  }

  /* ── Schedule-review workspace ───────────────────────────────────────── */
  .schedule-review{display:flex;flex-direction:column;gap:14px;}
  .schedule-context{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:2px 2px 0;flex-wrap:wrap;}
  .schedule-eyebrow{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#86868b;margin-bottom:4px;}
  .schedule-title{font-size:20px;font-weight:750;letter-spacing:-.03em;color:#1d1d1f;}
  .schedule-subtitle{font-size:12px;color:#86868b;margin-top:3px;}
  .schedule-context-status{display:flex;align-items:center;gap:8px;font-size:11px;color:#86868b;padding-top:5px;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:#34c759;display:inline-block;}.save-dot.error{background:#ff3b30;}.save-dot.saving{background:#ff9500;}
  .schedule-health{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;}
  .health-card{appearance:none;text-align:left;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0;}

  .health-card.pass{border-top:3px solid #34c759;}.health-card.review{border-top:3px solid #ff9500;}.health-card.blocked{border-top:3px solid #ff3b30;}.health-card.capacity{border-top:3px solid #007aff;}
  .schedule-card{background:#fff;border:1px solid #d2d2d7;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;}
  .schedule-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid #e8e8ed;flex-wrap:wrap;}.schedule-card-head h2{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#1d1d1f;}.schedule-card-head p{font-size:10px;color:#86868b;margin-top:3px;}
  .schedule-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #e8e8ed;flex-wrap:wrap;background:#fafafb;}.schedule-toolbar input,.schedule-toolbar select{width:auto;min-width:130px;padding:7px 10px;border:1px solid #d2d2d7;border-radius:8px;font-size:11px;background:#fff;color:#1d1d1f;outline:none;}.schedule-toolbar input{flex:1 1 220px;}.schedule-toolbar input:focus,.schedule-toolbar select:focus{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.12);}.toolbar-spacer{flex:1;}.density-switch{display:inline-flex;border:1px solid #d2d2d7;border-radius:8px;overflow:hidden;background:#fff;}.density-switch button{border:0;background:#fff;color:#86868b;padding:7px 10px;font-size:10px;font-weight:650;cursor:pointer;}.density-switch button.on{background:#e8f0fe;color:#007aff;}
  .status-chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:750;white-space:nowrap;line-height:1.3;}.status-chip.pass{background:#e8faf0;color:#208a45;}.status-chip.review{background:#fff4e0;color:#a76200;}.status-chip.blocked{background:#fff0ee;color:#d8332b;}.status-chip.draft{background:#f1f1f3;color:#6e6e73;}.method-chip{display:inline-flex;padding:2px 6px;border:1px solid #d2d2d7;border-radius:6px;color:#6e6e73;background:#fff;font-size:9px;font-weight:700;white-space:nowrap;}

lor:#86868b;margin-top:2px;}.schedule-action{border:1px solid #d2d2d7;background:#fff;color:#007aff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer;}.schedule-action:hover{border-color:#007aff;background:#e8f0fe;}.empty-schedule{padding:34px 20px;text-align:center;color:#86868b;font-size:12px;}.schedule-mobile{display:none;gap:8px;padding:10px;}.schedule-mobile-card{border:1px solid #d2d2d7;border-radius:12px;padding:12px;background:#fff;cursor:pointer;}.schedule-mobile-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}.schedule-mobile-name{font-weight:750;color:#1d1d1f;font-size:12px;line-height:1.35;}.schedule-mobile-tag{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#86868b;margin-top:2px;}.schedule-mobile-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #ededf0;}.schedule-mobile-metrics span{font-size:9px;color:#86868b;display:block;}.schedule-mobile-metrics b{display:block;font-size:12px;color:#1d1d1f;margin-top:2px;font-variant-numeric:tabular-nums;}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:500;}.inspection-drawer{position:fixed;z-index:501;top:0;right:0;width:min(480px,100vw);height:100dvh;background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.16);display:flex;flex-direction:column;animation:drawer-in .18s ease-out;}.inspection-drawer header{padding:18px 20px;border-bottom:1px solid #d2d2d7;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}.inspection-drawer h3{font-size:16px;letter-spacing:-.02em;color:#1d1d1f;line-height:1.3;}.inspection-drawer .close{border:0;background:#f5f5f7;color:#424245;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer;}.inspection-drawer main{padding:18px 20px;overflow:auto;flex:1;}.drawer-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}.drawer-metric{background:#f5f5f7;border:1px solid #e2e2e7;border-radius:10px;padding:10px;}.drawer-metric span{font-size:9px;color:#86868b;text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:block;}.drawer-metric b{font-size:16px;color:#1d1d1f;margin-top:4px;display:block;font-variant-numeric:tabular-nums;}.drawer-section{border-top:1px solid #e7e7eb;padding-top:14px;margin-top:14px;}.drawer-section h4{font-size:10px;color:#86868b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;}.drawer-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:11px;border-bottom:1px solid #f0f0f2;}.drawer-line span{color:#86868b;}.drawer-line b{color:#1d1d1f;text-align:right;}.drawer-warning{margin-top:8px;padding:9px 10px;border-radius:8px;font-size:11px;line-height:1.45;}.drawer-warning.review{background:#fff4e0;color:#a76200;}.drawer-warning.blocked{background:#fff0ee;color:#d8332b;}.drawer-footer{border-top:1px solid #d2d2d7;padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;}.drawer-footer button{border:1px solid #d2d2d7;background:#fff;color:#424245;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:650;cursor:pointer;}.drawer-footer button.primary{background:#007aff;border-color:#007aff;color:#fff;}
  @keyframes drawer-in{from{transform:translateX(24px);opacity:.7}to{transform:translateX(0);opacity:1}}
  @media screen and (max-width:900px){.schedule-health{grid-template-columns:repeat(3,minmax(130px,1fr));}.schedule-table-wrap{display:none;}.schedule-mobile{display:grid;}.schedule-card-head{padding:14px;}.schedule-toolbar{padding:10px;}.schedule-toolbar input{flex-basis:100%;}.toolbar-spacer{display:none;}.inspection-drawer{width:100%;}.schedule-context{padding:2px 0;}.schedule-title{font-size:18px;}}
  @media screen and (max-width:600px){.schedule-health{grid-template-columns:repeat(2,minmax(130px,1fr));}.health-card:last-child{grid-column:span 2;}.schedule-context-status{width:100%;padding-top:0;}.density-switch{display:none;}}
  @media print{.schedule-health,.schedule-toolbar,.inspection-drawer,.drawer-backdrop,.schedule-context-status,.schedule-action{display:none!important;}.schedule-review{gap:4px;}.schedule-card{border:none;box-shadow:none;}.schedule-card-head{padding:4px 0 8px;}.schedule-table-wrap{display:block!important;overflow:visible!important;max-height:none!important;}.schedule-mobile{display:none!important;}.schedule-table{min-width:0;font-size:9px;}.schedule-table th,.schedule-table td{position:static!important;padding:5px!important;box-shadow:none!important;}.schedule-table th.system,.schedule-table td.system{min-width:0;max-width:none;}.schedule-table th.tag,.schedule-table td.tag{min-width:0;}.schedule-table thead tr.labels th{top:auto;}.schedule-table thead tr.group th{display:none;}}


  /* ── Global Resource Planning design system ────────────────────────────── */
  :root{
    --app-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
    --app-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    --app-bg:#f5f5f7;--app-surface:#fff;--app-surface-subtle:#fafafb;--app-border:#d2d2d7;
    --app-text:#1d1d1f;--app-text-2:#424245;--app-muted:#86868b;--app-blue:#007aff;
    --app-blue-soft:#e8f0fe;--app-green:#34c759;--app-green-soft:#e8faf0;
    --app-amber:#ff9500;--app-amber-soft:#fff4e0;--app-red:#ff3b30;--app-red-soft:#fff0ee;
    --app-radius:10px;--app-radius-large:14px;--app-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  }
  #root,#root *{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root{color:var(--app-text);font-size:13px;line-height:1.45;}
  #root input,#root select,#root textarea{font-family:var(--app-sans)!important;border-color:var(--app-border)!important;border-radius:var(--app-radius)!important;color:var(--app-text)!important;background:#fff!important;}
  #root input:focus,#root select:focus,#root textarea:focus{outline:none!important;border-color:var(--app-blue)!important;box-shadow:0 0 0 3px rgba(0,122,255,.12)!important;}
  #root button{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root button:focus-visible,#root a:focus-visible,#root input:focus-visible,#root select:focus-visible{outline:3px solid rgba(0,122,255,.26)!important;outline-offset:2px;}
  .global-page{background:var(--app-bg)!important;min-height:100dvh!important;}
  .app-header{position:relative!important;background:rgba(255,255,255,.9)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:0 1px 3px rgba(0,0,0,.04)!important;padding:14px 24px!important;}
  .app-header *{color:var(--app-text)!important;}.app-header [style*="color:\"#86868b\""]{color:var(--app-muted)!important;}
  .app-tabbar{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(18px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:none!important;}
  .app-tabbar button{border-radius:0!important;font-weight:650!important;}.app-tabbar button:hover{background:var(--app-surface-subtle)!important;color:var(--app-text)!important;}
  .app-content{padding:20px 24px 30px!important;}
  .global-page [style*="borderRadius:12"],.global-page [style*="borderRadius:16"]{box-shadow:var(--app-shadow)!important;}
  .global-page [style*="textTransform:\"uppercase\""]{font-size:10px!important;letter-spacing:.06em!important;font-weight:700!important;}
  /* Input workspace */
  .pump-input-workspace{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .pump-input-workspace [style*="borderTop"]{border-color:#ececf0!important;}
  .live-calc{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .live-calc-summary{background:var(--app-surface-subtle)!important;border-bottom:1px solid var(--app-border)!important;}
  .live-calc-summary *{color:var(--app-text)!important;}.live-calc-summary [style*="color:"]{color:var(--app-muted)!important;}
  .live-calc-summary [style*="fontSize:15"]{color:var(--app-text)!important;font-family:var(--app-display)!important;font-weight:750!important;}
  .live-calc-section{background:#f5f5f7!important;color:var(--app-muted)!important;border-color:#e8e8ed!important;}
  .live-calc-row{border-bottom:1px solid #f0f0f2!important;padding:6px 14px!important;}
  /* Calculation sheets */
  .calc-sheet{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .calc-sheet-header{background:var(--app-surface)!important;color:var(--app-text)!important;border-bottom:1px solid var(--app-border)!important;padding:16px 20px!important;}
  .calc-sheet-header *{color:var(--app-text)!important;}.calc-sheet-header > div > div:first-child > div:first-child,.calc-sheet-header > div > div:last-child{color:var(--app-muted)!important;}
  .calc-sheet-header [style*="fontSize:13"]{font-family:var(--app-display)!important;font-size:16px!important;font-weight:750!important;letter-spacing:-.02em!important;}
  .calc-basis{background:var(--app-blue-soft)!important;border-bottom:1px solid #c8dafa!important;color:#265c9f!important;font-family:var(--app-sans)!important;padding:7px 20px!important;letter-spacing:0!important;}
  .calc-section{background:#1e3a5f!important;color:#fff!important;padding:6px 20px!important;font-size:10px!important;letter-spacing:.07em!important;}
  .calc-step-row{border-bottom:1px solid #ececf0!important;padding:7px 20px!important;min-height:36px!important;}.calc-step-row span{font-family:var(--app-sans)!important;}.calc-step-row [style*="fontSize:14"]{font-family:var(--app-display)!important;}
  .calc-result-banner{background:#1d1d1f!important;padding:14px 20px!important;}.calc-result-banner *{font-family:var(--app-sans)!important;}.calc-result-banner [style*="fontSize:15"]{font-family:var(--app-display)!important;}
  .duty-point-wrap{background:var(--app-surface-subtle)!important;padding:12px 20px!important;}.duty-point-table{font-family:var(--app-sans)!important;}.duty-point-table th{color:var(--app-muted)!important;font-size:9px!important;letter-spacing:.05em!important;text-transform:uppercase!important;}.duty-point-table td{font-variant-numeric:tabular-nums;}
  /* Reference data and project cards */
  .project-card,.reference-panel{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .project-card:hover{border-color:#b8b8c0!important;box-shadow:0 6px 18px rgba(0,0,0,.07)!important;}
  /* Consistent labels and numerical alignment across all pages */
  #root label{font-size:10px!important;font-weight:700!important;letter-spacing:.04em!important;color:var(--app-text-2)!important;}
  #root [style*="fontFamily"]{font-family:var(--app-sans)!important;font-variant-numeric:tabular-nums;}
  @media screen and (max-width:700px){.app-header{padding:12px 14px!important;}.app-content{padding:14px 12px 24px!important;}.calc-sheet-header{padding:14px!important;}.calc-basis,.calc-section,.calc-step-row,.duty-point-wrap,.calc-result-banner{padding-left:14px!important;padding-right:14px!important;}}
  @media print{#root,#root *{font-family:Arial,sans-serif!important;letter-spacing:0!important;}.calc-sheet{box-shadow:none!important;border-radius:0!important;}.calc-sheet-header{border-bottom:2px solid #1e3a5f!important;}.calc-result-banner{background:#fff!important;border-top:2px solid #1e3a5f!important;}.calc-result-banner *{color:#1d1d1f!important;}.calc-section{background:#1e3a5f!important;color:#fff!important;}}


  /* ── Calculation Sheets: Resource Planning project-card treatment ─────── */
  .calc-project-card{background:#fff;border:1px solid #d2d2d7;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.04);overflow:hidden;margin:0 0 16px;transition:border-color .15s,box-shadow .15s;}
  .calc-project-card:hover{border-color:#b9b9c0;box-shadow:0 6px 20px rgba(0,0,0,.08);}.calc-project-card.collapsed{box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .calc-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 20px;cursor:pointer;user-select:none;background:#fff;}.calc-card-head:hover{background:#fafafb;}
  .calc-card-brand{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#86868b;margin-bottom:5px;}.calc-card-title{font-family:var(--app-display)!important;font-size:16px;font-weight:750;letter-spacing:-.025em;color:#1d1d1f;line-height:1.25;}.calc-card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:10px;color:#6e6e73;margin-top:6px;}.calc-card-meta b{color:#424245;font-weight:700;}.calc-card-expand{font-size:10px;color:#007aff;font-weight:700;white-space:nowrap;align-self:center;}

  /* ── Phone layout ──────────────────────────────────────────────────────
     The project row and the reference-data grids were both laid out for a
     desktop width only. On a phone the four project buttons stayed on one
     flex line and Delete was pushed off-screen, and the reference grids
     compressed every column until the inputs were unreadable. Both are laid
     out with inline styles in JS, so these rules use !important to override
     them rather than threading a breakpoint through the components. */
  @media screen and (max-width:700px){
    /* Project row: title above, then a 2x2 button grid that always fits. */
    .project-card{flex-direction:column!important;align-items:stretch!important;gap:12px!important;padding:14px!important;}
    .project-card>div:first-child{width:100%;}
    .project-card>div:last-child{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex-shrink:1!important;}
    .project-card>div:last-child>button{width:100%;padding:10px 8px!important;font-size:12px!important;}
    /* Open is the primary action — give it the full first row. */
    .project-card>div:last-child>button:first-child{grid-column:span 2;}
    /* Reference-data grids scroll sideways instead of crushing the columns. */
    .refgrid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .refgrid-scroll>div{min-width:560px;}
    /* Header actions wrap rather than overflowing the notch area. */
    .app-header>div{flex-wrap:wrap!important;gap:10px!important;}
    /* Two- and three-column field grids are unreadable at phone width. They
       are laid out with inline styles in JS, hence !important here. */
    .fg2,.fg3,.fg5{grid-template-columns:1fr!important;}
    .pump-input-workspace{padding:14px!important;}
  }
  /* The pump editor is three side-by-side panes on desktop: list, form, live
     calculation. Below 900px they must stack, otherwise the form is crushed
     into a few characters' width and the live panel is unreadable. */
  @media screen and (max-width:900px){
    .pumpwork{flex-direction:column!important;gap:12px!important;}
    .pumpwork>.pumplist,.pumpwork>.pumpcalc{width:100%!important;flex:1 1 auto!important;}
    /* Sticky positioning only makes sense beside the form, not above it. */
    .pumpcalc .live-calc{position:static!important;max-height:none!important;}
    .pumpcalc .live-calc>div:last-child{max-height:420px!important;}
    /* The pump picker becomes a horizontal strip so the form stays in view. */
    .pumplist-items{display:flex!important;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .pumplist-items>div{flex:0 0 auto;min-width:150px;margin-bottom:0!important;}
    .pumplist-add{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;}
    .pumplist-add>button{margin-bottom:0!important;}
  }
  @media print{

    .screen-hide{display:block!important}
    .calcsplit{display:block!important}
    .calcsplit-pane{display:block!important}
    .calcpick{display:none!important}
    .calcwrap{display:block!important}
    /* Print at true A4 — undo every preview-scaling rule. */
    .ppreview{height:auto!important;overflow:visible!important;position:static!important}
    .ppreview-page{position:static!important;transform:none!important;width:auto!important}}

const lbl = {fontSize:9,fontWeight:700,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.05em",display:"block",marginBottom:3};
const inp  = {border:"1px solid #d2d2d7",borderRadius:6,padding:"5px 9px",fontSize:12.5,color:"#1d1d1f",background:"white",width:"100%",outline:"none",transition:"border-color 0.15s"};
function Field({label, value, onChange, type="text", min, step, note}) {
  return (
    <div>
      <label style={lbl}>{label}</label>
      <input type={type} value={value} min={min} step={step}
        onChange={e=>onChange(e.target.value)}
        style={inp}
        onFocus={e=>e.target.style.borderColor="#007aff"}
        onBlur={e=>e.target.style.borderColor="#d2d2d7"} />
      {note && <p style={{fontSize:10,color:"#86868b",fontStyle:"italic",marginTop:3}}>{note}</p>}
    </div>
  );
}
function Sel({label, value, onChange, options}) {
  return (
    <div>
      <label style={lbl}>{label}</label>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{...inp,cursor:"pointer"}}>
        {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}
function AuthScreen({onAuthed}) {
  const [mode, setMode]     = useState("login"); // "login" | "signup"
  const [email, setEmail]   = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr]       = useState("");
  const [busy, setBusy]     = useState(false);
  const [info, setInfo]     = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        const normalizedEmail = email.trim().toLowerCase();
        if (data && data.session) {
          const { data: roster } = await sb.from('engineers').select('id,active').eq('email', normalizedEmail).maybeSingle();
          if (!roster || roster.active === false) {
            const { error: requestError } = await sb.from('pending_users').upsert(
              {email:normalizedEmail, status:'pending', requested_at:new Date().toISOString()},
              {onConflict:'email', ignoreDuplicates:true}
            );
            if (requestError) throw requestError;
          }
          setInfo("Account created and your access request is pending administrator approval.");
        } else {
          setInfo("Account created. Check your inbox to confirm your email, then sign in to submit or view your access request.");
        }
      }
    } catch (e2) {
      setErr(e2.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#f5f5f7",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",width:480,height:480,borderRadius:"50%",background:"radial-gradient(circle,rgba(0,122,255,.08) 0%,transparent 70%)",top:-140,right:-60,pointerEvents:"none"}} />
      <div style={{position:"absolute",width:360,height:360,borderRadius:"50%",background:"radial-gradient(circle,rgba(52,199,89,.07) 0%,transparent 70%)",bottom:-80,left:-80,pointerEvents:"none"}} />
      <div style={{position:"relative",zIndex:1,width:"min(400px,94vw)",background:"#fff",borderRadius:20,padding:"40px 36px 32px",textAlign:"center",boxShadow:"0 2px 4px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)"}}>
        <img src={MEINHARDT_LOGO_SRC} alt="Meinhardt" style={{display:"block",width:176,height:"auto",margin:"0 auto 16px"}} />
        <div style={{width:52,height:52,borderRadius:14,margin:"0 auto 20px",background:"linear-gradient(160deg,#007aff 0%,#0055d4 100%)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,122,255,.3)",color:"white",fontSize:23}}>▥</div>
        <div style={{fontSize:21,fontWeight:700,color:"#1d1d1f",marginBottom:5,letterSpacing:"-.03em"}}>MEP Specifications</div>
        <div style={{fontSize:13,color:"#6e6e73",marginBottom:28}}>Sign in to continue</div>

  useEffect(() => {
    if (!mountedP.current) { mountedP.current = true; return; }
    setSaveStatus('saving'); clearTimeout(projT.current);
    projT.current = setTimeout(async () => { const {error} = await sb.from('spec_projects').update({name:proj.name || 'Untitled Project', project:proj}).eq('id', projectId); setSaveStatus(error ? 'error' : 'saved'); }, 1000);
    return () => clearTimeout(projT.current);
  }, [proj]);
  useEffect(() => {
    if (!ready || !stageId || locked) return;
    setSaveStatus('saving'); clearTimeout(stageT.current);
    stageT.current = setTimeout(async () => { const {error} = await sb.from('spec_project_stages').update({state, meta}).eq('id', stageId); setSaveStatus(error ? 'error' : 'saved'); if (error) console.error(error); }, 1000);
    return () => clearTimeout(stageT.current);
  }, [state, meta, stageId, ready, locked]);
  const flushProject = async () => { clearTimeout(projT.current); const {error} = await sb.from('spec_projects').update({name:proj.name || 'Untitled Project', project:proj}).eq('id', projectId); if (error) throw error; };
  const flushStage = async (st = state, mt = meta) => { clearTimeout(stageT.current); if (!stageId || locked) return; const {error} = await sb.from('spec_project_stages').update({state:st, meta:mt}).eq('id', stageId); if (error) throw error; };
  const saveNow = async () => {
    if (locked) { setManualSave('Blocked — stage is ' + stageStatusLabel(meta) + '.'); return; }
    setManualSave('Saving…'); setSaveStatus('saving');
    try { await flushProject(); await flushStage(); setSaveStatus('saved'); setManualSave('Saved at ' + new Date().toLocaleTimeString()); }
    catch (e) { setSaveStatus('error'); setManualSave('SAVE FAILED: ' + (e.message || e)); }
  };
  const exit = async () => { try { await flushProject(); await flushStage(); } catch (e) { if (!window.confirm('Latest changes could not be saved (' + (e.message || e) + '). Leave anyway?')) return; } onBack(); };

  // ── stages ──
  const switchStage = async id => { if (id === stageId) return; try { await flushStage(); } catch (e) {} await openStage(id); };
  const addStage = async () => {
    const name = window.prompt('New stage name (e.g. Concept, SD, DD, Tender, IFC):', ''); if (!name) return;
    const copy = window.confirm(`Start "${name}" as a copy of the current stage selections and edits?\n\nOK = copy · Cancel = start from library defaults`);
    try { await flushStage(); } catch (e) {}
    const st = copy ? {opts:{...viewState.opts}, excl:{...viewState.excl}, edits:{...viewState.edits}, reviewed:{}} : blankState();
    const mt = {...EMPTY_META, calcBy:meta.calcBy || '', revision:'01'};
    const maxSort = stages.reduce((m, s) => Math.max(m, s.sort_order || 0), -1);
    const {data, error} = await sb.from('spec_project_stages').insert({project_id:projectId, user_id:userId, stage_name:name, sort_order:maxSort + 1, state:st, meta:mt}).select('id,stage_name,sort_order').single();
    if (error) { alert('Could not create stage: ' + error.message); return; }
    setStages(s => [...s, data]); await openStage(data.id);
  };
  const renameStage = async () => { const s = stages.find(x => x.id === stageId); const name = window.prompt('Rename stage:', s.stage_name); if (!name || name === s.stage_name) return; const {error} = await sb.from('spec_project_stages').update({stage_name:name}).eq('id', stageId); if (error) return alert(error.message); setStages(x => x.map(y => y.id === stageId ? {...y, stage_name:name} : y)); };
  const deleteStage = async () => { if (stages.length <= 1) return alert('A project needs at least one stage.'); const s = stages.find(x => x.id === stageId); if (!window.confirm(`Delete stage "${s.stage_name}"?`)) return; const {error} = await sb.from('spec_project_stages').delete().eq('id', stageId); if (error) return alert(error.message); const rest = stages.filter(x => x.id !== stageId); setStages(rest); await openStage(rest[0].id); };

  // ── derived ──
  const vOpts = viewState.opts || {};
  const T = useMemo(() => tokens(viewProj, vOpts), [viewProj, vOpts]);
  const included = useMemo(() => {
    if (locked && Array.isArray(viewState.issued_list)) return viewState.issued_list;
    return LIB.filter(S => evalCond(S.cond, vOpts) && !viewState.excl[S.num]);
  }, [vOpts, viewState, locked]);
  const candidates = useMemo(() => LIB.filter(S => evalCond(S.cond, vOpts)), [vOpts]);
  const bodyOf = useCallback(S => {
    if (locked && viewState.issued_html && viewState.issued_html[S.num] !== undefined) return viewState.issued_html[S.num];
    if (viewState.edits[S.num]) return viewState.edits[S.num];
    const L = LIB.find(x => x.num === S.num); return L ? genSection(L, vOpts, T) : '<p>Section no longer in the library.</p>';
  }, [locked, viewState, vOpts, T]);
  const health = useMemo(() => {
    let rev = 0, ed = 0, unres = 0, tbc = 0;
    included.forEach(S => { const h = bodyOf(S); if (viewState.reviewed[S.num]) rev++; if (viewState.edits[S.num]) ed++; unres += unresCount(h); tbc += tbcCount(h); });
    return {n:included.length, rev, ed, unres, tbc};
  }, [included, bodyOf, viewState]);
  const coverUnres = unresCount(coverBody(viewProj, viewState, included));
  const stageReady = health.n > 0 && health.rev === health.n && health.unres === 0 && coverUnres === 0;
  const blockReason = !health.n ? 'No sections included.' : health.rev < health.n ? `${health.n - health.rev} section(s) not marked reviewed.` : health.unres ? `${health.unres} unresolved field(s) / TBC item(s) in the sections.` : coverUnres ? 'Project design basis has empty fields (Setup).' : '';
  useEffect(() => { if (!cur || !included.find(S => S.num === cur)) setCur(included[0] ? included[0].num : null); }, [included]);

  const setOpt = (k, v) => !locked && setState(s => ({...s, opts:{...s.opts, [k]:v}}));
  const toggleExcl = (num, inc) => !locked && setState(s => { const e = {...s.excl}; if (inc) delete e[num]; else e[num] = 1; return {...s, excl:e}; });
  const setReviewed = (num, v) => !locked && setState(s => { const r = {...s.reviewed}; if (v) r[num] = 1; else delete r[num]; return {...s, reviewed:r}; });
  const setEdit = (num, html) => !locked && setState(s => ({...s, edits:{...s.edits, [num]:html}}));
  const discardEdit = num => { if (locked || !window.confirm('Discard project edits for ' + num + ' and regenerate from the library?')) return; setState(s => { const e = {...s.edits}; delete e[num]; return {...s, edits:e}; }); };
  const setPf = (k, v) => !locked && setProj(p => ({...p, pf:{...(p.pf || {}), [k]:v}}));
  const loadLocation = () => { if (locked) return; if (Object.keys(proj.pf || {}).length && !window.confirm('Replace the design-basis fields with the defaults for ' + proj.city + '?')) return; setProj(p => ({...p, pf:profileFor(p.country, p.city)})); };
  const uploadLogo = file => {
    if (!file) return; if (!/^image\/(png|jpeg|svg\+xml)$/.test(file.type) || file.size > 300000) { setLogoMsg('Use a PNG, JPEG or SVG logo up to 300 KB.'); return; }
    const r = new FileReader(); r.onload = () => { setProj(p => ({...p, clientLogo:r.result})); setLogoMsg('Client logo added.'); }; r.readAsDataURL(file);
  };

  // ── sign-off workflow (rules enforced in Supabase spec_wf_* functions) ──
  const wfCall = async (fn, args, fail) => {
    setSaveStatus('saving');
    const {error} = await sb.rpc(fn, {p_stage_id:stageId, ...args});
    if (error) { setSaveStatus('error'); alert(fail + ': ' + error.message); await openStage(stageId); return; }
    await openStage(stageId); setSaveStatus('saved');
  };
  const signLead = async () => {
    if (!proj.clientLogo) return alert('Upload the client logo on Setup before Lead sign-off.');
    if (!stageReady) return alert('Lead sign-off is blocked: ' + blockReason);
    if (!meta.calcBy) return alert('Set "Prepared by" on Setup before Lead sign-off.');
    if (me && (meta.calcBy || '').toUpperCase() === (me.initials || '').toUpperCase()) return alert('You prepared this stage. Lead sign-off must be given by a different Lead.');
    if (!window.confirm(`Lead sign-off for Rev ${meta.revision || '01'}?\n\nThe specification text is frozen as it is now, and the stage is locked until the Associate / Approver signs or returns it.`)) return;
    const issued_html = {}, issued_list = included.map(S => ({num:S.num, title:S.title, div:S.div}));
    included.forEach(S => { issued_html[S.num] = bodyOf(S); });
    issued_html['00'] = coverBody(proj, state, included);
    const frozen = {...state, issued_html, issued_list};
    try { await flushProject(); await flushStage(frozen, meta); } catch (e) { return alert('Save failed before sign-off: ' + (e.message || e)); }
    setState(frozen);
    await wfCall('spec_wf_submit', {}, 'Lead sign-off failed');
  };
  const returnStage = async () => { const c = window.prompt('Return to Lead — what needs to be corrected? (required)', ''); if (c === null) return; if (!c.trim()) return alert('A comment is required.'); await wfCall('spec_wf_return', {p_comment:c.trim()}, 'Return failed'); };
  const signApprover = async () => { if ((closure.lead_signed_email || '').toLowerCase() === email) return alert('You gave Lead sign-off on this stage. A different Associate / Approver must approve it.'); if (!window.confirm(`Approver sign-off and close Rev ${meta.revision || '01'}?\n\nThe issued specification is frozen; only an administrator can reopen it as a new revision.`)) return; await wfCall('spec_wf_approve', {}, 'Approver sign-off failed'); };
  const reopenStage = async () => { const r = window.prompt('Reopen this closed stage as a new revision?\n\nReason (required):', ''); if (r === null) return; if (!r.trim()) return alert('A reason is required.'); await wfCall('spec_wf_reopen', {p_reason:r.trim()}, 'Reopen failed'); };

  // ── exports ──
  const packParts = () => [{num:'00', title:'COVER, DESIGN BASIS AND CONTENTS', body: locked && viewState.issued_html && viewState.issued_html['00'] ? viewState.issued_html['00'] : coverBody(viewProj, viewState, included)}, ...included.map(S => ({num:S.num, title:S.title, body:bodyOf(S)}))];
  const fileBase = x => ((viewProj.no || 'PRJ') + '_' + (stageName || '') + '_' + x + '_Rev' + (meta.revision || '01') + (closure.status === 'closed' ? '' : '_DRAFT')).replace(/[^\w\-]+/g, '_');
  const exportWord = async () => { try { await flushProject(); await flushStage(); } catch (e) {} downloadBlob(wordPack(viewProj, stageName, meta, packParts()), fileBase('Specifications') + '.doc', 'application/msword'); };
  const exportWordOne = () => { const p = packParts().find(x => x.num === pick); if (p) downloadBlob(wordPack(viewProj, stageName, meta, [p]), fileBase(p.num) + '.doc', 'application/msword'); };

  if (!ready) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#86868b',fontSize:13}}>Loading project…</div>;
  const ordered = [...stages].sort((a,b) => (a.sort_order||0) - (b.sort_order||0)), latest = ordered[ordered.length - 1];
  const curSec = included.find(S => S.num === cur), idx = included.findIndex(S => S.num === cur);
  const filtered = included.filter(S => !q || (S.num + ' ' + S.title).toLowerCase().includes(q.toLowerCase()));
  const notIncluded = candidates.filter(S => viewState.excl[S.num] && (!q || (S.num + ' ' + S.title).toLowerCase().includes(q.toLowerCase())));

  return <div className="global-page" style={{minHeight:'100vh',background:'#f5f5f7'}}><div className="pump-shell">
    <aside className={`pump-sidebar sbx no-print ${sidebarOpen ? 'open' : ''}`}>
      <div className="sbx-head"><div className="sbx-icon">§</div><div className="sbx-head-txt"><b>MEP Specifications</b><span>{BUILD_LABEL}</span></div></div>
      <div className="sbx-body">
        <div className="sbx-label">Project</div>
        <div className="sbx-card">
          <div className="sbx-logos"><img src={MEINHARDT_LOGO_SRC} alt="Meinhardt"/>{proj.clientLogo ? <><i/><img src={proj.clientLogo} alt="Client"/></> : <em>No client logo</em>}</div>
          <div className="sbx-proj-name">{proj.name || 'Untitled Project'}</div>
          <div className="sbx-proj-meta">{proj.no || 'No project no.'} · {proj.city || '—'} · Rev {meta.revision || '—'}</div>
          <button className="sbx-link" onClick={exit}>← All specification projects</button>
        </div>
        <div className="sbx-label">Stage</div>
        <div className="sbx-card">
          <div className="sbx-stage-list">{ordered.map((s, i) => <button key={s.id} className={s.id === stageId ? 'on' : ''} onClick={() => { switchStage(s.id); setSidebarOpen(false); }}><i>{i + 1}</i><span>{s.stage_name}</span>{s.id === latest.id && <small>Latest</small>}</button>)}</div>
          <div className="sbx-stage-actions">
            <button onClick={addStage}>＋ New</button>
            <button disabled={locked} onClick={renameStage}>✎ Rename</button>
            {stages.length > 1 && <button className="danger" disabled={locked} onClick={deleteStage}>🗑 Delete</button>}
          </div>
          <div className="sbx-signoff"><StageClosurePanel meta={meta} team={team} me={me} isDiscLead={isDiscLead} isApprover={isApprover} isAdmin={isAdmin} onLead={signLead} onReturn={returnStage} onApprover={signApprover} onReopen={reopenStage} busy={saveStatus === 'saving'} valid={stageReady} logoReady={!!proj.clientLogo}/></div>
        </div>
        <div className="sbx-label">Workspace</div>
        <nav className="sbx-nav">
          {[['setup','⚙','Setup'],['systems','☑','Systems'],['sections','§','Sections'],['issue','◈','Issue sheets']].map(([k, ic, l]) => <button key={k} className={tab === k ? 'active' : ''} onClick={() => { setTab(k); setSidebarOpen(false); }}><span className="ic">{ic}</span><span className="tx">{l}</span>{k === 'sections' && <span className="pill">{included.length}</span>}</button>)}
          <a href="pump.html" className="sbx-applink"><span className="ic">▥</span><span className="tx">Pump Calculator</span><span className="pill">↗</span></a>
        </nav>
        {tab === 'issue' && <><div className="sbx-label">Export</div><div className="sbx-export">
          <button className="xl2" onClick={exportWordOne}>↓ Word — current sheet</button>
          <button className="xl" onClick={exportWord}>↓ Word — full specification</button>
          <button className="pdf" onClick={() => window.print()}>▣ Print / PDF — all {included.length + 1}</button>
        </div></>}
      </div>
      <div className="sbx-foot">
        <div className="sbx-status"><span className={`sidebar-status-dot ${saveStatus === 'saving' ? 'saving' : saveStatus === 'error' ? 'error' : ''}`}/>{saveStatus === 'saving' ? 'Saving…' : saveStatus === 'error' ? 'Save failed' : 'All changes saved'}</div>
        {manualSave && <div className="sbx-msg" style={{color:/FAILED|Blocked/.test(manualSave) ? '#ff3b30' : '#16803a'}}>{manualSave}</div>}
        <div className="sbx-foot-row"><button className="sbx-save" onClick={saveNow}>⤓ Save Now</button><button className="sbx-out" onClick={() => sb.auth.signOut()}>Sign out</button></div>
      </div>
    </aside>
    <div className={`sidebar-backdrop no-print ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)}/>
    <main className="pump-main">
      <div className="pump-mobile-bar no-print"><button className="pump-mobile-menu" onClick={() => setSidebarOpen(true)}>☰</button><div className="pump-mobile-title">{proj.name || 'Specification'} <span className="mobile-stage">{stageName || ''}</span></div><div className="pump-mobile-save">{saveStatus === 'saving' ? 'Saving…' : 'Saved'}</div></div>
      <div className="app-content sidebar-content" style={{maxWidth:tab === 'sections' ? 1560 : 1180, margin:'0 auto'}}>
        {locked && tab !== 'issue' && <div className="no-print" style={{marginBottom:12,padding:'9px 11px',background:'#fff4e0',border:'1px solid #fed7aa',borderRadius:8,fontSize:11,color:'#9a3412'}}>This stage is {stageStatusLabel(meta).toLowerCase()}. Selections and text are read-only; the issued text is frozen. Only an administrator can reopen a closed stage.</div>}

        {tab === 'setup' && <div className="setup-card no-print"><fieldset disabled={locked} style={{border:0,padding:0,margin:0,minWidth:0}}>
          <div className="setup-grid">
            <Field label="Project name" value={proj.name || ''} onChange={v => setProj(p => ({...p, name:v}))}/>
            <Field label="Project no." value={proj.no || ''} onChange={v => setProj(p => ({...p, no:v}))}/>
            <Field label="Revision" value={meta.revision || ''} onChange={v => setMeta(m => ({...m, revision:v}))}/>
            <Field label="Date" type="date" value={meta.date || ''} onChange={v => setMeta(m => ({...m, date:v}))}/>
          </div>
          <div className="setup-grid3">
            <Field label="Client / Owner" value={proj.client || ''} onChange={v => setProj(p => ({...p, client:v}))}/>
            <Field label="Consultant" value={proj.consultant || ''} onChange={v => setProj(p => ({...p, consultant:v}))}/>
            <div/>
          </div>
          <div className="setup-grid3">
            <SignOff label="Prepared by · Engineer" team={engineerTeam} who={meta.calcBy} when={meta.calcDate} onWho={v => setMeta(m => ({...m, calcBy:v}))} onWhen={v => setMeta(m => ({...m, calcDate:v}))}/>
            <SignedField label="Checked by · Lead" team={team} who={meta.checkedBy} when={meta.checkedDate} pending="Filled automatically at Lead sign-off"/>
            <SignedField label="Approved by · Associate / Approver" team={team} who={meta.reviewedBy} when={meta.reviewedDate} pending="Filled automatically at Approver sign-off"/>
          </div>
          <div className="setup-more" style={{borderTop:'1px solid #ececf0',marginTop:14,paddingTop:12}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:12,alignItems:'end'}}>
              <Sel label="Country" value={proj.country || ''} onChange={v => { const c = Object.keys((COUNTRIES[v] || {}).cities || {})[0] || ''; setProj(p => ({...p, country:v, city:c})); }} options={[{value:'',label:'— Select —'}, ...Object.entries(COUNTRIES).map(([k, c]) => ({value:k, label:c.name}))]}/>
              <Sel label="City / Emirate / Region" value={proj.city || ''} onChange={v => setProj(p => ({...p, city:v}))} options={Object.keys((COUNTRIES[proj.country] || {}).cities || {}).map(c => ({value:c, label:c}))}/>
              <button type="button" onClick={loadLocation} className="setup-next" style={{marginLeft:0}}>Load location defaults</button>
            </div>
            <div style={{fontSize:10,color:'#a76200',background:'#fff4e0',borderRadius:8,padding:'7px 10px',margin:'10px 0'}}>Location defaults are starting values. Confirm code editions, authority names and supply data with the AHJ and utility before issue. These fields fill the {'{{FIELD}}'} tags in every section.</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>{Object.entries(PF_GROUPS).map(([g, title]) => <div key={g}><div style={{...lbl,fontSize:10,marginBottom:6}}>{title}</div>{PF_FIELDS.filter(f => f[0] === g).map(([, k, t]) => <div key={k} style={{marginBottom:7}}><Field label={t} value={(proj.pf || {})[k] || ''} onChange={v => setPf(k, v)}/></div>)}</div>)}</div>
          </div>
          <div className="setup-logo">
            <div className="client-brand-preview">{proj.clientLogo ? <img src={proj.clientLogo} alt="Client logo"/> : <span style={{fontSize:10,color:'#86868b'}}>No logo</span>}</div>
            <div><label style={lbl}>Client logo (PNG / JPG / SVG, max 300 KB)</label><input type="file" accept="image/png,image/jpeg,image/svg+xml" onChange={e => uploadLogo(e.target.files && e.target.files[0])} style={{fontSize:11}}/>{logoMsg && <div style={{marginTop:4,fontSize:10,color:/Use a/.test(logoMsg) ? '#b91c1c' : '#16803a'}}>{logoMsg}</div>}</div>
            <button type="button" className="setup-next" onClick={() => setTab('systems')}>Continue →</button>
          </div>
          <details className="setup-more"><summary>Project review access</summary><div style={{marginTop:10}}><SpecProjectAccess projectId={projectId} team={team} roles={roles} session={session} canManage={isAdmin || projectRow.user_id === userId}/></div></details>
        </fieldset></div>}

        {tab === 'systems' && <div className="no-print">
          <div className="schedule-context" style={{marginBottom:10}}><div><div className="schedule-eyebrow">Stage 2 · {stageName}</div><div className="schedule-title">Systems and options</div><div className="schedule-subtitle">Selections decide which sections, clauses, materials and manufacturers go into the specification.</div></div>
            {!locked && <button className="schedule-action" onClick={() => { if (window.confirm('Reset all selections to the library defaults?')) setState(s => ({...s, opts:defaultOpts()})); }}>Reset to defaults</button>}</div>
          <fieldset disabled={locked} style={{border:0,padding:0,margin:0,minWidth:0}}><div className="spec-optcols">{[0,1,2].map(col => <div key={col}>{OPTS.filter(g => Math.min(Math.max(+g.col || 0, 0), 2) === col).map(g => <div key={g.grp} className="pf-sec" style={{marginBottom:10,background:'#fff'}}>
            <h5 style={{marginBottom:6}}>{g.grp}</h5>
            {g.items.map(i => { const en = !i.dep || evalCond(i.dep, state.opts), v = state.opts[i.k]; return <div key={i.k} className={'spec-opt' + (en ? '' : ' dis')} style={{paddingLeft:(i.sub || 0) * 18}}>
              {!i.type ? <label style={{display:'flex',gap:8,alignItems:'center',cursor:'pointer',fontSize:'11.5px!important'}}><input type="checkbox" disabled={!en} checked={!!v} onChange={e => setOpt(i.k, e.target.checked)}/><span className="spec-opt-t">{i.t}</span></label>
              : <><span className="spec-opt-t">{i.t}</span>{i.type === 'sel' ? <select disabled={!en} value={v ?? ''} onChange={e => setOpt(i.k, e.target.value)}>{(i.o || []).map(x => { const [a, b] = Array.isArray(x) ? x : [x, x]; return <option key={a} value={a}>{b}</option>; })}</select> : <input type={i.type === 'num' ? 'number' : 'text'} disabled={!en} value={v ?? ''} onChange={e => setOpt(i.k, e.target.value)}/>}</>}
            </div>; })}
          </div>)}</div>)}</div></fieldset>
          <div className="schedule-card" style={{marginTop:6}}><div className="schedule-card-head"><div><h2>Resulting sections</h2><p>{candidates.length} of {LIB.length} library sections selected by these options</p></div></div>
            <div style={{padding:12,display:'flex',flexWrap:'wrap',gap:6}}>{candidates.map(S => <span key={S.num} className="method-chip" style={{fontSize:10,padding:'4px 8px'}}><b style={{marginRight:5}}>{S.num}</b>{S.title}{S.cond ? ' · P' : ' · G'}</span>)}</div></div>
        </div>}

        {tab === 'sections' && <div className="no-print">
          <div className="schedule-health" style={{marginBottom:10}}>
            <div className="health-card capacity"><div className="h-label">Sections included</div><div className="h-value">{health.n}</div><div className="h-note">{candidates.length - included.length} excluded by you</div></div>
            <div className="health-card pass"><div className="h-label">Reviewed</div><div className="h-value">{health.rev}</div><div className="h-note">Required for sign-off</div></div>
            <div className="health-card review"><div className="h-label">Project edits</div><div className="h-value">{health.ed}</div><div className="h-note">Kept when options change</div></div>
            <div className="health-card blocked"><div className="h-label">Unresolved fields</div><div className="h-value">{health.unres - health.tbc}</div><div className="h-note">Red highlights</div></div>
            <div className="health-card blocked"><div className="h-label">TBC items</div><div className="h-value">{health.tbc}</div><div className="h-note">Materials / vendors to confirm</div></div>
          </div>
          <div className="piw" style={{gridTemplateColumns:'270px minmax(0,1fr)'}}>
            <aside className="piw-list">
              <div className="piw-list-head"><div className="piw-h"><b>Sections</b><span>{included.length}</span></div><input className="piw-search" value={q} onChange={e => setQ(e.target.value)} placeholder="Search number or title"/></div>
              <div className="piw-items">

            </section>
          </div>
        </div>}

        {tab === 'issue' && <div>
          <div className="calc-export-bar no-print"><div className="calc-export-note">{closure.status === 'closed' ? 'Stage issued — sheets show the frozen text and the sign-off record.' : 'Stage not closed — every sheet carries a DRAFT watermark until Lead and Approver sign-off are complete.'}{!stageReady && closure.status === 'draft' && <><br/><b style={{color:'#a76200'}}>Not ready for sign-off: {blockReason}</b></>}</div></div>
          <div className="calcwrap">
            <div className="calcpick no-print">{packParts().map((p, i) => <button key={p.num} onClick={() => setPick(p.num)} className={'calcpick-item' + (pick === p.num ? ' on' : '')}><span className="calcpick-no">{i}</span><span className="calcpick-body"><b>{p.title}</b><span>{p.num === '00' ? 'Cover' : p.num}</span></span></button>)}</div>
            <div className="calcsplit">{packParts().map(p => { const sel = pick === p.num; return <div key={p.num} className={(sel ? 'calcsplit-pane' : 'screen-hide') + ' calc-page'}>

            </div>; })}</div>
          </div>
        </div>}
      </div>
    </main>
  </div></div>;
}

const ITEM_FIELDS = [['code','Code'],['section_num','Section no.'],['grp','Group'],['item','Item'],['material','Material / option'],['rating','Rating / class'],['jointing','Jointing'],['standards','Standards'],['application','Application / limits'],['include_when','Include when (blank = always)'],['status','Status',['Verified','Draft','TBC']],['source','Source'],['sort','Sort','num'],['active','Active','bool']];

function RowEditor({cfg, row, isNew, onClose, onSaved, canEdit, who}) {

      else if (t === 'num') x = Number(x) || 0;
      else if (t === 'bool') x = !!x;
      else x = String(x ?? '').trim() === '' ? null : String(x).trim();
      out[k] = x;
    }
    for (const k of cfg.key.split(',')) if (!out[k]) { setMsg(k + ' is required.'); return; }
    if ('updated_by' in row || cfg.table === 'spec_items' || cfg.table === 'spec_vendors') out.updated_by = who;
    const unk = condKeys(out.include_when || out.dep || '').filter(x => !OPTMAP[x]);
    if (unk.length && !window.confirm('Unknown option key(s): ' + unk.join(', ') + '. This row will never be included. Save anyway?')) return;
    const {error} = await sb.from(cfg.table).upsert(out, {onConflict:cfg.key});
    if (error) { setMsg('Save failed: ' + error.message); return; }
    onSaved();
  };
  return <Modal title={(isNew ? 'New ' : 'Edit ') + cfg.title.toLowerCase()} onClose={onClose}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 12px'}}>{cfg.fields.map(([k, label, t]) => <div key={k} style={{gridColumn:(t === 'json' || ['makers','standards','application','material'].includes(k)) ? '1/3' : 'auto'}}>
      <label style={lbl}>{label}</label>
      {Array.isArray(t) ? <select disabled={!canEdit} value={v[k] || t[1]} onChange={e => setV({...v, [k]:e.target.value})} style={inp}>{t.map(o => <option key={o}>{o}</option>)}</select>
      : t === 'bool' ? <input type="checkbox" disabled={!canEdit} checked={!!v[k]} onChange={e => setV({...v, [k]:e.target.checked})}/>
      : t === 'json' ? <textarea disabled={!canEdit} value={v[k]} onChange={e => setV({...v, [k]:e.target.value})} rows={k === 'data' ? 10 : 3} style={{...inp,fontFamily:'ui-monospace,Menlo,Consolas,monospace',fontSize:11}}/>

    </div>)}</div>
    <datalist id="optKeyList">{Object.keys(OPTMAP).map(k => <option key={k} value={k}>{OPTMAP[k].t}</option>)}</datalist>
    <datalist id="secNumList">{LIB.map(S => <option key={S.num} value={S.num}>{S.title}</option>)}</datalist>
    {msg && <div className="ai-msg bad" style={{marginTop:8}}>{msg}</div>}
    <div className="ai-row" style={{marginTop:12}}><span style={{flex:1}}/>{!canEdit && <span className="ai-note">Read-only — only Admin, Lead or Associate can edit the library.</span>}<button onClick={onClose}>Cancel</button>{canEdit && <button className="pri" onClick={save}>Save to library</button>}</div>
  </Modal>;
}
function SectionEditor({S, onClose, onSaved, canEdit, who}) {

  const preview = useMemo(() => { const s = sectionFromRow({num:f.num || '?? ????', title:f.title, include_when:f.include_when, body:f.body}); const o = defaultOpts(); OPTS.forEach(g => g.items.forEach(i => { if (!i.type) o[i.k] = true; })); const C = Object.keys(COUNTRIES)[0]; return genSection(s, o, tokens({country:C, city:'*', pf:profileFor(C, '')}, o)); }, [f]);

  const showHist = async () => { const {data, error} = await sb.from('spec_section_history').select('*').eq('section_num', S.num).order('changed_at', {ascending:false}).limit(50); if (error) return setMsg(error.message); setHist(data || []); };

    </div>
    <datalist id="optKeyList2">{Object.keys(OPTMAP).map(k => <option key={k} value={k}>{OPTMAP[k].t}</option>)}</datalist>
    <div style={{fontSize:10,color:'#86868b',margin:'8px 0'}}>Format: <code># PART 1 GENERAL</code> · <code>= ARTICLE</code> · <code>- paragraph</code> (2 spaces per sub-level) · line prefix <code>[if:key]</code>, <code>[if:a|b]</code>, <code>[if:a&amp;b]</code>, <code>[if:key=value]</code> · fields <code>{'{{CD}} {{WATER}} {{V3}}'}</code>. Numbering is automatic.</div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <textarea disabled={!canEdit} value={f.body} onChange={e => setF({...f, body:e.target.value})} spellCheck={false} style={{...inp,height:'52vh',fontFamily:'ui-monospace,Menlo,Consolas,monospace',fontSize:11.5,whiteSpace:'pre'}}/>
      <div className="spec-doc spec-edit" style={{height:'52vh',overflow:'auto'}} dangerouslySetInnerHTML={{__html:preview}}/>

    {hist && <div className="ai-review" style={{marginTop:8}}>{hist.length ? hist.map((h, i) => <div key={i} style={{display:'flex',gap:8,alignItems:'center',borderBottom:'1px solid #ece6fd',padding:'4px 0'}}><span style={{flex:1}}>{fmtWhen(h.changed_at)} · {h.changed_by || '—'} · {h.action} · {h.title}</span>{canEdit && <button className="schedule-action" onClick={() => setF({...f, title:h.title, include_when:h.include_when || '', body:h.body || ''})}>Load</button>}</div>) : 'No previous versions.'}</div>}

        <div style={{padding:'8px 12px',fontSize:10,color:'#86868b'}}>{LIB.length} sections · {(rows.items || []).length} items · {(rows.vendors || []).length} manufacturer rows · {OPTS.reduce((a, g) => a + g.items.length, 0)} options · {Object.keys(COUNTRIES).length} countries</div>

// PROJECT LIST
// ══════════════════════════════════════════════════════════════════════════
function SpecHome({session, me, isAdmin, roles, canEditLib, onOpen, onOpenLibrary}) {
  const userId = session.user.id, email = (session.user.email || '').toLowerCase();
  const canApprove = isAdmin || roles.some(r => r.active !== false && (r.email || '').toLowerCase() === email && r.role === 'associate');
  const [list, setList] = useState(null); const [wf, setWf] = useState({}); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const refresh = useCallback(async () => {
    const {data, error} = await sb.from('spec_projects').select('id,name,user_id,updated_at,project').order('updated_at', {ascending:false});
    if (error) { setErr(error.message); setList([]); return; }
    setErr(''); setList(data || []);
    const ids = (data || []).map(r => r.id); const info = {};
    if (ids.length) {
      const {data: st} = await sb.from('spec_project_stages').select('project_id,stage_name,closure:meta->closure').in('project_id', ids);
      (st || []).forEach(s => { const w = info[s.project_id] = info[s.project_id] || {names:[], awaiting:[], closed:0, mine:0}; w.names.push(s.stage_name); const c = s.closure || {}; if (c.status === 'closed') w.closed++; if (c.status === 'awaiting_approver') { w.awaiting.push(s.stage_name); if (canApprove && (c.lead_signed_email || '').toLowerCase() !== email) w.mine++; } });
    }
    setWf(info);
  }, [canApprove, email]);
  useEffect(() => { refresh(); }, [refresh]);
  const create = async () => {
    const name = window.prompt('New specification project name:', 'Untitled Project'); if (!name) return;
    setBusy(true);
    const c = Object.keys(COUNTRIES).includes('UAE') ? 'UAE' : Object.keys(COUNTRIES)[0] || '';
    const cities = Object.keys((COUNTRIES[c] || {}).cities || {}); const city = cities.includes('Dubai') ? 'Dubai' : cities[0] || '';
    const project = {name, no:'', client:'', consultant:'', country:c, city, pf:profileFor(c, city)};
    const {data, error} = await sb.from('spec_projects').insert({user_id:userId, name, project}).select().single();
    if (error) { setBusy(false); return alert('Could not create project: ' + error.message); }
    await sb.from('spec_project_stages').insert({project_id:data.id, user_id:userId, stage_name:'Concept', sort_order:0, state:blankState(), meta:{...EMPTY_META}});
    setBusy(false); onOpen(data);
  };
  const rename = async r => { const name = window.prompt('Rename project:', r.name); if (!name || name === r.name) return; const {error} = await sb.from('spec_projects').update({name, project:{...(r.project || {}), name}}).eq('id', r.id); if (error) alert(error.message); refresh(); };
  const duplicate = async r => {
    const {data: st, error: e1} = await sb.from('spec_project_stages').select('stage_name,sort_order,state,meta').eq('project_id', r.id).order('sort_order'); if (e1) return alert(e1.message);
    const name = (r.name || 'Untitled Project') + ' (Copy)';
    const {data, error} = await sb.from('spec_projects').insert({user_id:userId, name, project:{...(r.project || {}), name}}).select().single(); if (error) return alert(error.message);
    const rows = (st || []).map(s => { const state = {...(s.state || {})}; delete state.issued_html; delete state.issued_list; return {project_id:data.id, user_id:userId, stage_name:s.stage_name, sort_order:s.sort_order, state:{...state, reviewed:{}}, meta:{...EMPTY_META, revision:(s.meta || {}).revision || '01', calcBy:(s.meta || {}).calcBy || ''}}; });
    if (rows.length) await sb.from('spec_project_stages').insert(rows);
    refresh();
  };
  const remove = async r => { const w = wf[r.id]; if (w && (w.closed || w.awaiting.length)) return alert('Projects with issued or in-review stages cannot be deleted.'); if (!window.confirm(`Delete "${r.name}"? This cannot be undone.`)) return; const {error} = await sb.from('spec_projects').delete().eq('id', r.id); if (error) alert(error.message); refresh(); };
  const btn = {padding:'7px 14px',background:'white',color:'#424245',border:'1px solid #d2d2d7',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer'};
  return <div className="global-page" style={{minHeight:'100vh',background:'#f5f5f7'}}>
    <div className="app-header"><div style={{maxWidth:1000,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}><div style={{fontSize:15,fontWeight:600}}>Specification Builder</div><span className="build-pill">{BUILD_LABEL}</span></div>
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
        <UserBadge session={session} me={me}/>
        <a href="pump.html" style={{...btn,textDecoration:'none',padding:'5px 12px'}}>▥ Pump Calculator</a>
        <button onClick={onOpenLibrary} style={{...btn,padding:'5px 12px'}}>📚 Library{canEditLib ? '' : ' (view)'}</button>
        <button onClick={() => sb.auth.signOut()} style={{padding:'5px 12px',background:'transparent',color:'#8e8e93',border:'none',fontSize:11,fontWeight:600,cursor:'pointer'}}>Sign Out</button>
      </div></div></div>
    <div style={{maxWidth:1000,margin:'0 auto',padding:28}}>
      <div style={{display:'flex',gap:10,marginBottom:22}}><button disabled={busy} onClick={create} style={{padding:'10px 22px',background:'#007aff',color:'white',border:'none',borderRadius:9,fontSize:13,fontWeight:700,cursor:'pointer'}}>+ New Specification Project</button></div>
      {LIB_ERROR && <div style={{fontSize:12,color:'#a76200',background:'#fff4e0',borderRadius:8,padding:'9px 12px',marginBottom:14}}>{LIB_ERROR}</div>}
      {err && <div style={{fontSize:12,color:'#ff3b30',marginBottom:14}}>{err}</div>}
      {list === null ? <div style={{color:'#86868b',fontSize:13}}>Loading projects…</div> : !list.length ? <div style={{background:'white',borderRadius:16,border:'1px solid #d2d2d7',padding:40,textAlign:'center',color:'#86868b',fontSize:13}}>No specification projects yet — create one above.</div>
      : <div style={{display:'flex',flexDirection:'column',gap:10}}>{list.map(r => { const w = wf[r.id] || {names:[], awaiting:[], closed:0, mine:0}; return <div key={r.id} className="project-card" style={{background:'white',borderRadius:12,border:'1px solid #d2d2d7',padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:14}}>
        <div style={{cursor:'pointer',flex:1}} onClick={() => onOpen(r)}>
          <div style={{fontSize:14,fontWeight:800}}>§ {r.name}{(r.project || {}).no ? <span style={{fontWeight:600,color:'#86868b'}}> · {r.project.no}</span> : null}</div>
          <div style={{fontSize:11,color:'#86868b',marginTop:3}}>{w.names.length} stage{w.names.length === 1 ? '' : 's'}{w.names.length ? ' — ' + w.names.join(', ') : ''} · {(r.project || {}).city || ''} · Updated {new Date(r.updated_at).toLocaleString()}{r.user_id !== userId ? ' · shared with you' : ''}</div>
          {(w.awaiting.length > 0 || w.closed > 0) && <div className="ph-chips">{w.mine > 0 && <span className="ph-chip you">● Your sign-off needed ({w.mine})</span>}{w.awaiting.length > 0 && <span className="ph-chip wait">Awaiting Approver: {w.awaiting.join(', ')}</span>}{w.closed > 0 && <span className="ph-chip ok">🔒 {w.closed} issued</span>}</div>}
        </div>
        <div style={{display:'flex',gap:7,flexShrink:0}}>
          <button onClick={() => onOpen(r)} style={{padding:'7px 16px',background:'#007aff',color:'white',border:'none',borderRadius:10,fontSize:11,fontWeight:700,cursor:'pointer'}}>Open</button>
          {(r.user_id === userId || isAdmin) && <><button onClick={() => rename(r)} style={btn}>Rename</button><button onClick={() => duplicate(r)} style={btn}>Duplicate</button><button onClick={() => remove(r)} style={{...btn,color:'#ff3b30',border:'1px solid #fecaca'}}>Delete</button></>}
        </div></div>; })}</div>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════════════════════
// ROOT — same authentication and access gate as the pump calculator
// ══════════════════════════════════════════════════════════════════════════
function RootApp() {
  const [session, setSession] = useState(undefined);
  const {team, roles, me, isAdmin, ready:teamReady, reload:reloadTeam} = useTeamData(session);
  const [open, setOpen] = useState(null); const [screen, setScreen] = useState('projects'); const [libReady, setLibReady] = useState(false);
  useEffect(() => {
    const apply = s => setSession(prev => { if (prev === undefined) return s || null; return (prev?.user?.id || null) === (s?.user?.id || null) ? prev : (s || null); });
    sb.auth.getSession().then(({data}) => apply(data.session || null));
    const {data: sub} = sb.auth.onAuthStateChange((_e, s) => { apply(s); if (!s) { setOpen(null); setLibReady(false); } });
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => { if (!session || !teamReady || !me || me.active === false) return; let c = false; loadLibrary().then(() => { if (!c) setLibReady(true); }); return () => { c = true; }; }, [session, teamReady, me]);
  if (session === undefined) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#86868b',fontSize:13}}>Loading…</div>;
  if (!session) return <AuthScreen/>;
  if (!teamReady) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#86868b',fontSize:13}}>Loading secure workspace…</div>;
  if (!me || me.active === false) return <AccessPendingScreen session={session} reload={reloadTeam}/>;
  if (!libReady) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#86868b',fontSize:13}}>Loading specification library…</div>;
  const email = (session.user.email || '').toLowerCase();
  const canEditLib = isAdmin || roles.some(r => r.active !== false && (r.email || '').toLowerCase() === email && (r.role === 'lead' || r.role === 'associate' || r.role === 'admin'));
  const who = (me && (me.initials || me.name)) || email;
  if (open) return <SpecApp key={open.id} session={session} projectRow={open} team={team} roles={roles} isAdmin={isAdmin} onBack={() => setOpen(null)}/>;
  if (screen === 'library') return <LibraryAdmin onBack={() => setScreen('projects')} canEdit={canEditLib} who={who}/>;
  return <SpecHome session={session} me={me} isAdmin={isAdmin} roles={roles} canEditLib={canEditLib} onOpen={r => setOpen(r)} onOpenLibrary={() => setScreen('library')}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<RootApp/>);

</script>
</body>
</html>
