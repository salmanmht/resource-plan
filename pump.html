<style>
  :root { --rp-bg:#f5f5f7; --rp-surface:#fff; --rp-border:#d2d2d7; --rp-text:#1d1d1f; --rp-muted:#86868b; --rp-accent:#007aff; --rp-accent-soft:#e8f0fe; --rp-danger:#ff3b30; --rp-radius:10px; --rp-radius-large:14px; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; background:var(--rp-bg); color:var(--rp-text); font-size:13px; letter-spacing:-.01em; }
  input, select { font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }
  .rp-page { min-height:100vh; background:var(--rp-bg); }
  .rp-card { background:var(--rp-surface); border:1px solid var(--rp-border); border-radius:var(--rp-radius-large); box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02); }
  .rp-header { background:rgba(255,255,255,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--rp-border); box-shadow:0 1px 3px rgba(0,0,0,.04); }
  @media screen and (max-width:700px){ body{font-size:12px;} }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    .page-break { page-break-before: always; }
    /* Each pump's calculation starts on a fresh sheet of paper */
    .calc-page { page-break-after: always; break-after: page; page-break-inside: avoid; }
    .calc-page:last-child { page-break-after: auto; break-after: auto; }
    @page { margin: 9mm; }
  }

  /* ── Schedule-review workspace ───────────────────────────────────────── */
  .schedule-review{display:flex;flex-direction:column;gap:14px;}
  .schedule-context{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:2px 2px 0;flex-wrap:wrap;}
  .schedule-eyebrow{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#86868b;margin-bottom:4px;}
  .schedule-title{font-size:20px;font-weight:750;letter-spacing:-.03em;color:#1d1d1f;}
  .schedule-subtitle{font-size:12px;color:#86868b;margin-top:3px;}
  .schedule-context-status{display:flex;align-items:center;gap:8px;font-size:11px;color:#86868b;padding-top:5px;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:#34c759;display:inline-block;}.save-dot.error{background:#ff3b30;}.save-dot.saving{background:#ff9500;}
  .schedule-health{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;}
  .health-card{appearance:none;text-align:left;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0;}
  .health-card:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,.07);border-color:#b9b9c0;}.health-card.on{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.12);}

  .health-card.pass{border-top:3px solid #34c759;}.health-card.review{border-top:3px solid #ff9500;}.health-card.blocked{border-top:3px solid #ff3b30;}.health-card.capacity{border-top:3px solid #007aff;}
  .schedule-card{background:#fff;border:1px solid #d2d2d7;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;}
  .schedule-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid #e8e8ed;flex-wrap:wrap;}.schedule-card-head h2{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#1d1d1f;}.schedule-card-head p{font-size:10px;color:#86868b;margin-top:3px;}
  .schedule-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #e8e8ed;flex-wrap:wrap;background:#fafafb;}.schedule-toolbar input,.schedule-toolbar select{width:auto;min-width:130px;padding:7px 10px;border:1px solid #d2d2d7;border-radius:8px;font-size:11px;background:#fff;color:#1d1d1f;outline:none;}.schedule-toolbar input{flex:1 1 220px;}.schedule-toolbar input:focus,.schedule-toolbar select:focus{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.12);}.toolbar-spacer{flex:1;}.density-switch{display:inline-flex;border:1px solid #d2d2d7;border-radius:8px;overflow:hidden;background:#fff;}.density-switch button{border:0;background:#fff;color:#86868b;padding:7px 10px;font-size:10px;font-weight:650;cursor:pointer;}.density-switch button.on{background:#e8f0fe;color:#007aff;}
  .status-chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:750;white-space:nowrap;line-height:1.3;}.status-chip.pass{background:#e8faf0;color:#208a45;}.status-chip.review{background:#fff4e0;color:#a76200;}.status-chip.blocked{background:#fff0ee;color:#d8332b;}.status-chip.draft{background:#f1f1f3;color:#6e6e73;}.method-chip{display:inline-flex;padding:2px 6px;border:1px solid #d2d2d7;border-radius:6px;color:#6e6e73;background:#fff;font-size:9px;font-weight:700;white-space:nowrap;}
  .schedule-table-wrap{overflow:auto;max-height:calc(100vh - 340px);min-height:260px;}.schedule-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1180px;font-size:11px;}.schedule-table th{position:sticky;z-index:3;background:#1e3a5f;color:#fff;text-align:left;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:9px 10px;border-bottom:1px solid #17304f;white-space:nowrap;}.schedule-table thead tr.group th{display:none;}.schedule-table thead tr.labels th{top:0;}.schedule-table td{padding:10px;border-bottom:1px solid #ececf0;vertical-align:middle;color:#424245;background:#fff;}.schedule-table.compact td{padding:6px 10px;}.schedule-table tbody tr{cursor:pointer;transition:background .12s;}.schedule-table tbody tr:hover td{background:#f5f5f7;}.schedule-table tbody tr.selected td{background:#e8f0fe;}.schedule-table tbody tr.blocked td{background:#fffafa;}.schedule-table .sticky-left{position:sticky;z-index:2;background:inherit;}.schedule-table th.sticky-left{z-index:5;background:#1e3a5f;}.schedule-table th.row-no,.schedule-table td.row-no{left:0;width:48px;min-width:48px;text-align:center;color:#86868b;font-variant-numeric:tabular-nums;}.schedule-table th.system,.schedule-table td.system{left:48px;min-width:240px;max-width:300px;}.schedule-table th.tag,.schedule-table td.tag{left:288px;min-width:92px;}.schedule-table th.sticky-right,.schedule-table td.sticky-right{position:sticky;right:0;z-index:2;background:inherit;box-shadow:-2px 0 4px rgba(0,0,0,.04);}.schedule-table th.sticky-right{z-index:5;background:#1e3a5f;}.system-main{font-weight:700;color:#1d1d1f;line-height:1.25;}.system-sub{font-size:9px;color:#86868b;margin-top:2px;}.tag-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:#424245;}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}.num.strong{font-weight:800;color:#1d1d1f;font-size:12px;}.pipe-main{font-size:10px;color:#424245;}.pipe-sub{font-size:9px;color:#86868b;margin-top:2px;}.schedule-action{border:1px solid #d2d2d7;background:#fff;color:#007aff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer;}.schedule-action:hover{border-color:#007aff;background:#e8f0fe;}.empty-schedule{padding:34px 20px;text-align:center;color:#86868b;font-size:12px;}.schedule-mobile{display:none;gap:8px;padding:10px;}.schedule-mobile-card{border:1px solid #d2d2d7;border-radius:12px;padding:12px;background:#fff;cursor:pointer;}.schedule-mobile-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}.schedule-mobile-name{font-weight:750;color:#1d1d1f;font-size:12px;line-height:1.35;}.schedule-mobile-tag{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#86868b;margin-top:2px;}.schedule-mobile-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #ededf0;}.schedule-mobile-metrics span{font-size:9px;color:#86868b;display:block;}.schedule-mobile-metrics b{display:block;font-size:12px;color:#1d1d1f;margin-top:2px;font-variant-numeric:tabular-nums;}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:500;}.inspection-drawer{position:fixed;z-index:501;top:0;right:0;width:min(480px,100vw);height:100dvh;background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.16);display:flex;flex-direction:column;animation:drawer-in .18s ease-out;}.inspection-drawer header{padding:18px 20px;border-bottom:1px solid #d2d2d7;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}.inspection-drawer h3{font-size:16px;letter-spacing:-.02em;color:#1d1d1f;line-height:1.3;}.inspection-drawer .close{border:0;background:#f5f5f7;color:#424245;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer;}.inspection-drawer main{padding:18px 20px;overflow:auto;flex:1;}.drawer-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}.drawer-metric{background:#f5f5f7;border:1px solid #e2e2e7;border-radius:10px;padding:10px;}.drawer-metric span{font-size:9px;color:#86868b;text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:block;}.drawer-metric b{font-size:16px;color:#1d1d1f;margin-top:4px;display:block;font-variant-numeric:tabular-nums;}.drawer-section{border-top:1px solid #e7e7eb;padding-top:14px;margin-top:14px;}.drawer-section h4{font-size:10px;color:#86868b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;}.drawer-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:11px;border-bottom:1px solid #f0f0f2;}.drawer-line span{color:#86868b;}.drawer-line b{color:#1d1d1f;text-align:right;}.drawer-warning{margin-top:8px;padding:9px 10px;border-radius:8px;font-size:11px;line-height:1.45;}.drawer-warning.review{background:#fff4e0;color:#a76200;}.drawer-warning.blocked{background:#fff0ee;color:#d8332b;}.drawer-footer{border-top:1px solid #d2d2d7;padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;}.drawer-footer button{border:1px solid #d2d2d7;background:#fff;color:#424245;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:650;cursor:pointer;}.drawer-footer button.primary{background:#007aff;border-color:#007aff;color:#fff;}
  @keyframes drawer-in{from{transform:translateX(24px);opacity:.7}to{transform:translateX(0);opacity:1}}
  @media screen and (max-width:900px){.schedule-health{grid-template-columns:repeat(3,minmax(130px,1fr));}.schedule-table-wrap{display:none;}.schedule-mobile{display:grid;}.schedule-card-head{padding:14px;}.schedule-toolbar{padding:10px;}.schedule-toolbar input{flex-basis:100%;}.toolbar-spacer{display:none;}.inspection-drawer{width:100%;}.schedule-context{padding:2px 0;}.schedule-title{font-size:18px;}}
  @media screen and (max-width:600px){.schedule-health{grid-template-columns:repeat(2,minmax(130px,1fr));}.health-card:last-child{grid-column:span 2;}.schedule-context-status{width:100%;padding-top:0;}.density-switch{display:none;}}
  @media print{.schedule-health,.schedule-toolbar,.inspection-drawer,.drawer-backdrop,.schedule-context-status,.schedule-action{display:none!important;}.schedule-review{gap:4px;}.schedule-card{border:none;box-shadow:none;}.schedule-card-head{padding:4px 0 8px;}.schedule-table-wrap{display:block!important;overflow:visible!important;max-height:none!important;}.schedule-mobile{display:none!important;}.schedule-table{min-width:0;font-size:9px;}.schedule-table th,.schedule-table td{position:static!important;padding:5px!important;box-shadow:none!important;}.schedule-table th.system,.schedule-table td.system{min-width:0;max-width:none;}.schedule-table th.tag,.schedule-table td.tag{min-width:0;}.schedule-table thead tr.labels th{top:auto;}.schedule-table thead tr.group th{display:none;}}


  /* ── Global Resource Planning design system ────────────────────────────── */
  :root{
    --app-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
    --app-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    --app-bg:#f5f5f7;--app-surface:#fff;--app-surface-subtle:#fafafb;--app-border:#d2d2d7;
    --app-text:#1d1d1f;--app-text-2:#424245;--app-muted:#86868b;--app-blue:#007aff;
    --app-blue-soft:#e8f0fe;--app-green:#34c759;--app-green-soft:#e8faf0;
    --app-amber:#ff9500;--app-amber-soft:#fff4e0;--app-red:#ff3b30;--app-red-soft:#fff0ee;
    --app-radius:10px;--app-radius-large:14px;--app-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  }
  #root,#root *{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root{color:var(--app-text);font-size:13px;line-height:1.45;}
  #root input,#root select,#root textarea{font-family:var(--app-sans)!important;border-color:var(--app-border)!important;border-radius:var(--app-radius)!important;color:var(--app-text)!important;background:#fff!important;}
  #root input:focus,#root select:focus,#root textarea:focus{outline:none!important;border-color:var(--app-blue)!important;box-shadow:0 0 0 3px rgba(0,122,255,.12)!important;}
  #root button{font-family:var(--app-sans)!important;letter-spacing:-.01em;}
  #root button:focus-visible,#root a:focus-visible,#root input:focus-visible,#root select:focus-visible{outline:3px solid rgba(0,122,255,.26)!important;outline-offset:2px;}
  .global-page{background:var(--app-bg)!important;min-height:100dvh!important;}
  .app-header{position:relative!important;background:rgba(255,255,255,.9)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:0 1px 3px rgba(0,0,0,.04)!important;padding:14px 24px!important;}
  .app-header *{color:var(--app-text)!important;}.app-header [style*="color:\"#86868b\""]{color:var(--app-muted)!important;}
  .app-tabbar{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(18px)!important;border-bottom:1px solid var(--app-border)!important;box-shadow:none!important;}
  .app-tabbar button{border-radius:0!important;font-weight:650!important;}.app-tabbar button:hover{background:var(--app-surface-subtle)!important;color:var(--app-text)!important;}
  .app-content{padding:20px 24px 30px!important;}
  .global-page [style*="borderRadius:12"],.global-page [style*="borderRadius:16"]{box-shadow:var(--app-shadow)!important;}
  .global-page [style*="textTransform:\"uppercase\""]{font-size:10px!important;letter-spacing:.06em!important;font-weight:700!important;}
  /* Input workspace */
  .pump-input-workspace{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .pump-input-workspace [style*="borderTop"]{border-color:#ececf0!important;}
  .live-calc{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .live-calc-summary{background:var(--app-surface-subtle)!important;border-bottom:1px solid var(--app-border)!important;}
  .live-calc-summary *{color:var(--app-text)!important;}.live-calc-summary [style*="color:"]{color:var(--app-muted)!important;}
  .live-calc-summary [style*="fontSize:15"]{color:var(--app-text)!important;font-family:var(--app-display)!important;font-weight:750!important;}
  .live-calc-section{background:#f5f5f7!important;color:var(--app-muted)!important;border-color:#e8e8ed!important;}
  .live-calc-row{border-bottom:1px solid #f0f0f2!important;padding:6px 14px!important;}
  /* Calculation sheets */
  .calc-sheet{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .calc-sheet-header{background:var(--app-surface)!important;color:var(--app-text)!important;border-bottom:1px solid var(--app-border)!important;padding:16px 20px!important;}
  .calc-sheet-header *{color:var(--app-text)!important;}.calc-sheet-header > div > div:first-child > div:first-child,.calc-sheet-header > div > div:last-child{color:var(--app-muted)!important;}
  .calc-sheet-header [style*="fontSize:13"]{font-family:var(--app-display)!important;font-size:16px!important;font-weight:750!important;letter-spacing:-.02em!important;}
  .calc-basis{background:var(--app-blue-soft)!important;border-bottom:1px solid #c8dafa!important;color:#265c9f!important;font-family:var(--app-sans)!important;padding:7px 20px!important;letter-spacing:0!important;}
  .calc-section{background:#1e3a5f!important;color:#fff!important;padding:6px 20px!important;font-size:10px!important;letter-spacing:.07em!important;}
  .calc-step-row{border-bottom:1px solid #ececf0!important;padding:7px 20px!important;min-height:36px!important;}.calc-step-row span{font-family:var(--app-sans)!important;}.calc-step-row [style*="fontSize:14"]{font-family:var(--app-display)!important;}
  .calc-result-banner{background:#1d1d1f!important;padding:14px 20px!important;}.calc-result-banner *{font-family:var(--app-sans)!important;}.calc-result-banner [style*="fontSize:15"]{font-family:var(--app-display)!important;}
  .duty-point-wrap{background:var(--app-surface-subtle)!important;padding:12px 20px!important;}.duty-point-table{font-family:var(--app-sans)!important;}.duty-point-table th{color:var(--app-muted)!important;font-size:9px!important;letter-spacing:.05em!important;text-transform:uppercase!important;}.duty-point-table td{font-variant-numeric:tabular-nums;}
  /* Reference data and project cards */
  .project-card,.reference-panel{background:var(--app-surface)!important;border:1px solid var(--app-border)!important;border-radius:var(--app-radius-large)!important;box-shadow:var(--app-shadow)!important;}
  .project-card:hover{border-color:#b8b8c0!important;box-shadow:0 6px 18px rgba(0,0,0,.07)!important;}
  /* Consistent labels and numerical alignment across all pages */
  #root label{font-size:10px!important;font-weight:700!important;letter-spacing:.04em!important;color:var(--app-text-2)!important;}
  #root [style*="fontFamily"]{font-family:var(--app-sans)!important;font-variant-numeric:tabular-nums;}
  @media screen and (max-width:700px){.app-header{padding:12px 14px!important;}.app-content{padding:14px 12px 24px!important;}.calc-sheet-header{padding:14px!important;}.calc-basis,.calc-section,.calc-step-row,.duty-point-wrap,.calc-result-banner{padding-left:14px!important;padding-right:14px!important;}}
  @media print{#root,#root *{font-family:Arial,sans-serif!important;letter-spacing:0!important;}.calc-sheet{box-shadow:none!important;border-radius:0!important;}.calc-sheet-header{border-bottom:2px solid #1e3a5f!important;}.calc-result-banner{background:#fff!important;border-top:2px solid #1e3a5f!important;}.calc-result-banner *{color:#1d1d1f!important;}.calc-section{background:#1e3a5f!important;color:#fff!important;}}


  /* ── Calculation Sheets: Resource Planning project-card treatment ─────── */
  .calc-project-card{background:#fff;border:1px solid #d2d2d7;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.04);overflow:hidden;margin:0 0 16px;transition:border-color .15s,box-shadow .15s;}
  .calc-project-card:hover{border-color:#b9b9c0;box-shadow:0 6px 20px rgba(0,0,0,.08);}.calc-project-card.collapsed{box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .calc-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 20px;cursor:pointer;user-select:none;background:#fff;}.calc-card-head:hover{background:#fafafb;}
  .calc-card-brand{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#86868b;margin-bottom:5px;}.calc-card-title{font-family:var(--app-display)!important;font-size:16px;font-weight:750;letter-spacing:-.025em;color:#1d1d1f;line-height:1.25;}.calc-card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:10px;color:#6e6e73;margin-top:6px;}.calc-card-meta b{color:#424245;font-weight:700;}.calc-card-expand{font-size:10px;color:#007aff;font-weight:700;white-space:nowrap;align-self:center;}

  /* ── Phone layout ──────────────────────────────────────────────────────
     The project row and the reference-data grids were both laid out for a
     desktop width only. On a phone the four project buttons stayed on one
     flex line and Delete was pushed off-screen, and the reference grids
     compressed every column until the inputs were unreadable. Both are laid
     out with inline styles in JS, so these rules use !important to override
     them rather than threading a breakpoint through the components. */
  @media screen and (max-width:700px){
    /* Project row: title above, then a 2x2 button grid that always fits. */
    .project-card{flex-direction:column!important;align-items:stretch!important;gap:12px!important;padding:14px!important;}
    .project-card>div:first-child{width:100%;}
    .project-card>div:last-child{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex-shrink:1!important;}
    .project-card>div:last-child>button{width:100%;padding:10px 8px!important;font-size:12px!important;}
    /* Open is the primary action — give it the full first row. */
    .project-card>div:last-child>button:first-child{grid-column:span 2;}
    /* Reference-data grids scroll sideways instead of crushing the columns. */
    .refgrid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .refgrid-scroll>div{min-width:560px;}
    /* Header actions wrap rather than overflowing the notch area. */
    .app-header>div{flex-wrap:wrap!important;gap:10px!important;}
    /* Two- and three-column field grids are unreadable at phone width. They
       are laid out with inline styles in JS, hence !important here. */
    .fg2,.fg3,.fg5{grid-template-columns:1fr!important;}
    .pump-input-workspace{padding:14px!important;}
  }
  /* The pump editor is three side-by-side panes on desktop: list, form, live
     calculation. Below 900px they must stack, otherwise the form is crushed
     into a few characters' width and the live panel is unreadable. */
  @media screen and (max-width:900px){
    .pumpwork{flex-direction:column!important;gap:12px!important;}
    .pumpwork>.pumplist,.pumpwork>.pumpcalc{width:100%!important;flex:1 1 auto!important;}
    /* Sticky positioning only makes sense beside the form, not above it. */
    .pumpcalc .live-calc{position:static!important;max-height:none!important;}
    .pumpcalc .live-calc>div:last-child{max-height:420px!important;}
    /* The pump picker becomes a horizontal strip so the form stays in view. */
    .pumplist-items{display:flex!important;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .pumplist-items>div{flex:0 0 auto;min-width:150px;margin-bottom:0!important;}
    .pumplist-add{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;}
    .pumplist-add>button{margin-bottom:0!important;}
  }
  @media print{

    .screen-hide{display:block!important}
    .calcsplit{display:block!important}
    .calcsplit-pane{display:block!important}
    .calcpick{display:none!important}
    .calcwrap{display:block!important}
    /* Print at true A4 — undo every preview-scaling rule. */
    .ppreview{height:auto!important;overflow:visible!important;position:static!important}
    .ppreview-page{position:static!important;transform:none!important;width:auto!important}}

// Resolve any stored pipeType to a key that exists in the CURRENT reference
// release. Returns null when nothing matches, so callers can block the
// calculation instead of silently sizing on the wrong schedule.
function resolveMatKey(key) {
  if (key && PIPE_MATERIALS[key]) return key;
  const alias = LEGACY_MATERIAL_KEYS[key];
  if (alias && PIPE_MATERIALS[alias]) return alias;
  // A brand-new pump with no pipe chosen yet gets the default schedule; a
  // stored key that no longer exists is NEVER silently re-sized on another.
  if (!key && PIPE_MATERIALS[FALLBACK_MATERIAL_KEY]) return FALLBACK_MATERIAL_KEY;
  return null;
}
function matOf(key) { const k = resolveMatKey(key); return k ? PIPE_MATERIALS[k] : null; }

let PIPE_MATERIALS = DEFAULT_PIPE_MATERIALS;

// code -> {label, unit, ref, table:[[units, L/s], ...]}  (filled by loadReferenceData)
let FU_CODES = {};
let FU_LOAD_ERROR = "";

// Fetches reference tables from Supabase and replaces the in-memory bindings.
// Pipe/material and motor tables retain the embedded defaults when the response
// is empty; fixture-unit tables have no embedded fallback and therefore block
// fixture-unit calculations when unavailable. RootApp surfaces a failed request
// before allowing the user to continue.
async function loadReferenceData() {
  try {
    const [mats, sizes, motors, fuCodes, fuRows] = await Promise.all([
      sb.from("ref_pipe_materials").select("*").order("sort_order"),
      sb.from("ref_pipe_sizes").select("*").order("sort_order"),
      sb.from("ref_motor_kw").select("*").order("sort_order"),
      sb.from("ref_fixture_unit_codes").select("*").eq("active",true).order("sort_order"),
      sb.from("ref_fixture_unit_tables").select("code,units,flow_ls").order("code").order("units").range(0,9999),
    ]);
    if (mats.data && mats.data.length) {
      const built = {};
      for (const m of mats.data) {
        built[m.material_key] = { material:m.material || "", sdrClass:m.sdr_class || "",
          label:m.label, hwC:m.hw_c, roughness:m.roughness, note:m.note, table:[] };
      }
      for (const s of (sizes.data||[])) {
        if (!built[s.material_key]) continue;
        built[s.material_key].table.push({ od:s.od, id:s.id_mm,
          nb:(s.nominal_mm ?? s.nb) ?? undefined, wall:s.wall_mm ?? undefined });
      }
      // Pipe sizing walks the table and takes the first ID at or above the duty,
      // so an unsorted table would hand back an undersized pipe. Row order in
      // the database is not guaranteed; sort here rather than trusting it.
      for (const k of Object.keys(built)) built[k].table.sort((a,b)=>a.id-b.id);
      // A material with no sizes cannot size anything and must not appear in
      // the dropdown as a selectable-but-empty option.
      for (const k of Object.keys(built)) if (!built[k].table.length) delete built[k];
      if (Object.keys(built).length) PIPE_MATERIALS = built;
    }
    if (motors.data && motors.data.length) MOTOR_KW = motors.data.map(r=>r.kw).sort((a,b)=>a-b);
    if (fuCodes.error || fuRows.error) {
      FU_LOAD_ERROR = "Fixture-unit tables could not be loaded from Supabase ("+((fuCodes.error||fuRows.error).message)+"). Run mep-fixture-units.sql.";
    } else {
      const built = {};
      for (const c of (fuCodes.data||[])) built[c.code] = {label:c.label, unit:c.unit||"WSFU", ref:c.reference||c.label, table:[]};
      for (const r of (fuRows.data||[])) if (built[r.code]) built[r.code].table.push([Number(r.units), Number(r.flow_ls)]);
      for (const k of Object.keys(built)) { built[k].table.sort((a,b)=>a[0]-b[0]); if (built[k].table.length<2) delete built[k]; }
      FU_CODES = built;
      FU_LOAD_ERROR = Object.keys(built).length ? "" : "No fixture-unit tables found in Supabase. Run mep-fixture-units.sql.";
    }
    return true;
  } catch (e) {
    console.error("loadReferenceData failed, using built-in defaults", e);
    return false;
  }
}

// Bounded interpolation. A value outside an approved reference curve is an
// invalid design input; it must never silently use the final table value.
function interpolateApproved(value, table, label) {
  const x = Number(value);
  const min = table[0][0], max = table[table.length - 1][0];
  if (!Number.isFinite(x) || x < min || x > max) {
    throw new Error(`${label} must be within the approved reference range (${min}–${max}).`);
  }
  for (let i = 0; i < table.length - 1; i++) {
    const [x0,y0] = table[i], [x1,y1] = table[i+1];
    if (x >= x0 && x <= x1) return y0 + (x-x0)/(x1-x0)*(y1-y0);
  }
  return table[table.length - 1][1]; // exact upper endpoint only
}
// Fixture-unit codes come only from Supabase (see loadReferenceData).
// Older pumps stored LU as flowMode "iop" + loadingUnits; read them unchanged.
function isFuMode(p){ return p.flowMode==='wsfu' || p.flowMode==='iop'; }
function fuOf(p){
  if (p.flowMode==='iop') return {code:'iop_lu', units:Number(p.loadingUnits)};
  return {code: p.fuCode || 'upc_ad', units:Number(p.wsfu)};
}
// Never guess a curve: a missing code blocks the calculation with a clear message.
function fuCodeOf(code){
  const c = FU_CODES[code];
  if (c) return c;
  throw new Error(FU_LOAD_ERROR || (code==='iop_lu'
    ? 'This booster uses IOP/CIPHE loading units, but code "iop_lu" is not in Reference Data. Run mep-fixture-units.sql in Supabase.'
    : `Fixture-unit code "${code}" is not in Reference Data (ref_fixture_unit_codes). Select another code or add it in Supabase.`));
}
// Values above the final fixture-unit row are extended linearly along the last
// segment and flagged as extrapolated in the calculation trace. Values below
// the first row are rejected. This is a review condition, not an approved
// reference-table value, and should be resolved before formal issue.
function fuExtrapInfo(p){
  const f=fuOf(p), c=FU_CODES[f.code]; if(!c) return null;
  const t=c.table, max=t[t.length-1][0];
  return Number.isFinite(f.units) && f.units>max ? {max, maxFlow:t[t.length-1][1], code:c} : null;
}
function lookupFU(p){
  const f=fuOf(p), c=fuCodeOf(f.code), t=c.table, n=t.length;
  if (Number.isFinite(f.units) && f.units > t[n-1][0]) {
    const [x0,y0]=t[n-2], [x1,y1]=t[n-1];
    return y1 + (f.units-x1)*(y1-y0)/(x1-x0);
  }
  return interpolateApproved(f.units, t, `${c.unit} (${c.label})`);
}

const ceil01 = x => Math.ceil(x * 10) / 10;
// Numeric field reader that respects a deliberate 0. Plain `Number(v)||dflt`
// silently replaces a user-entered 0 with the default, which is wrong for
// fields like Safety Factor and Fittings Allowance where 0 is a valid choice.
const num = (v, dflt) => {
  if (v === undefined || v === null || v === "") return dflt;
  const n = Number(v);
  return Number.isFinite(n) ? n : dflt;
};
// Do not silently select the largest schedule size/motor when the duty exceeds
// the approved reference release. Callers must block and explain the exception.

// Hazen-Williams friction loss (m)
function hwLoss(Q_m3s, D_m, L, C) {
  return 10.7*Math.pow(Q_m3s/C,1.852)*L/Math.pow(D_m,4.87);
}
// Darcy-Weisbach friction loss (m) with Swamee-Jain friction factor
function dwLoss(Q_m3s, D_m, L, roughness_mm) {
  const A = Math.PI/4*D_m*D_m;
  const v = Q_m3s/A;
  const nu = 1.004e-6; // kinematic viscosity of water @ 20°C, m²/s
  const Re = (v*D_m)/nu;
  const eps = roughness_mm/1000;
  let f;
  if (Re < 1) { f=0; }
  else if (Re < 2300) { f = 64/Re; }
  else {
    f = 0.25 / Math.pow(Math.log10(eps/(3.7*D_m) + 5.74/Math.pow(Re,0.9)), 2);
  }
  const hf = f*(L/D_m)*(v*v/(2*9.81));
  return { hf, f, Re, v };
}

const FLOW_UNITS = {"L/s":1, "L/min":1/60, "L/h":1/3600, "m³/h":1000/3600, "m³/s":1000};
function evalExpr(src, vars) {

function computeFlow(p) {
  let steps=[], totalFlowLs=0;
  if (p.type==="rcp") {
    const vol=Number(p.tankCapacity)||0, recPct=Number(p.recirculationPct)||20, recTime=Number(p.operatingTime)||8;
    const volR=vol*recPct/100, flowLhr=volR*1000/recTime;

      {label:`Volume to Recirculate (${recPct}%)`,             value:`${volR.toFixed(1)} m³`},
      {label:"Recirculation Time",                             value:`${recTime} hr`},
      {label:`Total System Flow  [Vol × ${recPct}% ÷ t ÷ 3600]`, value:`${flowLhr.toFixed(1)} L/hr = ${totalFlowLs.toFixed(2)} L/s`},
    );
  } else if (p.type==="ffp"||p.type==="tp") {
    const vol=Number(p.tankCapacity)||0, opT=Number(p.operatingTime)||1;
    const flowLhr=vol*1000/opT;
    totalFlowLs=flowLhr/3600;
    steps.push(
      {s:"Flow Rate", label:"Tank Capacity",                           value:`${vol.toFixed(1)} m³`},
      {label:p.type==="ffp"?"Filtration Time":"Transfer Time",         value:`${opT} hr`},
      {label:"Total System Flow  [Vol ÷ t ÷ 3600]",                   value:`${flowLhr.toFixed(1)} L/hr = ${totalFlowLs.toFixed(2)} L/s`},
    );
  } else if (p.type==="hex") {
    const kW=Number(p.coolingCapacity)||0, Tin=Number(p.inletTemp)||34, Tout=Number(p.outletTemp)||20, dT=Tin-Tout;
    totalFlowLs=kW/(4.18*dT);
    steps.push(
      {s:"Flow Rate", label:"Cooling Capacity",                 value:`${kW} kW`},
      {label:"ΔT  (Inlet − Outlet)",                            value:`${Tin}°C − ${Tout}°C = ${dT}°C`},
      {label:"Total System Flow  [Q = kW ÷ (4.18 × ΔT)]",      value:`${totalFlowLs.toFixed(2)} L/s`},
    );
  } else if (p.type==="booster") {
    if (isFuMode(p)) {
      const f=fuOf(p), c=fuCodeOf(f.code); totalFlowLs=lookupFU(p);
      const ex=fuExtrapInfo(p);
      steps.push({s:"Flow Rate", label:`Fixture Units → Flow (${c.label})${ex?` — EXTRAPOLATED above table max ${ex.max} ${c.unit}`:''}`, value:`${f.units} ${c.unit} = ${totalFlowLs.toFixed(2)} L/s`, ...(ex?{flag:"warn"}:{})});
    } else {
      totalFlowLs=Number(p.directFlow)||0;
      steps.push({s:"Flow Rate", label:"Direct Flow Input", value:`${totalFlowLs.toFixed(2)} L/s`});
    }
  } else if (p.type==="sewage") {
    if (p.flowMode==="population") {
      const pop=Number(p.population)||0, lpcd=Number(p.lpcd)||150, peakF=Number(p.peakFactor)||3;
      totalFlowLs = (pop*lpcd*peakF)/86400;
      steps.push(
        {s:"Flow Rate", label:"Population Served",                    value:`${pop} persons`},
        {label:"Per-Capita Flow × Peak Factor",                       value:`${lpcd} L/p/day × ${peakF}`},
        {label:"Peak Sewage Flow  [Pop×lpcd×PF ÷ 86400]",           value:`${totalFlowLs.toFixed(2)} L/s`},
      );
    } else {
      totalFlowLs=Number(p.directFlow)||0;
      steps.push({s:"Flow Rate", label:"Direct Peak Flow Input", value:`${totalFlowLs.toFixed(2)} L/s`});
    }
  } else if (p.type==="custom") {
    (p.customInputs||[]).forEach((c,ix)=>steps.push({...(ix===0?{s:"Flow Rate"}:{}), label:`${c.label||c.key}  (${c.key})`, value:`${c.value} ${c.unit||""}`.trim()}));
    const f=customFlowLs(p); totalFlowLs=f.ls;

function headLossFor(Q_m3s, D_m, L, p, matKey) {
  const mat = matOf(matKey);

    return { hf:r.hf, method:"Darcy-Weisbach", detail:`f=${r.f.toFixed(4)}, Re=${r.Re.toFixed(0)}`, v:r.v };
  }
  const C = Number(p.hwCoeff)||mat.hwC;
  const hf = hwLoss(Q_m3s, D_m, L, C);
  return { hf, method:"Hazen-Williams", detail:`C=${C}`, v:Q_m3s/(Math.PI/4*D_m*D_m) };
}


function calcError(errors) { return {valid:false, error:true, errors}; }

function validatePumpInputs(p, set) {
  const errors = [];

  const requireNonNegative = (value, label) => { if (!isNonNegative(value)) errors.push(`${label} must be zero or greater.`); };

  if (!Number.isInteger(set.duty) || set.duty < 1) errors.push('Duty pumps must be a whole number of at least 1.');
  if (!Number.isInteger(set.standby) || set.standby < 0) errors.push('Standby pumps must be a whole number of 0 or more.');
  if (!['full','assist'].includes(set.sharing)) errors.push('Pump-set sizing basis must be Duty / Standby or Duty / Assist.');
  const crit = sizingCriterionOf(p);
  if (crit!=='pressure') requirePositive(p.maxVelocity, 'Maximum flow velocity');
  if (crit!=='velocity') requirePositive(p.maxLossPaM, 'Maximum friction loss');
  if (!isNonNegative(p.minVelocity)) errors.push('Minimum flow velocity must be zero or greater.');
  else if (crit!=='pressure' && Number(p.minVelocity) > Number(p.maxVelocity)) errors.push('Minimum flow velocity cannot exceed maximum flow velocity.');
  requireNonNegative(p.pipeRun, 'Pipe run');
  requireNonNegative(p.fittingsPct, 'Fittings allowance');
  requireNonNegative(p.staticHead, 'Static head');
  requireNonNegative(p.residualPressure, 'Residual pressure');
  requirePositive(p.pumpEff, 'Pump efficiency');
  requireNonNegative(p.motorMarginPct ?? 15, 'Motor margin');
  requirePositive(p.motorEff, 'Motor efficiency');
  if (Number(p.pumpEff) > 1) errors.push('Pump efficiency must be 1.00 or less.');
  if (Number(p.motorEff) > 1) errors.push('Motor efficiency must be 1.00 or less.');

  if (p.type === 'rcp') { requirePositive(p.tankCapacity, 'Tank capacity'); requirePositive(p.recirculationPct, 'Recirculation percentage'); requirePositive(p.operatingTime, 'Recirculation time'); }
  if (p.type === 'ffp' || p.type === 'tp') { requirePositive(p.tankCapacity, 'Tank capacity'); requirePositive(p.operatingTime, p.type === 'ffp' ? 'Filtration time' : 'Transfer time'); }
  if (p.type === 'hex') { requirePositive(p.coolingCapacity, 'Cooling capacity'); const dt = Number(p.inletTemp) - Number(p.outletTemp); if (!Number.isFinite(dt) || dt <= 0) errors.push('HEX inlet temperature must be greater than outlet temperature.'); }

    if (isFuMode(p)) { const f=fuOf(p), c=FU_CODES[f.code];

  }
  if (p.type === 'sewage') { if (p.flowMode === 'population') { requirePositive(p.population, 'Population served'); requirePositive(p.lpcd, 'Per-capita flow'); requirePositive(p.peakFactor, 'Peak factor'); } else requirePositive(p.directFlow, 'Direct peak flow'); requireNonNegative(p.safetyPct, 'Flow safety factor'); }
  if (p.type === 'custom') {
    const seen=new Set();
    (p.customInputs||[]).forEach((c,ix)=>{ const k=String(c.key||'').trim();

    if(!String(p.flowFormula||'').trim()) errors.push('Custom flow formula is required.');

  catch (e) { return calcError([e.message || 'The selected demand reference could not be evaluated.']); }
  if (!Number.isFinite(totalFlowLs) || totalFlowLs <= 0) return calcError(['Calculated system flow must be greater than zero.']);

    {label:"Duty Pumps Running at Design Flow",                            value:`${set.duty} No.`},
    {label:"Standby Pumps",                                                 value:`${set.standby} No.`},
    {label:"Duty Sharing",                                                  value: set.sharing==="full"

  const pwrInput=pwrShaft/motE;                      // electrical input at duty point
  const pwrSel=selectMotor(pwrReq);
  if (!pwrSel) return calcError([`Required motor rating ${pwrReq.toFixed(3)} kW exceeds the approved standard motor schedule. Add an approved motor rating or revise the design.`]);
  steps.push(
    {s:"Motor Power", label:`Shaft Power  [Ps = Q × 9.81 × H / ηp, ηp = ${(pumpE*100).toFixed(0)}%]`, value:`${pwrShaft.toFixed(3)} kW`},
    {label:`Required Motor Rating  [Ps × (1 + ${motorMarginPct}%)]`,          value:`${pwrReq.toFixed(3)} kW`},
    {label:"Selected Standard Motor",                                            value:`${pwrSel} kW`, hl:true},
    {label:`Electrical Input  [Ps / ηm, ηm = ${(motE*100).toFixed(0)}%]`,       value:`${pwrInput.toFixed(3)} kW`},
  );

  // Multiple duty points — system curve check at part / over load
  const dutyFractions = [0.5, 0.75, 1.0, 1.1];
  const dutyPoints = dutyFractions.map(fr=>{
    const Qd = (designFlow*fr)/1000;
    const vD = Qd/(Math.PI/4*Math.pow(pipe.id/1000,2));
    const hlD = headLossFor(Qd, D_m, L, p, matKey);
    const hfD = hlD.hf*(1+fitPc/100);
    const Htotal = Hs+Hr+hfD+extra;
    return { pct:Math.round(fr*100), flow:Qd*1000, v:vD, head:Htotal, velOk: (!useV||v2(vD)<=maxV) && (minV<=0||vD>=minV) };
  });

  return {valid:true, flowLsPerPump, flowTotal, designFlow, reqDi, pipe, vel, velPeak, velDesign, sizingBasis, safetyPct,
    crit, maxLoss, gradDesign, gradOk, governs,
    hf, hf_fit, totalH, pwrShaft, pwrReq, pwrInput, motorMarginPct, pwrSel, dutyPoints, matKey,
    set, config: configStr(set.duty, set.standby),
    connectedKw: pwrSel * set.duty,        // running load — standby not counted
    installedKw: pwrSel * set.installed,   // total installed motor capacity
    // Honest check: the highest flow the pipe ever sees is the design flow.
    velOk: vMaxOk && gradOk && (minV<=0||velPeak>=minV),
    selStr:`Select Pumpset (${configStr(set.duty,set.standby)}): ${flowLsPerPump.toFixed(2)} L/s Each @ ${totalH} m Head, ${pwrSel} kW Each — ${set.installed} No. installed`, steps };
}

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────────
function AuthScreen({onAuthed}) {
  const [mode, setMode]     = useState("login"); // "login" | "signup"
  const [email, setEmail]   = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr]       = useState("");
  const [busy, setBusy]     = useState(false);
  const [info, setInfo]     = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        const normalizedEmail = email.trim().toLowerCase();
        if (data && data.session) {
          const { data: roster } = await sb.from('engineers').select('id,active').eq('email', normalizedEmail).maybeSingle();
          if (!roster || roster.active === false) {
            const { error: requestError } = await sb.from('pending_users').upsert(
              {email:normalizedEmail, status:'pending', requested_at:new Date().toISOString()},
              {onConflict:'email', ignoreDuplicates:true}
            );
            if (requestError) throw requestError;
          }
          setInfo("Account created and your access request is pending administrator approval.");
        } else {
          setInfo("Account created. Check your inbox to confirm your email, then sign in to submit or view your access request.");
        }
      }
    } catch (e2) {
      setErr(e2.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#f5f5f7",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",width:480,height:480,borderRadius:"50%",background:"radial-gradient(circle,rgba(0,122,255,.08) 0%,transparent 70%)",top:-140,right:-60,pointerEvents:"none"}} />
      <div style={{position:"absolute",width:360,height:360,borderRadius:"50%",background:"radial-gradient(circle,rgba(52,199,89,.07) 0%,transparent 70%)",bottom:-80,left:-80,pointerEvents:"none"}} />
      <div style={{position:"relative",zIndex:1,width:"min(400px,94vw)",background:"#fff",borderRadius:20,padding:"40px 36px 32px",textAlign:"center",boxShadow:"0 2px 4px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)"}}>
        <img src={MEINHARDT_LOGO_SRC} alt="Meinhardt" style={{display:"block",width:176,height:"auto",margin:"0 auto 16px"}} />
        <div style={{width:52,height:52,borderRadius:14,margin:"0 auto 20px",background:"linear-gradient(160deg,#007aff 0%,#0055d4 100%)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,122,255,.3)",color:"white",fontSize:23}}>▥</div>
        <div style={{fontSize:21,fontWeight:700,color:"#1d1d1f",marginBottom:5,letterSpacing:"-.03em"}}>MEP Calculator</div>
        <div style={{fontSize:13,color:"#6e6e73",marginBottom:28}}>Sign in to continue</div>
        <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:10,textAlign:"left"}}>
          <input type="email" autoComplete="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1px solid #d2d2d7",borderRadius:10,fontSize:12,color:"#1d1d1f",background:"#fff",outline:"none"}} />
          <input type="password" autoComplete={mode==="login"?"current-password":"new-password"} placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1px solid #d2d2d7",borderRadius:10,fontSize:12,color:"#1d1d1f",background:"#fff",outline:"none"}} />
          {err  && <div style={{fontSize:11,color:"#ff3b30",background:"#fff0ee",padding:"8px 10px",borderRadius:8}}>{err}</div>}
          {info && <div style={{fontSize:11,color:"#16803a",background:"#e8faf0",padding:"8px 10px",borderRadius:8}}>{info}</div>}
          <button type="submit" disabled={busy} style={{marginTop:2,padding:"10px 0",background:"#007aff",color:"white",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:busy?"default":"pointer",opacity:busy?0.6:1}}>
            {busy ? "Please wait…" : mode==="login" ? "Sign In" : "Request Access"}
          </button>
        </form>
        <div style={{marginTop:14,textAlign:"center",fontSize:11,color:"#86868b"}}>
          {mode==="login" ? (
            <>Don’t have an account? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");setErr("");setInfo("");}} style={{color:"#007aff",fontWeight:600,textDecoration:"underline"}}>Request Access</a></>
          ) : (
            <>Already have an account? <a href="#" onClick={e=>{e.preventDefault();setMode("login");setErr("");setInfo("");}} style={{color:"#007aff",fontWeight:600,textDecoration:"underline"}}>Sign In</a></>
          )}
        </div>
        <div style={{marginTop:26,fontSize:9,color:"#86868b",lineHeight:1.6}}>MEP Calculator · Secure cloud projects<br/><span style={{fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace",letterSpacing:".02em"}}>{BUILD_LABEL}</span></div>
      </div>
    </div>
  );
}

// EXCEL EXPORT — writes a validated issue-style workbook of calculated values.
// The workbook is rendered from the shared issue-document model; it is not a
// formula-driven Excel model and changing a value in the workbook does not
// recalculate the browser calculation. Input/result colour tokens are retained
// for consistent issue-sheet styling.
// ══════════════════════════════════════════════════════════════════════════
const XL_BORDER = {top:{style:"thin",color:{argb:"FFD2D2D7"}},left:{style:"thin",color:{argb:"FFD2D2D7"}},bottom:{style:"thin",color:{argb:"FFD2D2D7"}},right:{style:"thin",color:{argb:"FFD2D2D7"}}};
const XL = {
  navy:   "FF1E3A5F",
  slate:  "FF334155",
  input:  "FFFFF4DC",  // amber — editable
  result: "FFDBEAFE",  // blue  — key output
  band:   "FFF1F5F9",
  border: "FFCBD5E1",
};
function xlSheetName(name, used) {
  let n = String(name||"Sheet").replace(/[\\\/\?\*\[\]:]/g,"-").trim().slice(0,28) || "Sheet";
  let base = n, i = 2;
  while (used.has(n)) { n = base.slice(0,25) + "_" + i; i++; }
  used.add(n);
  return n;
}
function xlThin(cell) {
  cell.border = { top:{style:"thin",color:{argb:XL.border}}, left:{style:"thin",color:{argb:XL.border}},
                  bottom:{style:"thin",color:{argb:XL.border}}, right:{style:"thin",color:{argb:XL.border}} };
}
async function addLogoToWorkbook(wb, ws, logoUrl, position) {
  if (!logoUrl) return false;
  try {
    const response=await fetch(logoUrl);
    if (!response.ok) throw new Error(`Logo download returned ${response.status}`);
    const blob=await response.blob();
    const mime=(blob.type||'').toLowerCase();
    const extension=mime.includes('svg')?'svg':mime.includes('jpeg')||mime.includes('jpg')?'jpeg':'png';
    const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});
    const imageId=wb.addImage({base64,extension});
    ws.addImage(imageId,position);
    return true;
  } catch (e) {
    console.warn('A required issue-sheet logo could not be embedded in Excel.',e);
    return false;
  }
}

// ══════════════════════════════════════════════════════════════════════════
// EXCEL RENDERER for the shared issue document (see buildIssueDoc below).
// Layout mirrors IssueSheet(): logos and project/title bands, the four header
// cells, every section in doc.sections in the same order, and the final
// selection/closure line. Calculation values and validation status come from
// buildIssueDoc(), so the screen preview, print/PDF, and workbook use the same
// document model even though the Excel cells are static calculated values.
// ══════════════════════════════════════════════════════════════════════════
const XI = { band:"FF0876BA", title:"FFF1F1F3", head:"FFE8E8ED", result:"FFE8F0FE", resultTxt:"FF1559A6", dark:"FF1D1D1F", mono:"FF1559A6", grid:"FFB9B9C0", ok:"FF16803A" };
function xiBorder(cell, argb=XI.grid){ const s={style:"thin",color:{argb}}; cell.border={top:s,left:s,bottom:s,right:s}; }
function xiLines(text, widthChars){ return String(text??"").split("\n").reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/Math.max(8,widthChars))),0); }
async function writeCalcBlock(wb, ws, doc, proj) {
  // Six physical columns. Each logical 4-column table is mapped onto them with
  // its own spans, so a 1-digit STEP column is not as wide as PARAMETER, and
  // UNIT is not as wide as FORMULA. Content still comes only from buildIssueDoc().
  const W=[6,26,14,10,40,30];
  const NC=W.length;
  const SPANS={
    trace :[[1,1],[2,4],[5,5],[6,6]],   // Step | Purpose | Formula | Result
    params:[[1,2],[3,3],[4,4],[5,6]],   // Parameter | Value | Unit | Basis
    header:[[1,2],[3,4],[5,5],[6,6]],   // Revision | Stage | Prepared | Checked
  };
  const spanW=([a,b])=>W.slice(a-1,b).reduce((x,y)=>x+y,0);
  ws.columns=W.map(w=>({width:w}));
  ws.pageSetup={paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,
    margins:{left:0.35,right:0.35,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  ws.views=[{showGridLines:false}];
  const font=(o={})=>({name:"Arial",size:9,...o});
  let r=1;
  const merged=(row,text,opts={})=>{
    const c1=opts.c1||1, c2=opts.c2||NC;
    if (c2>c1) ws.mergeCells(row,c1,row,c2);
    const c=ws.getCell(row,c1);
    c.value=text; c.font=font(opts.font||{}); c.alignment={vertical:"middle",wrapText:true,...(opts.align||{})};
    if(opts.fill) c.fill={type:"pattern",pattern:"solid",fgColor:{argb:opts.fill}};
    for(let k=c1;k<=c2;k++) xiBorder(ws.getCell(row,k), opts.border||XI.dark);
    return c;
  };
  // Write one logical cell across its span; returns the line count it needs.
  const putCell=(row,span,value,style)=>{
    const [c1,c2]=span;
    if (c2>c1) ws.mergeCells(row,c1,row,c2);
    const cell=ws.getCell(row,c1);
    cell.value=(typeof value==="number")?value:String(value??"");
    Object.assign(cell,style);
    for(let k=c1;k<=c2;k++) xiBorder(ws.getCell(row,k), style._border||"FFD2D2D7");
    const perChar = style.font && style.font.name==="Consolas" ? 1.1 : 1.4;   // chars per width unit, measured on A4 output
    return xiLines(value, spanW(span)*perChar);
  };
  if (doc.blocked) {
    merged(r++,"CALCULATION BLOCKED — "+doc.title,{fill:XI.title,font:{bold:true}});
    merged(r,doc.errors.join(" "),{font:{color:{argb:"FFB91C1C"}}}); ws.getRow(r).height=15*xiLines(doc.errors.join(" "),120); return;
  }
  // ── Header: logos (A:B, rows 1-3) + blue bands (C:F) ──
  ws.mergeCells(1,1,3,2); xiBorder(ws.getCell(1,1),XI.dark);
  [1,2,3].forEach(i=>ws.getRow(i).height=26);
  merged(1,{richText:[{text:"PROJECT   ",font:font({bold:true,color:{argb:"FFFFFFFF"}})},{text:String(doc.project),font:font({bold:true,size:10,color:{argb:"FFFFFFFF"}})}]},{c1:3,fill:XI.band});
  merged(2,{richText:[{text:"TITLE   ",font:font({bold:true,color:{argb:"FFFFFFFF"}})},{text:String(doc.title),font:font({bold:true,size:10,color:{argb:"FFFFFFFF"}})}]},{c1:3,fill:XI.band});
  merged(3,`Client: ${doc.meta.client}   ·   Stage: ${doc.meta.stage}`,{c1:3,font:{size:9,color:{argb:"FF424245"}}});
  await addLogoToWorkbook(wb,ws,MEINHARDT_LOGO_SRC,{tl:{col:0.15,row:0.15},ext:{width:170,height:40}});
  if (proj.clientLogoUrl) await addLogoToWorkbook(wb,ws,proj.clientLogoUrl,{tl:{col:0.15,row:1.75},ext:{width:150,height:34}});
  else {
    // Meinhardt logo occupies the top of A1:B3; the note sits at the bottom, indented under it.
    const c=ws.getCell(1,1); c.value="Client logo not uploaded";
    c.font=font({size:8,italic:true,color:{argb:"FF86868B"}}); c.alignment={vertical:"bottom",horizontal:"left",indent:1};
  }
  r=4;
  // ── Header cells: same four, same order as the PDF ──
  let hl=1;
  doc.headerCells.forEach((h,i)=>{
    const sp=SPANS.header[i];
    putCell(r,sp,String(h.label).toUpperCase(),{font:font({size:7.5,bold:true,color:{argb:"FF424245"}}),alignment:{vertical:"middle"},_border:XI.dark});
    hl=Math.max(hl,putCell(r+1,sp,String(h.value),{font:font({bold:true}),alignment:{wrapText:true,vertical:"top"},_border:XI.dark}));
  });
  ws.getRow(r+1).height=Math.max(16,13*hl);
  r+=2;
  // ── Sections, in model order ──
  for (const sec of doc.sections) {
    if (sec.kind==="list") {
      merged(r,String(sec.title).toUpperCase(),{fill:XI.title,font:{bold:true,size:9}}); ws.getRow(r).height=17; r++;
      sec.items.forEach((b,i)=>{ const t=`${i+1}.  ${b}`; merged(r,t,{border:"FFD2D2D7"}); ws.getRow(r).height=Math.max(15,13*xiLines(t,140)); r++; });
    } else if (sec.kind==="table") {
      const spans = String(sec.head[0]).toLowerCase()==="step" ? SPANS.trace : SPANS.params;
      merged(r,String(sec.title).toUpperCase(),{fill:XI.title,font:{bold:true,size:9}}); ws.getRow(r).height=17; r++;
      sec.head.forEach((h,c)=>putCell(r,spans[c],String(h).toUpperCase(),{
        font:font({bold:true,size:8}), fill:{type:"pattern",pattern:"solid",fgColor:{argb:XI.head}},
        alignment:{vertical:"middle",horizontal:(sec.align&&sec.align[c]==="right")?"right":"left",wrapText:true,indent:(sec.align&&sec.align[c]==="right")?1:0}, _border:XI.grid}));
      ws.getRow(r).height=16; r++;
      for (const row of sec.rows) {
        let lines=1;
        row.forEach((v,c)=>{
          const mono=(sec.mono||[]).includes(c), strong=(sec.strong||[]).includes(c), right=sec.align&&sec.align[c]==="right";
          lines=Math.max(lines,putCell(r,spans[c],v,{
            font: mono?{name:"Consolas",size:9,color:{argb:XI.mono}}:font({bold:strong||right}),
            alignment:{vertical:"top",horizontal:right?"right":"left",wrapText:true,indent:right?1:0}}));
        });
        ws.getRow(r).height=Math.max(15,12.5*lines+3); r++;
      }
    } else if (sec.kind==="result") {
      merged(r,{richText:[{text:sec.label+":   ",font:font({bold:true,color:{argb:XI.resultTxt}})},{text:String(sec.value),font:font({bold:true,color:{argb:"FF265C9F"}})}]},{fill:XI.result});
      ws.getRow(r).height=Math.max(18,13*xiLines(sec.label+sec.value,135)); r++;
    }
  }
  if (doc.closure) {
    const c=doc.closure;
    merged(r,`ISSUED · Lead sign-off ${c.lead_signed_by||"—"}${c.lead_signed_at?" ("+fmtDay(c.lead_signed_at)+")":""} · Approver sign-off ${c.mep_lead_signed_by||"—"}${c.closed_at?" ("+fmtDay(c.closed_at)+")":""}`,{font:{bold:true,size:8,color:{argb:XI.ok}}});
    r++;
  }
  if (doc.watermark) {
    merged(r,doc.watermark,{fill:"FFFFE4E1",font:{bold:true,size:10,color:{argb:"FFC62828"}},align:{horizontal:"center"},border:"FFC62828"});
    ws.getRow(r).height=20; r++;
    ws.headerFooter={oddHeader:'&C&"Arial,Bold"&12&KC62828DRAFT — NOT FOR ISSUE', oddFooter:'&C&"Arial"&8&KC62828Draft — not signed off'};
  }
  ws.pageSetup.printArea=`A1:F${r-1}`;
}
async function buildPumpWorkbook(ExcelJSLib, proj, pumps, stageName, issueMeta={}) {
  const wb = new ExcelJSLib.Workbook();
  wb.creator = "Meinhardt Group — MEP Calculator";
  wb.created = new Date();
  const used = new Set();
  for (let i=0;i<pumps.length;i++) {
    const p=pumps[i];
    const doc=buildIssueDoc(proj,p,issueMeta,stageName);
    if (doc.blocked) throw new Error(`Cannot export ${p.name||`pump ${i+1}`}: ${doc.errors.join(" ")}`);
    const ws=wb.addWorksheet(xlSheetName(`${String(i+1).padStart(2,"0")} ${p.tag||p.name||"Calc"}`,used));
    await writeCalcBlock(wb,ws,doc,proj);
  }
  return wb;
}
async function exportWorkbook(proj, pumps, stageName, issueMeta={}, suffix="") {
  if (!pumps || !pumps.length) { alert("No pump calculations in this stage to export."); return; }
  if (!proj.clientLogoUrl) { alert("Upload the project client logo before issuing an Excel export."); return; }
  if (typeof ExcelJS === "undefined") { alert("Excel library did not load — check your internet connection and reload."); return; }
  try {
    const wb = await buildPumpWorkbook(ExcelJS, proj, pumps, stageName, issueMeta);
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const safe = (s)=>String(s||"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_");
    const draft = closureOf(issueMeta).status!=="closed";
    const fname = `${safe(proj.name)||"Pump_Calculations"}${stageName?"_"+safe(stageName):""}${suffix?"_"+safe(suffix):""}_Rev${safe(proj.revision)||"01"}${draft?"_DRAFT":""}.xlsx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) {
    console.error(e);
    alert("Excel export failed: " + (e.message||e));
  }
}

// LM Studio locally, or a hosted Qwen API). Settings live in this browser
// only (localStorage). The AI never changes a pump by itself: every

const AI_DEFAULTS = { baseUrl:"http://localhost:11434/v1", model:"qwen3", apiKey:"" };
function aiSettings(){ try { return {...AI_DEFAULTS, ...JSON.parse(localStorage.getItem("mep_ai")||"{}")}; } catch(e){ return {...AI_DEFAULTS}; } }
function saveAiSettings(v){ localStorage.setItem("mep_ai", JSON.stringify(v)); }
async function aiChat(messages, {json=false}={}){
  const c = aiSettings();
  const url = c.baseUrl.replace(/\/+$/,"") + "/chat/completions";
  const headers = {"Content-Type":"application/json"}; if (c.apiKey) headers.Authorization = "Bearer "+c.apiKey;
  const body = {model:c.model, messages, temperature:0.1, stream:false};
  if (json) body.response_format = {type:"json_object"};
  let res;
  try { res = await fetch(url,{method:"POST",headers,body:JSON.stringify(body)}); }
  catch(e){ throw new Error(`Cannot reach ${url}. Is the model server running? For Ollama, start it with OLLAMA_ORIGINS=* so the browser may call it.`); }
  if (!res.ok) { const t=await res.text().catch(()=>""); throw new Error(`AI server ${res.status}: ${t.slice(0,300)}`); }
  const d = await res.json();
  let txt = d?.choices?.[0]?.message?.content || "";
  return txt.replace(/<think>[\s\S]*?<\/think>/g,"").trim();   // Qwen reasoning blocks
}
function aiJson(txt){
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error("The AI did not return JSON.");
  return JSON.parse(m[0]);
}
// Only these fields may be written by the AI; values are type-checked.
const AI_FIELDS = {
  name:"text", tag:"text", directFlow:"num", safetyPct:"num", wsfu:"num", fuCode:"code", flowMode:"mode",
  tankCapacity:"num", operatingTime:"num", recirculationPct:"num", coolingCapacity:"num", inletTemp:"num", outletTemp:"num", equipmentDp:"num",
  population:"num", lpcd:"num", peakFactor:"num", irrigatedArea:"num", applicationRate:"num",
  numDuty:"int", numStandby:"int", sharingMode:"share",
  staticHead:"num", residualPressure:"num", pipeRun:"num", fittingsPct:"num", maxVelocity:"num", maxLossPaM:"num", sizingCriterion:"crit",
  pumpEff:"num", motorEff:"num",
};
function aiCleanPatch(raw, pump){
  const out = {};
  for (const [k,v] of Object.entries(raw||{})) {
    const t = AI_FIELDS[k]; if (!t || v===null || v===undefined || v==="") continue;
    if (t==="text") out[k]=String(v).slice(0,120);
    else if (t==="num") { const n=Number(v); if (Number.isFinite(n)) out[k]=n; }
    else if (t==="int") { const n=Math.round(Number(v)); if (Number.isFinite(n)&&n>=0) out[k]=n; }
    else if (t==="share" && ["full","assist"].includes(v)) out[k]=v;
    else if (t==="crit" && ["velocity","pressure","both"].includes(v)) out[k]=v;
    else if (t==="mode" && ["direct","wsfu"].includes(v)) out[k]=v;
    else if (t==="code" && FU_CODES[v]) out[k]=v;
  }
  if (out.numDuty!==undefined || out.numStandby!==undefined) out.configPreset="custom";
  if (out.numDuty===1) out.sharingMode="full";
  for (const k of Object.keys(out)) if (String(pump[k])===String(out[k])) delete out[k];
  return out;
}
function aiPumpContext(pump){
  const keys = Object.keys(AI_FIELDS).filter(k=>pump[k]!==undefined);
  const cur = Object.fromEntries(keys.map(k=>[k,pump[k]]));
  return `Pump type: ${pump.type} (${TYPE_LBL[pump.type]}). Current values: ${JSON.stringify(cur)}.
Fixture-unit codes available: ${Object.entries(FU_CODES).map(([k,c])=>`${k}=${c.label} (${c.unit})`).join("; ")||"none"}.`;
}
const AI_FIELD_HELP = `Fields (SI units): name, tag, directFlow (L/s), safetyPct (%), flowMode ("direct" or "wsfu"), wsfu (total fixture units), fuCode,
tankCapacity (m3), operatingTime (h), recirculationPct (%), coolingCapacity (kW), inletTemp/outletTemp (C), equipmentDp (m),
population, lpcd, peakFactor, irrigatedArea (m2), applicationRate (mm/h), numDuty, numStandby, sharingMode ("full" = each 100% / "assist" = share),
staticHead (m), residualPressure (m head; 1 bar = 10.2 m), pipeRun (m), fittingsPct (%), maxVelocity (m/s), maxLossPaM (Pa/m),
sizingCriterion ("velocity"|"pressure"|"both"), pumpEff (0-1), motorEff (0-1).`;

function AiAssistant({pump, onApply, locked}){
  const [open,setOpen]=useState(false), [mode,setMode]=useState("fill"), [text,setText]=useState(""), [busy,setBusy]=useState(false);
  const [patch,setPatch]=useState(null), [review,setReview]=useState(""), [err,setErr]=useState(""), [settings,setSettings]=useState(false);
  const reset=()=>{setPatch(null);setReview("");setErr("");};
  const runFill=async()=>{
    if(!text.trim()) return; reset(); setBusy(true);
    try{
      const sys=`You are an MEP public-health engineer filling a pump-sizing form. Extract values from the user's text and return ONLY a JSON object of fields to change. Convert units to SI as listed. Omit anything not stated. Never invent values.\n${AI_FIELD_HELP}`;
      const r=await aiChat([{role:"system",content:sys},{role:"user",content:aiPumpContext(pump)+"\n\nText:\n"+text}],{json:true});
      const p=aiCleanPatch(aiJson(r),pump); setPatch(p); if(!Object.keys(p).length) setErr("No changes found in that text.");
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  };
  const runReview=async()=>{
    reset(); setBusy(true);
    try{
      const res=safeCalculate(pump);
      const results = res.error ? `BLOCKED: ${res.errors.join(" ")}` :
        `Flow/pump ${res.flowLsPerPump.toFixed(2)} L/s, system ${res.flowTotal.toFixed(2)} L/s, pipe ${res.pipe.od} OD/${res.pipe.id} ID mm, velocity ${res.velDesign.toFixed(2)} m/s, friction ${res.gradDesign.toFixed(0)} Pa/m (governed by ${res.governs}), friction loss ${res.hf.toFixed(2)} m, total head ${res.totalH} m, shaft ${res.pwrShaft.toFixed(2)} kW, motor ${res.pwrSel} kW, ${res.config}.`;
      const sys="You are a senior MEP public-health reviewer in the UAE. Review this pump calculation for errors, unrealistic inputs and code issues (UAE / DIFC / UPC / IPC / CIBSE practice). Reply in at most 8 short bullet points, most important first. Flag only real issues; say 'No issues' if none. No preamble.";
      setReview(await aiChat([{role:"system",content:sys},{role:"user",content:aiPumpContext(pump)+"\nResults: "+results}]));
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  };
  if (!open) return <><button className="ai-open" onClick={()=>setOpen(true)} title="AI assistant">✨ AI</button>{settings&&<AiSettingsModal onClose={()=>setSettings(false)}/>}</>;
  return <div className="ai-panel no-print">
    <div className="ai-head"><b>✨ AI assistant</b><span className="ai-model">{aiSettings().model}</span>
      <div className="pf-seg"><button className={mode==="fill"?"on":""} onClick={()=>{setMode("fill");reset();}}>Fill from text</button><button className={mode==="review"?"on":""} onClick={()=>{setMode("review");reset();}}>Review</button></div>
      <span style={{flex:1}}/><button className="ai-x" title="Settings" onClick={()=>setSettings(true)}>⚙</button><button className="ai-x" onClick={()=>{setOpen(false);reset();}}>✕</button></div>
    {mode==="fill" ? <>
      <textarea value={text} onChange={e=>setText(e.target.value)} placeholder={'Paste a schedule line, spec clause or note, e.g.\n"Booster set 2 duty + 1 standby, 4.5 L/s total, 6 bar at top fixture, static 42 m, 180 m run, PPR"'} rows={3}/>
      <div className="ai-row"><button className="pri" disabled={busy||locked||!text.trim()} onClick={runFill}>{busy?"Thinking…":"Suggest values"}</button></div>
    </> : <div className="ai-row"><button className="pri" disabled={busy} onClick={runReview}>{busy?"Reviewing…":"Review this pump"}</button></div>}
    {err && <div className="ai-msg bad">{err}</div>}
    {patch && Object.keys(patch).length>0 && <div className="ai-diff">
      <table><thead><tr><th>Field</th><th>Now</th><th>Suggested</th></tr></thead><tbody>
        {Object.entries(patch).filter(([k])=>k!=="configPreset").map(([k,v])=><tr key={k}><td>{k}</td><td>{String(pump[k]??"—")}</td><td><b>{String(v)}</b></td></tr>)}
      </tbody></table>
      <div className="ai-row"><span className="ai-note">Check every value before applying.</span><span style={{flex:1}}/><button onClick={()=>setPatch(null)}>Discard</button><button className="pri" disabled={locked} onClick={()=>{onApply(patch);setPatch(null);setText("");}}>Apply</button></div>
    </div>}
    {review && <div className="ai-review">{review}</div>}
    {settings && <AiSettingsModal onClose={()=>setSettings(false)}/>}
  </div>;
}

function PumpForm({pump, onChange}) {
  const u  = (f,v) => onChange({...pump,[f]:v});
  const uu = (o)   => onChange({...pump,...o});
  // ── pipe family / class (stored value is still one material key) ──
  const matKey = resolveMatKey(pump.pipeType) || "";
  const mat    = (matKey && PIPE_MATERIALS[matKey]) || {};
  const famOf  = m => m.material || m.label || "";
  const families = [];
  for (const m of Object.values(PIPE_MATERIALS)) { const f=famOf(m); if (f && !families.includes(f)) families.push(f); }
  const curFam  = famOf(mat);
  const classes = Object.entries(PIPE_MATERIALS).filter(([,m])=>famOf(m)===curFam);
  const pickFamily = (f) => { const k = Object.keys(PIPE_MATERIALS).find(k=>famOf(PIPE_MATERIALS[k])===f); if (k) u("pipeType",k); };
  const tbl = mat.table || [];
  const lo = tbl[0], hi = tbl[tbl.length-1];
  // ── pump set ──
  const set = pumpSetOf(pump);
  const preset = pump.configPreset || "custom";
  const pickSet = (k) => {
    const p = PUMP_CONFIG_PRESETS[k];
    if (!p || p.duty===null) { u("configPreset","custom"); return; }
    uu({configPreset:k, numDuty:p.duty, numStandby:p.standby, sharingMode:p.sharing});
  };
  // One duty pump can only be Duty/Standby; never store a contradictory basis.
  const setDuty = (v) => { const d=Number(v); uu({numDuty:v, configPreset:"custom", ...(d===1?{sharingMode:"full"}:{})}); };
  const eachPct = set.sharing==="full" ? 100 : Math.round(100/Math.max(1,set.duty));
  // ── flow block by pump type ──
  const sf = <N label="Safety factor" unit="%" value={pump.safetyPct ?? ""} onChange={v=>u("safetyPct",v)} max={100} req={false} hint="Blank = 0%" />;
  let flowBasis=null, flowFields=null;
  if (pump.type==="booster") {
    const fu = fuOf(pump), fuC = FU_CODES[fu.code] || {label:fu.code, unit:"WSFU", ref:"Not in Reference Data", table:[[0,0],[0,0]]};
    const fuOpts = Object.entries(FU_CODES).map(([k,c])=>({value:k,label:`${c.label} (${c.unit})`}));
    if (!FU_CODES[fu.code]) fuOpts.unshift({value:fu.code,label:`⚠ ${fu.code} — not in Reference Data`});
    // Any code change writes the canonical shape (flowMode "wsfu" + fuCode + wsfu),
    // which also migrates an old LU pump the first time it is edited.
    const setFu = (o) => uu({flowMode:"wsfu", fuCode:fu.code, wsfu:Number.isFinite(fu.units)?fu.units:"", ...o});
    flowBasis = <Seg value={isFuMode(pump)?"wsfu":"direct"} onChange={v=>v==="wsfu"?setFu({}):u("flowMode","direct")}
      options={[{value:"direct",label:"L/s"},{value:"wsfu",label:"WSFU"}]} />;
    flowFields = <>{isFuMode(pump) ? <>
        <S label="Code" value={fu.code} onChange={v=>setFu({fuCode:v})} options={fuOpts} />
        <N label={`Total ${fuC.unit}`} unit={fuC.unit} value={Number.isFinite(fu.units)?fu.units:""} onChange={v=>setFu({wsfu:v})} min={fuC.table[0][0]} hint={`${fuC.ref}. Table ${fuC.table[0][0]}–${fuC.table[fuC.table.length-1][0]} ${fuC.unit}; above that the flow is extrapolated and flagged.`} />
        {fuExtrapInfo(pump) && <div style={{gridColumn:"1/-1",fontSize:11,fontWeight:700,color:"#a76200",background:"#fff4e0",borderRadius:8,padding:"7px 10px"}}>⚠ {fu.units} {fuC.unit} is above the {fuC.label} table (max {fuC.table[fuC.table.length-1][0]}). Flow is extrapolated from the last table segment — not a code value. Confirm with the code authority or use a direct flow.</div>}
      </> : <N label="Peak flow" unit="L/s" value={pump.directFlow} onChange={v=>u("directFlow",v)} min={0.01} />}{sf}</>;
  } else if (pump.type==="sewage") {
    flowBasis = <Seg value={pump.flowMode==="population"?"population":"direct"} onChange={v=>u("flowMode",v)} options={[{value:"direct",label:"L/s"},{value:"population",label:"Population"}]} />;
    flowFields = <>{pump.flowMode==="population" ? <>
        <N label="Population" value={pump.population} onChange={v=>u("population",v)} min={1} />
        <N label="Per capita" unit="L/p/d" value={pump.lpcd} onChange={v=>u("lpcd",v)} min={1} />
        <N label="Peak factor" value={pump.peakFactor} onChange={v=>u("peakFactor",v)} min={1} max={10} />
      </> : <N label="Peak flow" unit="L/s" value={pump.directFlow} onChange={v=>u("directFlow",v)} min={0.01} />}{sf}
      <N label="Wet well" unit="m³" value={pump.wetWellVolume} onChange={v=>u("wetWellVolume",v)} req={false} />
      <N label="Solids passage" unit="mm" value={pump.solidsPassage} onChange={v=>u("solidsPassage",v)} req={false} /></>;
  } else if (pump.type==="irrigation") {

    flowFields = <>{pump.flowMode==="area" ? <>
        <N label="Area" unit="m²" value={pump.irrigatedArea} onChange={v=>u("irrigatedArea",v)} min={1} />
        <N label="Rate" unit="mm/h" value={pump.applicationRate} onChange={v=>u("applicationRate",v)} min={0.1} />
      </> : <N label="Peak flow" unit="L/s" value={pump.directFlow} onChange={v=>u("directFlow",v)} min={0.01} />}{sf}</>;
  } else if (pump.type==="rcp") {
    flowFields = <>

      <N label="Time" unit="h" value={pump.operatingTime} onChange={v=>u("operatingTime",v)} min={0.1} /></>;
  } else if (pump.type==="ffp" || pump.type==="tp") {
    flowFields = <>
      <N label="Tank" unit="m³" value={pump.tankCapacity} onChange={v=>u("tankCapacity",v)} min={0.1} />
      <N label={pump.type==="ffp"?"Filtration time":"Transfer time"} unit="h" value={pump.operatingTime} onChange={v=>u("operatingTime",v)} min={0.1} />
      {pump.type==="ffp" && <N label="Filter ΔP" unit="m" value={pump.equipmentDp} onChange={v=>u("equipmentDp",v)} req={false} />}</>;
  } else if (pump.type==="hex") {
    flowFields = <>
      <N label="Cooling" unit="kW" value={pump.coolingCapacity} onChange={v=>u("coolingCapacity",v)} min={0.1} />
      <N label="Inlet" unit="°C" value={pump.inletTemp} onChange={v=>u("inletTemp",v)} min={-50} />
      <N label="Outlet" unit="°C" value={pump.outletTemp} onChange={v=>u("outletTemp",v)} min={-50} />
      <N label="HEX ΔP" unit="m" value={pump.equipmentDp} onChange={v=>u("equipmentDp",v)} req={false} /></>;
  }
  if (pump.type==="custom") {
    flowFields = <><div style={{gridColumn:"1/-1"}}><CustomFlowEditor pump={pump} onPatch={uu}/></div>{sf}</>;
  }
  const isDW = pump.headLossMethod==="DW";
  return (
    <div className="pf">
      {/* Identity */}
      <div className="pf-row pf-id">
        <T label="Pump name" value={pump.name} onChange={v=>u("name",v)} />
        <T label="Tag" value={pump.tag} onChange={v=>u("tag",v)} placeholder="e.g. PH-B3-BP-1" />
      </div>

      {/* 1 · Pump set */}
      <section className="pf-sec">
        <h5><i>1</i>Pump set <em>{configStr(set.duty,set.standby)} · each pump {eachPct}% flow{set.standby===0?" · no standby":""}</em></h5>
        <div className="pf-row pf-set">
          <Seg value={QUICK_SETS.some(q=>q.k===preset)?preset:"custom"} onChange={pickSet} options={QUICK_SETS.map(q=>({value:q.k,label:q.l}))} />
          {preset==="custom" && <>
            <N label="Duty" value={pump.numDuty ?? pump.numPumps ?? 1} onChange={setDuty} min={1} max={10} step={1} />
            <N label="Standby" value={pump.numStandby ?? 1} onChange={v=>uu({numStandby:v,configPreset:"custom"})} min={0} max={10} step={1} />
            {set.duty>1 && <Seg label="Duty pumps" value={set.sharing} onChange={v=>uu({sharingMode:v,configPreset:"custom"})}
              options={[{value:"assist",label:"Share flow"},{value:"full",label:"Each 100%"}]} />}
          </>}
        </div>
      </section>

      {/* 2 · Flow */}
      <section className="pf-sec">
        <h5><i>2</i>Flow {flowBasis && <span className="pf-h-ctl">{flowBasis}</span>}</h5>
        <div className="pf-row pf-grid">{flowFields}</div>
      </section>

      {/* 3 · Pipe */}
      <section className="pf-sec">
        <h5><i>3</i>Pipe <em>{mat.label||"—"}{tbl.length>0 && ` · ${tbl.length} sizes · ID ${lo.id}–${hi.id} mm`}</em>
          <span className="pf-h-ctl"><Seg value={sizingCriterionOf(pump)} onChange={v=>uu({sizingCriterion:v, ...(v!=='velocity'&&!(Number(pump.maxLossPaM)>0)?{maxLossPaM:300}:{})})}
            options={[{value:"velocity",label:"Velocity",title:"Size on maximum velocity"},{value:"pressure",label:"Δp",title:"Size on maximum friction loss (Pa/m)"},{value:"both",label:"Both",title:"Both limits — the stricter governs"}]} /></span></h5>
        <div className="pf-row pf-grid">
          <S label="Material" value={curFam} onChange={pickFamily} options={(curFam?[]:[{value:"",label:`⚠ ${pump.pipeType||"—"} — not in Reference Data`}]).concat(families.map(f=>({value:f,label:f})))} />
          <S label="SDR / class" value={matKey} onChange={v=>u("pipeType",v)} options={classes.length?classes.map(([k,m])=>({value:k,label:m.sdrClass||m.label||k})):[{value:"",label:"Select material first"}]} />
          {sizingCriterionOf(pump)!=='pressure' && <N label="Max velocity" unit="m/s" value={pump.maxVelocity} onChange={v=>u("maxVelocity",v)} min={0.1} max={5} />}
          {sizingCriterionOf(pump)!=='velocity' && <N label="Max friction loss" unit="Pa/m" value={pump.maxLossPaM ?? ""} onChange={v=>u("maxLossPaM",v)} min={1} max={5000} step={10} hint="Typical 150–400 Pa/m. 100 Pa/m ≈ 1.02 m/100 m" />}
          <N label="Pipe run" unit="m" value={pump.pipeRun} onChange={v=>u("pipeRun",v)} />
        </div>
      </section>

      {/* 4 · Head */}
      <section className="pf-sec">
        <h5><i>4</i>Head</h5>
        <div className="pf-row pf-grid">
          <N label="Static head" unit="m" value={pump.staticHead} onChange={v=>u("staticHead",v)} />
          <N label="Residual pressure" unit="m" value={pump.residualPressure} onChange={v=>u("residualPressure",v)} />
          <N label="Fittings" unit="%" value={pump.fittingsPct} onChange={v=>u("fittingsPct",v)} max={200} hint="On straight-pipe friction" />
          <N label="Pump efficiency" value={pump.pumpEff} onChange={v=>u("pumpEff",v)} min={0.1} max={1} step={0.01} hint="0.10–1.00" />
        </div>
      </section>

      {pump.type==="custom" && <section className="pf-sec">
        <h5><i>5</i>Extra head items <em>equipment ΔP, filters, meters, strainers — added to total head</em></h5>
        <CustomHeadsEditor pump={pump} onPatch={uu}/>
      </section>}
      {/* Advanced — sensible defaults, rarely changed */}
      <details className="pf-adv">
        <summary>Advanced <em>{isDW?`Darcy ε ${pump.roughness ?? mat.roughness} mm`:`H-W C ${pump.hwCoeff||mat.hwC}`} · ηm {pump.motorEff} · margin {pump.motorMarginPct ?? 15}% · pipe on {(pump.pipeSizingBasis||"design")==="design"?"design":"peak"} flow{Number(pump.minVelocity)>0?` · min v ${pump.minVelocity}`:""}</em></summary>
        <div className="pf-row pf-grid">
          <Seg label="Friction" value={isDW?"DW":"HW"} onChange={v=>u("headLossMethod",v)} options={[{value:"HW",label:"Hazen-Williams"},{value:"DW",label:"Darcy"}]} />
          {isDW
            ? <N label="Roughness ε" unit="mm" value={pump.roughness ?? mat.roughness} onChange={v=>u("roughness",v)} step={0.001} hint={`Default ${mat.roughness} mm`} />
            : <N label="H-W C" value={pump.hwCoeff ?? mat.hwC} onChange={v=>u("hwCoeff",v)} min={60} max={160} hint={`Default ${mat.hwC}`} />}
          <Seg label="Size pipe on" value={pump.pipeSizingBasis||"design"} onChange={v=>u("pipeSizingBasis",v)} options={[{value:"design",label:"Design"},{value:"peak",label:"Peak"}]} />
          <N label="Min velocity" unit="m/s" value={pump.minVelocity} onChange={v=>u("minVelocity",v)} req={false} hint="0 = off" />
          <N label="Motor efficiency" value={pump.motorEff} onChange={v=>u("motorEff",v)} min={0.1} max={1} step={0.01} hint="Electrical input only — IE3 ≈ 0.88–0.92" />
          <N label="Motor margin" unit="%" value={pump.motorMarginPct ?? 15} onChange={v=>u("motorMarginPct",v)} max={100} hint="Over shaft power" />
        </div>
      </details>
    </div>
  );
}

function scheduleReviewStatus(p, r) {
  if (!r || r.error) return {key:'blocked', label:'Blocked', reason:(r && r.errors || ['Calculation could not be completed.']).join(' ')};
  const warnings = (r.steps || []).filter(s=>s.flag==='warn').map(s=>s.label);
  if (!r.velOk || warnings.length) return {key:'review', label:'Review', reason:warnings.length ? `Check: ${warnings.join(', ')}` : 'Hydraulic velocity needs review.'};
  return {key:'pass', label:'Pass', reason:'Calculation and selected hydraulic checks pass.'};
}
function ScheduleHealthStrip({items, activeFilter, onFilter}) {
  const counts = items.reduce((a,x)=>{ a[x.status.key]=(a[x.status.key]||0)+1; return a; },{pass:0,review:0,blocked:0});
  const installed = items.filter(x=>!x.result.error).reduce((s,x)=>s+(x.result.installedKw||0),0);
  const cards = [
    {key:'all', cls:'capacity', label:'Pump systems', value:items.length, note:`${counts.pass} passing · ${counts.review+counts.blocked} attention`},
    {key:'pass', cls:'pass', label:'Passing', value:counts.pass, note:'Valid calculations'},
    {key:'review', cls:'review', label:'Needs review', value:counts.review, note:'Check warnings'},
    {key:'blocked', cls:'blocked', label:'Blocked', value:counts.blocked, note:'Resolve before export'},
    {key:'capacity', cls:'capacity', label:'Installed capacity', value:`${installed.toFixed(1)} kW`, note:'Including standby motors'},
  ];
  return <div className="schedule-health">{cards.map(c=><button key={c.key} className={`health-card ${c.cls} ${activeFilter===c.key?'on':''}`} onClick={()=>c.key!=='capacity'&&onFilter(c.key)}><div className="h-label">{c.label}</div><div className="h-value">{c.value}</div><div className="h-note">{c.note}</div></button>)}</div>;
}
