// ─── SMALL UI COMPONENTS ──────────────────────────────────────────────────────
const lbl = {fontSize:9,fontWeight:700,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.05em",display:"block",marginBottom:3};
const inp  = {border:"1px solid #d2d2d7",borderRadius:6,padding:"5px 9px",fontSize:12.5,color:"#1d1d1f",background:"white",width:"100%",outline:"none",transition:"border-color 0.15s"};

function Field({label, value, onChange, type="text", min, step, note}) {
  return (
    <div>
      <label style={lbl}>{label}</label>
      <input type={type} value={value} min={min} step={step}
        onChange={e=>onChange(e.target.value)}
        style={inp}
        onFocus={e=>e.target.style.borderColor="#007aff"}
        onBlur={e=>e.target.style.borderColor="#d2d2d7"} />
      {note && <p style={{fontSize:10,color:"#86868b",fontStyle:"italic",marginTop:3}}>{note}</p>}
    </div>
  );
}
function Sel({label, value, onChange, options}) {
  return (
    <div>
      <label style={lbl}>{label}</label>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{...inp,cursor:"pointer"}}>
        {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────────
function AuthScreen({onAuthed}) {
  const [mode, setMode]     = useState("login"); // "login" | "signup"
  const [email, setEmail]   = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr]       = useState("");
  const [busy, setBusy]     = useState(false);
  const [info, setInfo]     = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        const normalizedEmail = email.trim().toLowerCase();
        if (data && data.session) {
          const { data: roster } = await sb.from('engineers').select('id,active').eq('email', normalizedEmail).maybeSingle();
          if (!roster || roster.active === false) {
            const { error: requestError } = await sb.from('pending_users').upsert(
              {email:normalizedEmail, status:'pending', requested_at:new Date().toISOString()},
              {onConflict:'email', ignoreDuplicates:true}
            );
            if (requestError) throw requestError;
          }
          setInfo("Account created and your access request is pending administrator approval.");
        } else {
          setInfo("Account created. Check your inbox to confirm your email, then sign in to submit or view your access request.");
        }
      }
    } catch (e2) {
      setErr(e2.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#f5f5f7",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",width:480,height:480,borderRadius:"50%",background:"radial-gradient(circle,rgba(0,122,255,.08) 0%,transparent 70%)",top:-140,right:-60,pointerEvents:"none"}} />
      <div style={{position:"absolute",width:360,height:360,borderRadius:"50%",background:"radial-gradient(circle,rgba(52,199,89,.07) 0%,transparent 70%)",bottom:-80,left:-80,pointerEvents:"none"}} />
      <div style={{position:"relative",zIndex:1,width:"min(400px,94vw)",background:"#fff",borderRadius:20,padding:"40px 36px 32px",textAlign:"center",boxShadow:"0 2px 4px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)"}}>
        <div style={{fontSize:11,fontWeight:800,letterSpacing:"-.02em",color:"#10243e",marginBottom:16}}>MEINHARDT</div>
        <div style={{width:52,height:52,borderRadius:14,margin:"0 auto 20px",background:"linear-gradient(160deg,#007aff 0%,#0055d4 100%)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,122,255,.3)",color:"white",fontSize:23}}>▥</div>
        <div style={{fontSize:21,fontWeight:700,color:"#1d1d1f",marginBottom:5,letterSpacing:"-.03em"}}>Pump Sizing Calculator</div>
        <div style={{fontSize:13,color:"#6e6e73",marginBottom:28}}>Sign in to continue</div>
        <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:10,textAlign:"left"}}>
          <input type="email" autoComplete="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1px solid #d2d2d7",borderRadius:10,fontSize:12,color:"#1d1d1f",background:"#fff",outline:"none"}} />
          <input type="password" autoComplete={mode==="login"?"current-password":"new-password"} placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1px solid #d2d2d7",borderRadius:10,fontSize:12,color:"#1d1d1f",background:"#fff",outline:"none"}} />
          {err  && <div style={{fontSize:11,color:"#ff3b30",background:"#fff0ee",padding:"8px 10px",borderRadius:8}}>{err}</div>}
          {info && <div style={{fontSize:11,color:"#16803a",background:"#e8faf0",padding:"8px 10px",borderRadius:8}}>{info}</div>}
          <button type="submit" disabled={busy} style={{marginTop:2,padding:"10px 0",background:"#007aff",color:"white",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:busy?"default":"pointer",opacity:busy?0.6:1}}>
            {busy ? "Please wait…" : mode==="login" ? "Sign In" : "Request Access"}
          </button>
        </form>
        <div style={{marginTop:14,textAlign:"center",fontSize:11,color:"#86868b"}}>
          {mode==="login" ? (
            <>Don’t have an account? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");setErr("");setInfo("");}} style={{color:"#007aff",fontWeight:600,textDecoration:"underline"}}>Request Access</a></>
          ) : (
            <>Already have an account? <a href="#" onClick={e=>{e.preventDefault();setMode("login");setErr("");setInfo("");}} style={{color:"#007aff",fontWeight:600,textDecoration:"underline"}}>Sign In</a></>
          )}
        </div>
        <div style={{marginTop:26,fontSize:9,color:"#86868b"}}>PumpCalcTool · Secure cloud projects</div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// EXCEL EXPORT — writes a workbook of LIVE FORMULAS, not just values.
// Every derived number is a real Excel formula referencing the input cells and
// the reference-table sheets, so a client receiving the file can change an
// input and watch the whole calculation recompute. Input cells are shaded
// amber, computed cells white, key results blue.
// ══════════════════════════════════════════════════════════════════════════
const XL = {
  navy:   "FF1E3A5F",
  slate:  "FF334155",
  input:  "FFFFF4DC",  // amber — editable
  result: "FFDBEAFE",  // blue  — key output
  band:   "FFF1F5F9",
  border: "FFCBD5E1",
};
function xlSheetName(name, used) {
  let n = String(name||"Sheet").replace(/[\\\/\?\*\[\]:]/g,"-").trim().slice(0,28) || "Sheet";
  let base = n, i = 2;
  while (used.has(n)) { n = base.slice(0,25) + "_" + i; i++; }
  used.add(n);
  return n;
}
function xlThin(cell) {
  cell.border = { top:{style:"thin",color:{argb:XL.border}}, left:{style:"thin",color:{argb:XL.border}},
                  bottom:{style:"thin",color:{argb:XL.border}}, right:{style:"thin",color:{argb:XL.border}} };
}

function buildPumpWorkbook(ExcelJSLib, proj, pumps, stageName) {
  const wb = new ExcelJSLib.Workbook();
  wb.creator = "Meinhardt Group — Pump Sizing Calculator";
  wb.created = new Date();
  // Force Excel to recalculate every formula the moment the file is opened,
  // so cells show real numbers rather than a cached blank.
  wb.calcProperties.fullCalcOnLoad = true;

  // ── Reference sheets ──────────────────────────────────────────────────────
  const refPipe = wb.addWorksheet("Ref_Pipes");
  refPipe.columns = [{width:22},{width:12},{width:12},{width:12}];
  refPipe.getRow(1).values = ["Material","NB (mm)","OD (mm)","ID (mm)"];
  refPipe.getRow(1).font = {bold:true,color:{argb:"FFFFFFFF"}};
  refPipe.getRow(1).fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.navy}};
  const pipeRanges = {};
  let pr = 2;
  for (const [key, mat] of Object.entries(PIPE_MATERIALS)) {
    const start = pr;
    for (const s of mat.table) {
      refPipe.getRow(pr).values = [mat.label, s.nb ?? "", s.od, s.id];
      pr++;
    }
    const end = pr - 1;
    if (end >= start) {
      pipeRanges[key] = {
        od: `Ref_Pipes!$C$${start}:$C$${end}`,
        id: `Ref_Pipes!$D$${start}:$D$${end}`,
      };
    }
    pr++; // blank spacer row between materials
  }

  const refMotor = wb.addWorksheet("Ref_Motors");
  refMotor.columns = [{width:14}];
  refMotor.getRow(1).values = ["Motor kW"];
  refMotor.getRow(1).font = {bold:true,color:{argb:"FFFFFFFF"}};
  refMotor.getRow(1).fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.navy}};
  MOTOR_KW.forEach((kw,i)=>{ refMotor.getCell(`A${i+2}`).value = kw; });
  const motorRange = `Ref_Motors!$A$2:$A$${MOTOR_KW.length+1}`;

  const refWsfu = wb.addWorksheet("Ref_WSFU");
  refWsfu.columns = [{width:14},{width:16}];
  refWsfu.getRow(1).values = ["WSFU","Flow (L/s)"];
  refWsfu.getRow(1).font = {bold:true,color:{argb:"FFFFFFFF"}};
  refWsfu.getRow(1).fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.navy}};
  WSFU_TABLE.forEach(([x,y],i)=>{ refWsfu.getCell(`A${i+2}`).value=x; refWsfu.getCell(`B${i+2}`).value=y; });
  const wsfuX = `Ref_WSFU!$A$2:$A$${WSFU_TABLE.length+1}`, wsfuY = `Ref_WSFU!$B$2:$B$${WSFU_TABLE.length+1}`;

  const refLu = wb.addWorksheet("Ref_LU");
  refLu.columns = [{width:16},{width:16}];
  refLu.getRow(1).values = ["Loading Units","Flow (L/s)"];
  refLu.getRow(1).font = {bold:true,color:{argb:"FFFFFFFF"}};
  refLu.getRow(1).fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.navy}};
  IOP_LU_TABLE.forEach(([x,y],i)=>{ refLu.getCell(`A${i+2}`).value=x; refLu.getCell(`B${i+2}`).value=y; });
  const luX = `Ref_LU!$A$2:$A$${IOP_LU_TABLE.length+1}`, luY = `Ref_LU!$B$2:$B$${IOP_LU_TABLE.length+1}`;

  // Linear interpolation across a lookup curve, written as an Excel formula.
  const interp = (xRef, xCol, yCol) =>
    `IF(OR(${xRef}<MIN(${xCol}),${xRef}>MAX(${xCol})),NA(),IFERROR(INDEX(${yCol},MATCH(${xRef},${xCol},1))+(${xRef}-INDEX(${xCol},MATCH(${xRef},${xCol},1)))/` +
    `(INDEX(${xCol},MATCH(${xRef},${xCol},1)+1)-INDEX(${xCol},MATCH(${xRef},${xCol},1)))*` +
    `(INDEX(${yCol},MATCH(${xRef},${xCol},1)+1)-INDEX(${yCol},MATCH(${xRef},${xCol},1))),NA()))`;
  // First approved entry at or above the target. #N/A is deliberate when the
  // schedule is exceeded; Excel must not silently select the final row.
  const firstAtLeast = (rng, target) =>
    `IFERROR(MATCH(TRUE,INDEX(${rng}>=${target},0),0),NA())`;

  // ── Schedule sheet ────────────────────────────────────────────────────────
  const sch = wb.addWorksheet("Pump Schedule", {views:[{state:"frozen",ySplit:6}]});
  sch.columns = [{width:5},{width:34},{width:14},{width:22},{width:9},{width:12},{width:12},{width:12},{width:11},{width:13},{width:9},{width:13}];
  sch.mergeCells("A1:L1");
  sch.getCell("A1").value = "MEINHARDT GROUP · MEP ENGINEERING — PUMP SCHEDULE";
  sch.getCell("A1").font = {bold:true,size:13,color:{argb:"FFFFFFFF"}};
  sch.getCell("A1").fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.navy}};
  sch.getCell("A1").alignment = {vertical:"middle"};
  sch.getRow(1).height = 24;
  sch.getCell("A2").value = `Project: ${proj.name||""}`;
  sch.getCell("D2").value = `Client: ${proj.client||""}`;
  sch.getCell("G2").value = `Stage: ${stageName||proj.stage||""}`;
  sch.getCell("J2").value = `Rev: ${proj.revision||""}`;
  sch.getCell("A3").value = `Date: ${proj.date||""}`;
  sch.getCell("D3").value = `Prepared: ${proj.calcBy||""}${proj.calcDate?"  "+proj.calcDate:""}`;
  sch.getCell("G3").value = `Checked: ${proj.checkedBy||""}${proj.checkedDate?"  "+proj.checkedDate:""}`;
  sch.getCell("J3").value = `Approved: ${proj.reviewedBy||""}${proj.reviewedDate?"  "+proj.reviewedDate:""}`;
  [2,3].forEach(r=>{ sch.getRow(r).font={size:9,color:{argb:XL.slate}}; });

  const schHdr = ["No.","System","Tag","Pipe","Method","Q/Pump (L/s)","Total Flow (L/s)","Total Head (m)","Motor (kW)","Arrangement","Total No.","Velocity (m/s)"];
  sch.getRow(5).values = schHdr;
  sch.getRow(5).eachCell(c=>{
    c.font={bold:true,size:9,color:{argb:"FFFFFFFF"}};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XL.slate}};
    c.alignment={wrapText:true,vertical:"middle"};
    xlThin(c);
  });
  sch.getRow(5).height = 28;

  // ── One sheet per pump ────────────────────────────────────────────────────
  const used = new Set(["Ref_Pipes","Ref_Motors","Ref_WSFU","Ref_LU","Pump Schedule"]);
  pumps.forEach((p, idx) => {
    const res = calculate(p);
    if (!res || res.error) throw new Error(`Cannot export ${p.name || `pump ${idx+1}`}: ${(res && res.errors || ['invalid calculation']).join(' ')}`);
    const set = res.set;
    const matKey = p.pipeType || "HDPE";
    const mat = PIPE_MATERIALS[matKey] || PIPE_MATERIALS.HDPE;
    const rng = pipeRanges[matKey] || pipeRanges.HDPE;
    const wsName = xlSheetName(p.tag || p.name || `Pump ${idx+1}`, used);
    const ws = wb.addWorksheet(wsName);
    ws.columns = [{width:46},{width:16},{width:11},{width:52}];

    let r = 1;
    const title = (text) => {
      ws.mergeCells(`A${r}:D${r}`);
      const c = ws.getCell(`A${r}`);
      c.value = text;
      c.font = {bold:true,size:12,color:{argb:"FFFFFFFF"}};
      c.fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.navy}};
      c.alignment = {vertical:"middle"};
      ws.getRow(r).height = 22;
      r++;
    };
    const meta = (text) => {
      ws.mergeCells(`A${r}:D${r}`);
      const c = ws.getCell(`A${r}`);
      c.value = text; c.font = {size:9,color:{argb:XL.slate}};
      r++;
    };
    const section = (text) => {
      ws.mergeCells(`A${r}:D${r}`);
      const c = ws.getCell(`A${r}`);
      c.value = text;
      c.font = {bold:true,size:9,color:{argb:"FFFFFFFF"}};
      c.fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.slate}};
      r++;
    };
    // kind: "in" = editable input, "calc" = formula, "out" = key result
    const line = (label, value, unit, note, kind, fmt) => {
      ws.getCell(`A${r}`).value = label;
      ws.getCell(`A${r}`).font = {size:10};
      const vc = ws.getCell(`B${r}`);
      vc.value = value;
      vc.font = {size:10, bold: kind==="out"};
      if (fmt) vc.numFmt = fmt;
      if (kind==="in")  vc.fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.input}};
      if (kind==="out") vc.fill = {type:"pattern",pattern:"solid",fgColor:{argb:XL.result}};
      xlThin(vc);
      ws.getCell(`C${r}`).value = unit || "";
      ws.getCell(`C${r}`).font = {size:9,color:{argb:XL.slate}};
      ws.getCell(`D${r}`).value = note || "";
      ws.getCell(`D${r}`).font = {size:8,italic:true,color:{argb:XL.slate}};
      return `B${r++}`;
    };

    title(`${idx+1}. ${p.name||"Pump"}${p.tag?`  [${p.tag}]`:""}`);
    meta(`${proj.name||""} · ${proj.client||""} · Stage ${stageName||proj.stage||""} · Rev ${proj.revision||""} · ${proj.date||""}`);
    meta(`Type: ${TYPE_LBL[p.type]} · Pipe: ${mat.label} · Prepared ${proj.calcBy||"-"} / Checked ${proj.checkedBy||"-"} / Approved ${proj.reviewedBy||"-"}`);
    meta(`Amber cells are inputs — change them and the whole sheet recalculates.`);
    r++;

    // ── Pump set ──
    section("PUMP SET CONFIGURATION");
    const cDuty    = line("Duty Pumps (running at design flow)", set.duty, "No.", "", "in", "0");
    const cStandby = line("Standby Pumps", set.standby, "No.", "", "in", "0");
    const cBasis   = line("Sizing Basis", set.sharing==="full"?"FULL":"ASSIST", "", "FULL = each pump 100% flow · ASSIST = duty pumps share flow", "in");
    const cInstalled = line("Total Pumps Installed", {formula:`${cDuty}+${cStandby}`}, "No.", "Duty + Standby", "calc", "0");
    r++;

    // ── Flow ──
    section("FLOW RATE");
    let cTotalFlow;
    if (p.type==="rcp") {
      const a = line("Tank Capacity", num(p.tankCapacity,0), "m³", "", "in", "0.0");
      const b = line("Recirculation Percentage", num(p.recirculationPct,20), "%", "20% typical", "in", "0");
      const c = line("Recirculation Time", num(p.operatingTime,8), "hr", "", "in", "0.0");
      cTotalFlow = line("Total System Flow", {formula:`${a}*${b}/100*1000/${c}/3600`}, "L/s", "= Tank × % ÷ time ÷ 3600", "calc", "0.00");
    } else if (p.type==="ffp" || p.type==="tp") {
      const a = line("Tank Capacity", num(p.tankCapacity,0), "m³", "", "in", "0.0");
      const b = line(p.type==="ffp"?"Filtration Time":"Transfer Time", num(p.operatingTime,1), "hr", "", "in", "0.0");
      cTotalFlow = line("Total System Flow", {formula:`${a}*1000/${b}/3600`}, "L/s", "= Volume ÷ time ÷ 3600", "calc", "0.00");
    } else if (p.type==="hex") {
      const a = line("Cooling Capacity", num(p.coolingCapacity,0), "kW", "", "in", "0.0");
      const b = line("Inlet Temperature", num(p.inletTemp,34), "°C", "", "in", "0.0");
      const c = line("Outlet Temperature", num(p.outletTemp,20), "°C", "", "in", "0.0");
      line("Delta T", {formula:`${b}-${c}`}, "°C", "", "calc", "0.0");
      cTotalFlow = line("Total System Flow", {formula:`${a}/(4.18*(${b}-${c}))`}, "L/s", "= kW ÷ (4.18 × ΔT)", "calc", "0.00");
    } else if (p.type==="booster") {
      if (p.flowMode==="wsfu") {
        const a = line("WSFU Count", num(p.wsfu,0), "WSFU", "Abu Dhabi UPC", "in", "0");
        cTotalFlow = line("Total System Flow", {formula:interp(a, wsfuX, wsfuY)}, "L/s", "Interpolated from Ref_WSFU", "calc", "0.00");
      } else if (p.flowMode==="iop") {
        const a = line("Loading Units", num(p.loadingUnits,0), "LU", "IOP / CIPHE Design Guide", "in", "0");
        cTotalFlow = line("Total System Flow", {formula:interp(a, luX, luY)}, "L/s", "Interpolated from Ref_LU", "calc", "0.00");
      } else {
        cTotalFlow = line("Total System Flow (direct input)", num(p.directFlow,0), "L/s", "", "in", "0.00");
      }
    } else if (p.type==="sewage") {
      if (p.flowMode==="population") {
        const a = line("Population Served", num(p.population,0), "persons", "", "in", "0");
        const b = line("Per-Capita Flow", num(p.lpcd,150), "L/p/day", "150 typical", "in", "0");
        const c = line("Peak Factor", num(p.peakFactor,3), "", "~3 typical", "in", "0.0");
        cTotalFlow = line("Peak Sewage Flow", {formula:`${a}*${b}*${c}/86400`}, "L/s", "= Pop × lpcd × PF ÷ 86400", "calc", "0.00");
      } else {
        cTotalFlow = line("Peak Sewage Flow (direct input)", num(p.directFlow,0), "L/s", "", "in", "0.00");
      }
    } else if (p.type==="irrigation") {
      if (p.flowMode==="area") {
        const a = line("Irrigated Area", num(p.irrigatedArea,0), "m²", "", "in", "0");
        const b = line("Application Rate", num(p.applicationRate,6), "mm/hr", "4–8 typical", "in", "0.0");
        cTotalFlow = line("Peak Irrigation Flow", {formula:`${a}*${b}/3600`}, "L/s", "= Area × rate ÷ 3600", "calc", "0.00");
      } else {
        cTotalFlow = line("Total System Flow (direct input)", num(p.directFlow,0), "L/s", "", "in", "0.00");
      }
    } else {
      cTotalFlow = line("Total System Flow", num(p.directFlow,0), "L/s", "", "in", "0.00");
    }

    // Rounded total system flow — this is what sizes the common header pipe.
    const cFlowTotal = line("Total System Flow (rounded up to 0.1)", {formula:`CEILING(${cTotalFlow},0.1)`}, "L/s", "Sizes the common header", "calc", "0.00");
    const hasSafety = (p.type==="booster"||p.type==="sewage"||p.type==="irrigation");
    const cSafety = hasSafety ? line("Safety Factor", num(p.safetyPct,0), "%", "Blank / 0 = none", "in", "0") : null;
    const cDesign = hasSafety
      ? line("Design Flow", {formula:`CEILING(${cFlowTotal}*(1+${cSafety}/100),0.1)`}, "L/s", "= Total × (1 + safety) — used for head loss & pump duty", "calc", "0.00")
      : line("Design Flow", {formula:`${cFlowTotal}`}, "L/s", "No safety factor applied to this pump type", "calc", "0.00");
    const cPerPump = line("Flow per Pump", {formula:`IF(UPPER(${cBasis})="FULL",${cDesign},CEILING(${cDesign}/${cDuty},0.1))`},
      "L/s", "FULL → 100% each · ASSIST → design ÷ duty pumps", "out", "0.00");
    r++;

    // ── Pipe ──
    const sizingBasis = p.pipeSizingBasis || "design";
    section("PIPE SIZING  (common header carries the whole system flow)");
    const cBasisPipe = line("Size Pipe On", sizingBasis==="peak" ? "PEAK" : "DESIGN", "",
      "PEAK = excl. safety factor · DESIGN = incl. safety factor", "in");
    const cSizeQ = line("Flow Used for Sizing", {formula:`IF(UPPER(${cBasisPipe})="PEAK",${cFlowTotal},${cDesign})`}, "L/s", "", "calc", "0.00");
    const cMaxV = line("Max Allowable Velocity", num(p.maxVelocity,2), "m/s", "", "in", "0.0");
    const cMinV = line("Min Velocity (self-cleansing, 0 = off)", num(p.minVelocity,0), "m/s", "", "in", "0.0");
    const cReqDi = line("Required Internal Diameter", {formula:`SQRT(4*(${cSizeQ}/1000)/(PI()*${cMaxV}))*1000`}, "mm", "= √(4Q / π·v)", "calc", "0.0");
    const cPipeIdx = line("Pipe Table Row", {formula:firstAtLeast(rng.id, cReqDi)}, "", `First size in ${mat.label} with ID ≥ required`, "calc", "0");
    const cOD = line("Selected Pipe OD", {formula:`INDEX(${rng.od},${cPipeIdx})`}, "mm", "From Ref_Pipes", "out", "0.0");
    const cID = line("Selected Pipe ID", {formula:`INDEX(${rng.id},${cPipeIdx})`}, "mm", "From Ref_Pipes", "calc", "0.0");
    const cVelPeak = line("Velocity at Peak Demand", {formula:`(${cFlowTotal}/1000)/(PI()/4*(${cID}/1000)^2)`}, "m/s", "= Q ÷ A at peak demand", "calc", "0.00");
    const cVel = line("Velocity at Design Flow", {formula:`(${cDesign}/1000)/(PI()/4*(${cID}/1000)^2)`}, "m/s", "The highest velocity the pipe actually sees", "out", "0.00");
    line("Velocity Check", {formula:`IF(${cVel}>${cMaxV},"EXCEEDS MAX",IF(AND(${cMinV}>0,${cVelPeak}<${cMinV}),"BELOW MIN","OK"))`}, "",
      "Max checked at design flow · min checked at peak demand", "calc");
    r++;

    // ── Head loss ──
    section("HEAD LOSS");
    const isDW = p.headLossMethod==="DW";
    const cLen = line("Pipe Run Length", num(p.pipeRun,0), "m", "", "in", "0.0");
    let cHf;
    if (isDW) {
      const cEps  = line("Pipe Roughness ε", num(p.roughness, mat.roughness), "mm", `${mat.label} default ${mat.roughness}`, "in", "0.0000");
      const cVelD = cVel;  // friction is evaluated at design flow
      const cRe   = line("Reynolds Number", {formula:`${cVelD}*(${cID}/1000)/0.000001004`}, "", "= v·D / ν  (water @ 20°C)", "calc", "0");
      const cF    = line("Friction Factor f", {formula:`IF(${cRe}<2300,64/${cRe},0.25/(LOG10((${cEps}/1000)/(3.7*(${cID}/1000))+5.74/${cRe}^0.9))^2)`},
        "", "Swamee-Jain approximation of Colebrook", "calc", "0.0000");
      cHf = line("Friction Loss", {formula:`${cF}*(${cLen}/(${cID}/1000))*(${cVelD}^2/(2*9.81))`}, "m", "Darcy-Weisbach: hf = f·(L/D)·v²/2g", "calc", "0.000");
    } else {
      const cC = line("Hazen-Williams Coefficient C", num(p.hwCoeff, mat.hwC), "", `${mat.label} default C=${mat.hwC}`, "in", "0");
      cHf = line("Friction Loss", {formula:`10.7*((${cDesign}/1000)/${cC})^1.852*${cLen}/((${cID}/1000)^4.87)`}, "m",
        "Hazen-Williams: hf = 10.7(Q/C)^1.852 · L / D^4.87", "calc", "0.000");
    }
    const cFitPc = line("Fittings & Valves Allowance", num(p.fittingsPct,50), "%", "50% typical at preliminary stage", "in", "0");
    const cFit   = line("Fittings & Valves Loss", {formula:`${cHf}*${cFitPc}/100`}, "m", "", "calc", "0.000");
    const cStat  = line("Static Head", num(p.staticHead,0), "m", "", "in", "0.0");
    const cResid = line("Residual Pressure Required", num(p.residualPressure,0), "m", "", "in", "0.0");
    let cEquip = null;
    if (p.type==="ffp" || p.type==="hex") {
      cEquip = line(p.type==="ffp"?"Filter Equipment ΔP":"HEX Equipment ΔP", num(p.equipmentDp,0), "m", "", "in", "0.0");
    }
    const sumParts = [cStat,cResid,cHf,cFit].concat(cEquip?[cEquip]:[]).join("+");
    const cSum = line("Sum of Heads", {formula:sumParts}, "m", "Static + residual + friction + fittings" + (cEquip?" + equipment":""), "calc", "0.000");
    r++;

    section("TOTAL HEAD");
    const cSafetyH = line("Head Safety Factor", 1.10, "", "1.10 = 10% margin", "in", "0.00");
    const cHead = line("TOTAL PUMP HEAD", {formula:`CEILING(${cSum}*${cSafetyH},1)`}, "m", "Rounded up to the next whole metre", "out", "0");
    r++;

    section("MOTOR POWER");
    const cEffP = line("Pump Efficiency ηp", num(p.pumpEff,0.7), "", "", "in", "0.00");
    const cEffM = line("Motor Efficiency ηm", num(p.motorEff,0.7), "", "", "in", "0.00");
    const cPwr  = line("Power Required per Pump", {formula:`(${cPerPump}/1000)*9.81*${cHead}/(${cEffP}*${cEffM})`}, "kW", "= Q·ρg·H / (ηp·ηm)", "calc", "0.000");
    const cMotIdx = line("Motor Table Row", {formula:firstAtLeast(motorRange, cPwr)}, "", "First standard motor ≥ power required", "calc", "0");
    const cMotor = line("SELECTED MOTOR", {formula:`INDEX(${motorRange},${cMotIdx})`}, "kW", "From Ref_Motors", "out", "0.00");
    r++;

    section("SUMMARY");
    line("Arrangement", {formula:`${cDuty}&"D"&IF(${cStandby}>0," + "&${cStandby}&"S","")`}, "", "", "out");
    line("Connected Load (duty only)", {formula:`${cMotor}*${cDuty}`}, "kW", "Standby excluded", "calc", "0.00");
    line("Installed Capacity (incl. standby)", {formula:`${cMotor}*${cInstalled}`}, "kW", "", "calc", "0.00");
    line("Selection", {formula:`"Select "&${cInstalled}&" No. pumps ("&${cDuty}&"D"&IF(${cStandby}>0," + "&${cStandby}&"S","")&") @ "&TEXT(${cPerPump},"0.00")&" L/s, "&${cHead}&" m head, "&TEXT(${cMotor},"0.00")&" kW each"`},
      "", "", "out");

    // Row on the schedule sheet, linked live to this pump's own sheet
    const sr = 6 + idx;
    const q = (ref) => `'${wsName}'!${ref}`;
    sch.getCell(`A${sr}`).value = idx+1;
    sch.getCell(`B${sr}`).value = p.name || "";
    sch.getCell(`C${sr}`).value = p.tag || "";
    sch.getCell(`D${sr}`).value = { formula: `"${mat.label} "&TEXT(${q(cOD)},"0.#")&" mm"` };
    sch.getCell(`E${sr}`).value = isDW ? "D-W" : "H-W";
    sch.getCell(`F${sr}`).value = { formula: q(cPerPump) };
    sch.getCell(`G${sr}`).value = { formula: q(cFlowTotal) };
    sch.getCell(`H${sr}`).value = { formula: q(cHead) };
    sch.getCell(`I${sr}`).value = { formula: q(cMotor) };
    sch.getCell(`J${sr}`).value = { formula: `${q(cDuty)}&"D"&IF(${q(cStandby)}>0," + "&${q(cStandby)}&"S","")` };
    sch.getCell(`K${sr}`).value = { formula: q(cInstalled) };
    sch.getCell(`L${sr}`).value = { formula: q(cVel) };
    ["F","G","L"].forEach(col=>{ sch.getCell(`${col}${sr}`).numFmt = "0.00"; });
    sch.getCell(`H${sr}`).numFmt = "0";
    sch.getCell(`I${sr}`).numFmt = "0.00";
    sch.getRow(sr).eachCell(c=>{ c.font={size:10}; xlThin(c); });
  });

  // Schedule totals
  const last = 5 + pumps.length;
  if (pumps.length) {
    const tr = last + 1;
    sch.getCell(`A${tr}`).value = "";
    sch.getCell(`B${tr}`).value = "TOTAL";
    sch.getCell(`I${tr}`).value = { formula:`SUMPRODUCT(I6:I${last},K6:K${last})` };
    sch.getCell(`I${tr}`).numFmt = "0.00";
    sch.getCell(`K${tr}`).value = { formula:`SUM(K6:K${last})` };
    sch.getRow(tr).eachCell(c=>{ c.font={bold:true,size:10}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XL.band}}; xlThin(c); });
    sch.getCell(`D${tr}`).value = "Installed capacity (incl. standby) →";
    sch.getCell(`D${tr}`).font = {size:9,italic:true,color:{argb:XL.slate}};
    sch.getCell(`A${tr+2}`).value = "Formulas are live — edit any amber input cell on a pump sheet and this schedule updates.";
    sch.getCell(`A${tr+2}`).font = {size:9,italic:true,color:{argb:XL.slate}};
  }

  return wb;
}

async function exportWorkbook(proj, pumps, stageName) {
  if (!pumps || !pumps.length) { alert("No pumps in this stage to export."); return; }
  if (typeof ExcelJS === "undefined") { alert("Excel library did not load — check your internet connection and reload."); return; }
  try {
    const wb = buildPumpWorkbook(ExcelJS, proj, pumps, stageName);
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const safe = (s)=>String(s||"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_");
    const fname = `${safe(proj.name)||"Pump_Calculations"}${stageName?"_"+safe(stageName):""}_Rev${safe(proj.revision)||"01"}.xlsx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) {
    console.error(e);
    alert("Excel export failed: " + (e.message||e));
  }
}

// ─── LIVE CALC PANEL — full working, updates as you type ──────────────────────
function LiveCalcPanel({pump}) {
  const res = useMemo(()=>{ try{ return calculate(pump); }catch(e){ return {error:true,errors:[e.message||'Calculation failed.']}; } },[pump]);
  if (!res) return null;
  if (res.error) return <div style={{position:"sticky",top:70,background:"#fff7f7",borderRadius:12,border:"1px solid #fecaca",padding:16,color:"#991b1b"}}><b>Calculation blocked</b><ul style={{margin:"8px 0 0",paddingLeft:18}}>{res.errors.map((e,i)=><li key={i}>{e}</li>)}</ul></div>;
  let curSec = null;
  return (
    <div className="live-calc" style={{position:"sticky",top:70,background:"white",borderRadius:12,border:"1px solid #d2d2d7",overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
      {/* headline numbers */}
      <div className="live-calc-summary" style={{background:"#1d1d1f",padding:"12px 14px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[["Flow / Pump",`${res.flowLsPerPump.toFixed(2)} L/s`],
            ["Total Head",`${res.totalH} m`],
            ["Motor",`${res.pwrSel} kW`],
            ["Arrangement",res.config]].map(([k,v])=>(
            <div key={k}>
              <div style={{fontSize:8,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.08em"}}>{k}</div>
              <div style={{fontSize:15,fontWeight:800,color:"#f5f5f7",fontFamily:"var(--app-sans)"}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid #334155",fontSize:10,color:"#d2d2d7",lineHeight:1.5}}>
          {res.set.installed} pumps installed · {res.set.duty} duty, {res.set.standby} standby
          <br/>Pipe: {res.pipe.od} mm OD · Velocity{" "}
          <span style={{color:res.velOk?"#4ade80":"#f87171",fontWeight:700}}>
            {res.vel.toFixed(2)} m/s {res.velOk?"✓":"✗"}
          </span>
        </div>
      </div>
      {/* full working */}
      <div style={{maxHeight:"calc(100vh - 300px)",overflowY:"auto"}}>
        {res.steps.map((s,i)=>{
          const newSec = s.s && s.s!==curSec;
          if (s.s) curSec = s.s;
          return (
            <div key={i}>
              {newSec && (
                <div className="live-calc-section" style={{background:"#f5f5f7",color:"#424245",padding:"4px 14px",fontSize:8.5,fontWeight:800,letterSpacing:"0.1em",textTransform:"uppercase",borderTop:"1px solid #d2d2d7",borderBottom:"1px solid #d2d2d7"}}>
                  {s.s}
                </div>
              )}
              <div className="live-calc-row" style={{display:"flex",justifyContent:"space-between",gap:10,padding:"4px 14px",
                background: s.hl?"#e8f0fe":"transparent", alignItems:"baseline"}}>
                <span style={{fontSize:10,color:"#86868b",fontFamily:"var(--app-sans)",flex:"1 1 auto",minWidth:0,overflowWrap:"anywhere"}}>{s.label}</span>
                <span style={{fontSize:s.hl?11.5:10,fontWeight:s.hl?800:600,fontFamily:"var(--app-sans)",
                  flex:"0 1 auto",textAlign:"right",overflowWrap:"anywhere",
                  color: s.flag==="warn"?"#ff3b30": s.flag==="ok"?"#16a34a": s.hl?"#1d4ed8":"#1d1d1f"}}>
                  {s.value}
                </span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── PUMP FORM ────────────────────────────────────────────────────────────────
function PumpForm({pump, onChange}) {
  const u = (f,v) => onChange({...pump,[f]:v});
  const g2={display:"grid",gridTemplateColumns:"1fr 1fr",gap:12};
  const g3={display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12};
  const mat = PIPE_MATERIALS[pump.pipeType]||PIPE_MATERIALS.HDPE;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div style={{...g3,gridTemplateColumns:"2fr 1fr 1fr"}}>
        <Field label="Pump Name"       value={pump.name}     onChange={v=>u("name",v)} />
        <Field label="Tag"             value={pump.tag||""}  onChange={v=>u("tag",v)} />
        <Sel   label="Pipe Material"   value={pump.pipeType} onChange={v=>u("pipeType",v)}
          options={Object.entries(PIPE_MATERIALS).map(([k,m])=>({value:k,label:m.label}))} />
      </div>
      <div style={g2}>
        <Sel   label="Head Loss Method" value={pump.headLossMethod||"HW"} onChange={v=>u("headLossMethod",v)}
          options={[{value:"HW",label:"Hazen-Williams"},{value:"DW",label:"Darcy-Weisbach"}]} />
        {pump.headLossMethod==="DW"
          ? <Field label="Pipe Roughness ε (mm)" type="number" step="0.001" value={pump.roughness!==undefined?pump.roughness:mat.roughness} onChange={v=>u("roughness",v)} note={`Default for ${mat.label}: ${mat.roughness} mm`} />
          : <Field label="H-W Coefficient C" type="number" value={pump.hwCoeff} onChange={v=>u("hwCoeff",v)} note={`Default for ${mat.label}: C=${mat.hwC}`} />}
      </div>

      {/* ── PUMP SET CONFIGURATION ── */}
      <div style={{borderTop:"2px solid #f5f5f7",paddingTop:14}}>
        <div style={{fontSize:10,fontWeight:800,color:SEC_COL["Pump Set"],textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>◆ Pump Set Configuration</div>
        <Sel label="Standard Arrangement" value={pump.configPreset||"custom"}
          onChange={v=>{
            const preset = PUMP_CONFIG_PRESETS[v];
            if (!preset || preset.duty===null) { u("configPreset", v); return; }
            onChange({...pump, configPreset:v, numDuty:preset.duty, numStandby:preset.standby, sharingMode:preset.sharing});
          }}
          options={Object.entries(PUMP_CONFIG_PRESETS).map(([k,c])=>({value:k,label:c.label}))} />
        <div style={{...g3, marginTop:12}}>
          <Field label="Duty Pumps"    type="number" min="1" value={pump.numDuty ?? pump.numPumps ?? 1}
            onChange={v=>onChange({...pump, numDuty:v, configPreset:"custom"})} note="Running at design flow" />
          <Field label="Standby Pumps" type="number" min="0" value={pump.numStandby ?? 1}
            onChange={v=>onChange({...pump, numStandby:v, configPreset:"custom"})} note="Installed, idle" />
          <Sel   label="Sizing Basis"  value={pump.sharingMode || ((pump.numDuty ?? pump.numPumps ?? 1)>1 ? "assist":"full")}
            onChange={v=>onChange({...pump, sharingMode:v, configPreset:"custom"})}
            options={[
              {value:"full",  label:"Duty / Standby — each 100% flow"},
              {value:"assist",label:"Duty / Assist — duty share flow"},
            ]} />
        </div>
        {(()=>{ const s=pumpSetOf(pump); return (
          <div style={{marginTop:10,padding:"8px 12px",background:"#f5f5f7",border:"1px solid #d2d2d7",borderRadius:8,fontSize:11,color:"#424245"}}>
            <b>{configStr(s.duty,s.standby)}</b> — {s.installed} pump{s.installed===1?"":"s"} installed, {s.duty} running at design flow.
            {" "}Each pump sized for {s.sharing==="full" ? "100% of system flow" : `${(100/s.duty).toFixed(0)}% of system flow`}.
            {s.standby===0 && <span style={{color:"#b45309"}}> No standby — no redundancy.</span>}
          </div>
        ); })()}
      </div>

      <div style={{borderTop:"2px solid #f5f5f7",paddingTop:14}}>
        <div style={{fontSize:10,fontWeight:800,color:SEC_COL["Flow Rate"],textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>
          ◆ {pump.type==="rcp"?"Tank Parameters":pump.type==="hex"?"Thermal Parameters":pump.type==="booster"?"Flow Parameters":pump.type==="sewage"?"Sewage Flow Parameters":pump.type==="irrigation"?"Irrigation Parameters":"Tank / Transfer Parameters"}
        </div>
        {pump.type==="rcp" && (
          <div style={g3}>
            <Field label="Tank Capacity (m³)"  type="number" value={pump.tankCapacity}     onChange={v=>u("tankCapacity",v)} />
            <Field label="Recirculation (%)"   type="number" value={pump.recirculationPct} onChange={v=>u("recirculationPct",v)} note="20% is standard" />
            <Field label="Recirc Time (hr)"    type="number" value={pump.operatingTime}    onChange={v=>u("operatingTime",v)} />
          </div>
        )}
        {(pump.type==="ffp"||pump.type==="tp") && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={g2}>
              <Field label="Tank Capacity (m³)"                                          type="number" value={pump.tankCapacity}  onChange={v=>u("tankCapacity",v)} />
              <Field label={pump.type==="ffp"?"Filtration Time (hr)":"Transfer Time (hr)"} type="number" value={pump.operatingTime} onChange={v=>u("operatingTime",v)} />
            </div>
            {pump.type==="ffp" && <Field label="Filter Equipment ΔP (m)" type="number" value={pump.equipmentDp} onChange={v=>u("equipmentDp",v)} />}
          </div>
        )}
        {pump.type==="hex" && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={g3}>
              <Field label="Cooling Capacity (kW)" type="number" value={pump.coolingCapacity} onChange={v=>u("coolingCapacity",v)} />
              <Field label="Inlet Temp (°C)"       type="number" value={pump.inletTemp}       onChange={v=>u("inletTemp",v)} />
              <Field label="Outlet Temp (°C)"      type="number" value={pump.outletTemp}      onChange={v=>u("outletTemp",v)} />
            </div>
            <Field label="HEX Equipment ΔP (m)" type="number" value={pump.equipmentDp} onChange={v=>u("equipmentDp",v)} />
          </div>
        )}
        {pump.type==="booster" && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <Sel label="Flow Basis" value={pump.flowMode} onChange={v=>u("flowMode",v)}
              options={[
                {value:"direct",label:"Direct Input (L/s)"},
                {value:"wsfu",label:"WSFU Count — Abu Dhabi UPC"},

// ─── CALCULATION SHEET ────────────────────────────────────────────────────────
function CalcSheet({pump, idx, proj}) {
  const [open, setOpen] = useState(false);
  const res = useMemo(()=>{ try{return calculate(pump);}catch(e){return {error:true,errors:[e.message||'Calculation failed.']};} },[pump]);
  if (!res) return null;
  if (res.error) return <div className="calc-card-blocked"><h3>{String(idx+1).padStart(2,"0")}. {pump.name} — calculation blocked</h3><ul>{res.errors.map((e,i)=><li key={i}>{e}</li>)}</ul></div>;
  const mat = PIPE_MATERIALS[res.matKey]||PIPE_MATERIALS.HDPE;
  const inferSection = (step, current) => {
    if (step.s) return step.s;
    const label = String(step.label||'').toLowerCase();
    if (/duty pumps|standby pumps|duty sharing|arrangement|installed/.test(label)) return 'Pump Set';
    if (/tank capacity|volume|recirculation|transfer time|filtration|cooling capacity|inlet temp|outlet temp|flow input|peak flow|design flow|flow per pump|population|irrigated area|application rate|loading units|wsfu/.test(label)) return 'Flow Rate';
    if (/pipe material|sized on|max allowable velocity|required internal diameter|selected pipe|actual flow velocity|velocity at peak|velocity at design|solids passage/.test(label)) return 'Pipe Sizing';
    if (/method|pipe run|friction loss|fittings|static head|residual pressure|equipment.*dp/.test(label)) return 'Head Loss';
    if (/sum of heads|total pump head|head safety/.test(label)) return 'Total Head';
    if (/efficienc|power required|selected standard motor|motor power/.test(label)) return 'Motor Power';
    return current || 'Calculation';
  };
  const sections = [];
  let currentSection = '';
  for (const step of res.steps) {
    const title = inferSection(step, currentSection);
    currentSection = title;
    let section = sections.find(x=>x.title===title);
    if (!section) { section={title, rows:[]}; sections.push(section); }
    section.rows.push(step);
  }
  const metrics = [["Flow / pump",`${res.flowLsPerPump.toFixed(2)} L/s`],["Total head",`${res.totalH} m`],["Motor",`${res.pwrSel} kW`],["Status",res.velOk?"Velocity pass":"Review velocity"]];
  return <article className={`calc-project-card ${open?'open':'collapsed'}`}>
    <header className="calc-card-head" onClick={()=>setOpen(v=>!v)}>
      <div>
        <div className="calc-card-brand">Meinhardt Group · MEP Engineering · Public Health</div>
        <div className="calc-card-title">{String(idx+1).padStart(2,"0")}. {pump.name}</div>
        <div className="calc-card-meta"><span>Tag: <b>{pump.tag||'—'}</b></span><span>│</span><span>Type: {TYPE_LBL[pump.type]}</span><span>│</span><span>Pipe: {mat.label}</span><span>│</span><span>{res.config}</span><span>│</span><span className="calc-card-expand">{open?'▾ Collapse':'▸ Expand'}</span></div>
      </div>
      <div className="calc-card-project"><div className="calc-card-project-name">{proj.name}</div><div className="calc-card-project-meta">{proj.client||'—'} · Stage {proj.stage||'—'} · Rev {proj.revision||'—'}<br/>Date: {proj.date||'—'}<br/>Prepared: {proj.calcBy||'—'}{proj.calcDate?' '+proj.calcDate:''} / Checked: {proj.checkedBy||'—'}{proj.checkedDate?' '+proj.checkedDate:''} / Approved: {proj.reviewedBy||'—'}{proj.reviewedDate?' '+proj.reviewedDate:''}</div></div>
    </header>
    <div className="calc-card-body">
      <div className="calc-overview">{metrics.map(([label,value],i)=><div key={label} className={`calc-overview-metric ${i===3?'selection':''}`}><span>{label}</span><b>{value}</b></div>)}</div>
      <div className="calc-basis-card"><b>Design basis</b>{pump.headLossMethod==='DW'?'Darcy–Weisbach (Swamee–Jain friction factor)':'Hazen–Williams'} · Head safety = 1.10 · Ceiling head to 1 m · Standby pump excluded from connected load</div>
      {sections.map((section,sectionIndex)=><section key={section.title} className={`calc-section-card ${section.rows.length>6?'wide':''}`}><div className="calc-section-head"><h4>{section.title}</h4><span>{section.rows.length} item{section.rows.length===1?'':'s'}</span></div>{section.rows.map((s,rowIndex)=><div key={rowIndex} className={`calc-section-row ${s.hl?'highlight':''} ${s.flag==='warn'?'warning':''} ${s.flag==='ok'?'ok':''}`}><span className="label">{s.label}</span><span className="value">{s.value}{s.flag==='warn'?' · Exceeds limit':''}{s.flag==='ok'?' · OK':''}</span></div>)}</section>)}
      <section className="calc-duty-card"><div className="calc-section-head"><h4>Duty points</h4><span>System curve check</span></div><DutyPointTable dp={res.dutyPoints}/></section>
      <section className="calc-result-card"><div><div className="result-label">Selected pump set</div><div className="result-selection">{res.selStr}</div></div><div className="result-metrics">{[["Q",`${res.flowLsPerPump.toFixed(2)} L/s`],["H",`${res.totalH} m`],["P",`${res.pwrSel} kW`]].map(([label,value])=><div key={label}><span>{label}</span><b>{value}</b></div>)}</div></section>
    </div>
  </article>;
}

  if (!rows.length && !blocked.length) return <div style={{color:"#86868b",fontSize:13,padding:20}}>No pumps added yet.</div>;
  return (
    <>
      {blocked.map(({p,r},i)=><div key={p.id||i} style={{margin:"0 0 8px",padding:"9px 12px",background:"#fff7f7",border:"1px solid #fecaca",borderRadius:7,color:"#991b1b",fontSize:11}}><b>{p.name || 'Pump'} — excluded from schedule:</b> {r.errors.join(' ')}</div>)}
      {rows.length > 0 && <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:"var(--app-sans)"}}>

          <tr style={{background:"#1e3a5f",color:"white"}}>
            {["No.","System","Tag","Pipe (OD)","Method","Q / Pump\n(L/s)","Total Flow\n(L/s)","Total Head\n(m)","Motor\n(kW)","Arrangement","Total\nNo.","Velocity\nCheck"].map(h=>(
              <th key={h} style={{padding:"9px 12px",textAlign:"left",fontWeight:700,fontSize:9,letterSpacing:"0.06em",whiteSpace:"pre-line",lineHeight:1.4}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(({p,r},i)=>(
            <tr key={i} style={{background:i%2===0?"#f5f5f7":"white",borderBottom:"1px solid #d2d2d7"}}>
              <td style={{padding:"8px 12px",color:"#86868b",fontWeight:600}}>{i+1}</td>
              <td style={{padding:"8px 12px",fontWeight:700,color:"#1d1d1f",fontFamily:"var(--app-sans)",fontSize:11}}>{p.name}</td>
              <td style={{padding:"8px 12px",color:"#1d1d1f",fontWeight:800}}>{p.tag||"—"}</td>
              <td style={{padding:"8px 12px",color:"#86868b"}}>{(PIPE_MATERIALS[p.pipeType]||{}).label} {r.pipe.od}mm</td>
              <td style={{padding:"8px 12px",color:"#86868b"}}>{p.headLossMethod==="DW"?"D-W":"H-W"}</td>
              <td style={{padding:"8px 12px",fontWeight:800,color:"#1d1d1f",fontSize:13}}>{r.flowLsPerPump.toFixed(2)}</td>
              <td style={{padding:"8px 12px",color:"#424245"}}>{r.flowTotal.toFixed(2)}</td>
              <td style={{padding:"8px 12px",fontWeight:800,color:"#1d1d1f",fontSize:13}}>{r.totalH}</td>
              <td style={{padding:"8px 12px",fontWeight:800,color:"#1d1d1f",fontSize:13}}>{r.pwrSel}</td>
              <td style={{padding:"8px 12px",color:"#86868b"}}>{r.config}</td>
              <td style={{padding:"8px 12px",color:"#86868b"}}>{r.set.installed}</td>
              <td style={{padding:"8px 12px",fontWeight:700,color:r.velOk?"#16a34a":"#ff3b30"}}>
                {r.vel.toFixed(2)} m/s {r.velOk?"✓":"✗"}
              </td>
            </tr>
          ))}
        </tbody>
        <tfoot>
          <tr style={{background:"#f5f5f7",borderTop:"2px solid #d2d2d7"}}>
            <td colSpan={7} style={{padding:"7px 12px",fontSize:9,color:"#86868b",fontStyle:"italic"}}>
              Note: Head includes ×1.10 safety factor · CEILING(head,1m) · Standby pumps excluded from connected load
            </td>
            <td colSpan={5} style={{padding:"7px 12px",textAlign:"right",fontSize:10,color:"#86868b"}}>
              Connected (duty): <b>{rows.reduce((s,{r})=>s+r.connectedKw,0).toFixed(1)} kW</b>
              &nbsp;·&nbsp; Installed (incl. standby): {rows.reduce((s,{r})=>s+r.installedKw,0).toFixed(1)} kW
              &nbsp;·&nbsp; {rows.reduce((s,{r})=>s+r.set.installed,0)} pumps total
            </td>
          </tr>
        </tfoot>
      </table>
    </div>}
    </>
  );
}


// ─── SCHEDULE REVIEW WORKSPACE ───────────────────────────────────────────────
function scheduleReviewStatus(p, r) {
  if (!r || r.error) return {key:'blocked', label:'Blocked', reason:(r && r.errors || ['Calculation could not be completed.']).join(' ')};
  const warnings = (r.steps || []).filter(s=>s.flag==='warn').map(s=>s.label);
  if (!r.velOk || warnings.length) return {key:'review', label:'Review', reason:warnings.length ? `Check: ${warnings.join(', ')}` : 'Hydraulic velocity needs review.'};
  return {key:'pass', label:'Pass', reason:'Calculation and selected hydraulic checks pass.'};
}
function ScheduleHealthStrip({items, activeFilter, onFilter}) {
  const counts = items.reduce((a,x)=>{ a[x.status.key]=(a[x.status.key]||0)+1; return a; },{pass:0,review:0,blocked:0});
  const installed = items.filter(x=>!x.result.error).reduce((s,x)=>s+(x.result.installedKw||0),0);
  const cards = [
    {key:'all', cls:'capacity', label:'Pump systems', value:items.length, note:`${counts.pass} passing · ${counts.review+counts.blocked} attention`},
    {key:'pass', cls:'pass', label:'Passing', value:counts.pass, note:'Valid calculations'},
    {key:'review', cls:'review', label:'Needs review', value:counts.review, note:'Check warnings'},
    {key:'blocked', cls:'blocked', label:'Blocked', value:counts.blocked, note:'Resolve before export'},
    {key:'capacity', cls:'capacity', label:'Installed capacity', value:`${installed.toFixed(1)} kW`, note:'Including standby motors'},
  ];
  return <div className="schedule-health">{cards.map(c=><button key={c.key} className={`health-card ${c.cls} ${activeFilter===c.key?'on':''}`} onClick={()=>c.key!=='capacity'&&onFilter(c.key)}><div className="h-label">{c.label}</div><div className="h-value">{c.value}</div><div className="h-note">{c.note}</div></button>)}</div>;
}

function AccessPendingScreen({session, reload}) {
  const email = (session && session.user && session.user.email || '').toLowerCase();
  const [state, setState] = React.useState('loading');
  const [message, setMessage] = React.useState('Checking access request…');
  React.useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const {data, error} = await sb.from('pending_users').select('id,status,requested_at,note').eq('email', email).maybeSingle();
        if (!alive) return;
        if (error) throw error;
        if (data) {
          setState(data.status || 'pending');
          setMessage(data.status === 'rejected' ? (data.note || 'Your access request was not approved. Contact a PumpCalcTool administrator.') : 'Your access request is awaiting review by a PumpCalcTool administrator.');
          return;
        }
        const {error: insertError} = await sb.from('pending_users').insert({email, status:'pending', requested_at:new Date().toISOString()});
        if (insertError) throw insertError;
        if (alive) { setState('pending'); setMessage('Your access request has been submitted. An administrator can approve it from Team & Access.'); }
      } catch (e) {
        if (alive) { setState('error'); setMessage('Access could not be checked or requested: ' + (e.message || e)); }
      }
    })();
    return () => { alive = false; };
  }, [email]);
  const blocked = state === 'rejected' || state === 'error';
  return <div style={{minHeight:'100vh',background:'#f5f5f7',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div style={{width:'min(520px,94vw)',background:'#fff',border:'1px solid #d2d2d7',borderRadius:18,padding:'34px 36px',boxShadow:'0 12px 40px rgba(0,0,0,.08)',textAlign:'center'}}>

      <div style={{fontSize:10,fontWeight:800,letterSpacing:'.12em',textTransform:'uppercase',color:'#86868b',marginBottom:8}}>PumpCalcTool access</div>
      <h1 style={{fontSize:22,letterSpacing:'-.03em',margin:'0 0 10px',color:'#1d1d1f'}}>{state==='loading'?'Checking access…':state==='rejected'?'Access not approved':'Access request pending'}</h1>
      <p style={{fontSize:13,lineHeight:1.6,color:'#6e6e73',margin:'0 auto 18px',maxWidth:390}}>{message}</p>
      <div style={{fontSize:11,color:'#86868b',background:'#f5f5f7',borderRadius:8,padding:'9px 12px',marginBottom:18,overflowWrap:'anywhere'}}>{email}</div>
      <div style={{display:'flex',justifyContent:'center',gap:10}}>
        <button onClick={reload} style={{padding:'8px 14px',border:'1px solid #d2d2d7',background:'#fff',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>Check again</button>
        <button onClick={()=>sb.auth.signOut()} style={{padding:'8px 14px',border:'none',background:'#1d1d1f',color:'#fff',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>Sign out</button>
      </div>
    </div>
  </div>;
}

  const email = (session && session.user && session.user.email || '').toLowerCase();
  const [team, setTeam] = React.useState([]);
  const [roles, setRoles] = React.useState([]);
  const [ready, setReady] = React.useState(false);
  const [pendingCount, setPendingCount] = React.useState(0);
  const load = React.useCallback(async () => {
    setReady(false);
    const [teamRes, roleRes, pendingRes] = await Promise.all([
      sb.from('engineers').select('id,name,email,desig,initials,disc,office,is_admin,active').order('name'),
      sb.from('engineer_roles').select('id,email,role,scope,active,created_at').order('email'),
      sb.from('pending_users').select('id',{count:'exact',head:true}).eq('status','pending')
    ]);
    setTeam(teamRes.data || []);
    setRoles(roleRes.data || []);
    setPendingCount(pendingRes.count || 0);
    setReady(true);
  }, []);
  React.useEffect(() => { if (session) load(); else { setTeam([]); setRoles([]); setReady(false); } }, [load, session]);
  const me = team.find(t => (t.email||'').toLowerCase() === email) || null;
  const isAdmin = !!(me && me.active !== false && (me.is_admin || roles.some(r => r.active !== false && r.role === 'admin' && (r.email||'').toLowerCase() === email)));
  return {team, roles, me, isAdmin, ready, pendingCount, reload:load};
}
// Person + date, side by side. Falls back to a free-text input if the roster is
// empty or the stored value is someone no longer on it, so an old calc never
// loses its signature just because the person left.
function SignOff({label, who, when, onWho, onWhen, team, placeholderWho}) {
  const active = team.filter(t => t.active !== false && t.initials);
  const known  = !who || active.some(t => t.initials === who);
  return (
    <div>
      <label style={{display:"block",fontSize:10,fontWeight:700,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>{label}</label>
      <div style={{display:"flex",gap:6}}>
        {known ? (
          <select value={who||""} onChange={e=>onWho(e.target.value)}
            style={{flex:1,minWidth:0,padding:"7px 8px",border:"1px solid #d2d2d7",borderRadius:8,fontSize:12,background:"#fff",fontFamily:"inherit"}}>
            <option value="">{placeholderWho||"—"}</option>
            {active.map(t => <option key={t.id} value={t.initials}>{t.name} ({t.initials})</option>)}
          </select>
        ) : (
          <input value={who||""} onChange={e=>onWho(e.target.value)} title="Not on the current team list"
            style={{flex:1,minWidth:0,padding:"7px 8px",border:"1px solid #f0a500",borderRadius:8,fontSize:12,fontFamily:"inherit"}} />
        )}
        <input type="date" value={when||""} onChange={e=>onWhen(e.target.value)}
          style={{width:130,padding:"7px 8px",border:"1px solid #d2d2d7",borderRadius:8,fontSize:12,fontFamily:"inherit"}} />
      </div>
    </div>
  );
}

// Signed-in user block, mirroring the Resource Plan sidebar.
// Reads from THIS project's own `engineers` table (see pump-engineers.sql) —
// a periodically refreshed COPY of the Resource Plan roster, because the two
// apps are separate Supabase projects and cannot read each other's data.
// If the email is not in the copy (new joiner not yet synced) it degrades to a
// name derived from the address rather than showing nothing.
function UserBadge({session, me}) {
  const email = (session && session.user && session.user.email) || "";
  const eng = me;
  const derived = email ? email.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, c => c.toUpperCase()) : "—";
  const name  = (eng && eng.name)  || derived;
  const desig = (eng && eng.desig) || "Meinhardt Group";
  const admin = !!(eng && eng.is_admin);
  return (
    <div style={{display:"flex",alignItems:"center",gap:9,minWidth:0}} title={email}>
      <div style={{width:30,height:30,borderRadius:9,flexShrink:0,background:"linear-gradient(135deg,#007aff,#5856d6)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(0,122,255,.2)"}}>
        <span style={{fontSize:13,fontWeight:700,color:"#fff"}}>{name.charAt(0).toUpperCase()}</span>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:700,color:"#1d1d1f",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",letterSpacing:"-.02em"}}>{name}</div>
        <div style={{display:"flex",alignItems:"center",gap:5,marginTop:2,flexWrap:"wrap"}}>
          <span style={{fontSize:9,color:"#8e8e93",lineHeight:1.3}}>{desig}</span>
          <span style={{flexShrink:0,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:6,background:"rgba(0,122,255,.1)",color:"#007aff"}}>{admin?"Admin":"Team"}</span>
        </div>
      </div>
    </div>
  );
}

function App({session, projectId, projectRow, onBackToProjects, team}) {
  const userId = session.user.id;
  const [proj, setProj] = useState(projectRow.project); // shared across stages: name + client only
  const [pumps, setPumps] = useState([]);
  const [meta, setMeta]   = useState(EMPTY_META);        // PER-STAGE: revision/date/calcBy/checkedBy/reviewedBy
  const [editId, setEditId]   = useState(null);
  const [tab, _setTab]        = useState("setup");
  // Browser Back used to leave the site entirely from any in-app view, because
  // switching workspace tabs never touched history — the previous entry was
  // still whatever page the user arrived from (usually the Resource Plan).
  // Every navigation now pushes an entry, so Back walks back through the app
  // first and only leaves once there is nothing left to pop.
  const setTab = React.useCallback((next, fromPop) => {
    _setTab(prev => {
      if (next !== prev && !fromPop) {
        try { history.pushState({pumpNav:true, projectId, tab:next}, ""); } catch(e){}
      }
      return next;
    });
  }, [projectId]);
  React.useEffect(() => {
    // Seed an entry for the view we land on, so the first Back has somewhere to go.
    try { history.replaceState({pumpNav:true, projectId, tab}, ""); } catch(e){}
    const onPop = e => {
      const st = e.state;
      if (st && st.pumpNav && st.projectId === projectId && st.tab) setTab(st.tab, true);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
    // eslint-disable-next-line
  }, [projectId]);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // ── Stages — each project can hold several independent stage snapshots ──
  // Pumps AND submission meta (revision/date/calc-check-review) are stored
  // per stage, so editing one stage never touches another.
  const [stages, setStages] = useState([]);          // [{id, stage_name, sort_order}]
  const [currentStageId, setCurrentStageId] = useState(null);
  const [stagesReady, setStagesReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data: existing } = await sb.from("project_stages")
        .select("id,stage_name,sort_order").eq("project_id", projectId).order("sort_order");
      let stageList = existing||[];
      if (!stageList.length) {
        // Lazy migration: first time this project is opened under the stages model,
        // turn its old flat pump list + old shared header fields into its first stage.
        const legacyMeta = {
          revision: projectRow.project?.revision || EMPTY_META.revision,
          date: projectRow.project?.date || EMPTY_META.date,
          calcBy: projectRow.project?.calcBy || "",
          checkedBy: projectRow.project?.checkedBy || "",
          reviewedBy: projectRow.project?.reviewedBy || "",
        };
        const { data: created, error } = await sb.from("project_stages")
          .insert({ project_id:projectId, user_id:userId, stage_name: projectRow.project?.stage || "Stage 1",
            pumps: projectRow.pumps||[], meta:legacyMeta, sort_order:0 })
          .select().single();
        if (!error && created) stageList = [{id:created.id, stage_name:created.stage_name, sort_order:0}];
      }
      if (cancelled) return;
      setStages(stageList);
      const first = stageList[0];
      if (first) {
        const { data: full } = await sb.from("project_stages").select("pumps,meta").eq("id", first.id).single();
        const ps = (full && full.pumps) || [];
        if (ps.length) _id = Math.max(_id, ...ps.map(p=>p.id)) + 1;
        setCurrentStageId(first.id);
        setPumps(ps);
        setMeta({...EMPTY_META, ...(full && full.meta)});
        setEditId(ps[0]?.id ?? null);
        setTab(ps.length ? "schedule" : "setup");
      }
      setStagesReady(true);
    })();
    return () => { cancelled = true; };
  }, [projectId]);

  // ── Supabase autosave — project header (name/client only, shared) ───────
  const [saveStatus, setSaveStatus] = useState("saved"); // saving | saved | error
  const projDebounceRef  = useRef(null);
  const mountedProjRef   = useRef(false);

  useEffect(() => {
    if (!mountedProjRef.current) { mountedProjRef.current = true; return; }
    setSaveStatus("saving");
    if (projDebounceRef.current) clearTimeout(projDebounceRef.current);
    projDebounceRef.current = setTimeout(async () => {
      const { error } = await sb.from("pump_projects")
        .update({ name: proj.name||"Untitled Project", project:proj })
        .eq("id", projectId);
      setSaveStatus(error ? "error" : "saved");
      if (error) console.error(error);
    }, 1000);
    return () => {
      if (projDebounceRef.current) {
        clearTimeout(projDebounceRef.current); projDebounceRef.current = null;
        sb.from("pump_projects").update({ name: proj.name||"Untitled Project", project:proj }).eq("id", projectId);
      }
    };
  }, [proj, projectId]);

  // ── Supabase autosave — pumps + meta, scoped to the active stage only ───
  const pumpsDebounceRef = useRef(null);

  useEffect(() => {
    if (!stagesReady || !currentStageId) return;
    setSaveStatus("saving");
    if (pumpsDebounceRef.current) clearTimeout(pumpsDebounceRef.current);
    pumpsDebounceRef.current = setTimeout(async () => {
      const { error } = await sb.from("project_stages").update({ pumps, meta }).eq("id", currentStageId);
      setSaveStatus(error ? "error" : "saved");
      if (error) console.error(error);
    }, 1000);
    return () => {
      if (pumpsDebounceRef.current) {
        clearTimeout(pumpsDebounceRef.current); pumpsDebounceRef.current = null;
        sb.from("project_stages").update({ pumps, meta }).eq("id", currentStageId);
      }
    };
  }, [pumps, meta, currentStageId, stagesReady]);

  const flushPumpsSave = async () => {
    if (pumpsDebounceRef.current) { clearTimeout(pumpsDebounceRef.current); pumpsDebounceRef.current=null; }
    if (currentStageId) await sb.from("project_stages").update({ pumps, meta }).eq("id", currentStageId);
  };

  const switchStage = async (id) => {
    if (id === currentStageId) return;
    await flushPumpsSave();
    const { data } = await sb.from("project_stages").select("pumps,meta").eq("id", id).single();
    const ps = (data && data.pumps) || [];
    if (ps.length) _id = Math.max(_id, ...ps.map(p=>p.id)) + 1;
    setCurrentStageId(id);
    setPumps(ps);
    setMeta({...EMPTY_META, ...(data && data.meta)});
    setEditId(ps[0]?.id ?? null);
  };

  const addStage = async () => {
    const name = window.prompt("New stage name (e.g. Concept, SD, DD, CD, IFC):", "");
    if (!name) return;
    const duplicate = window.confirm(`Start "${name}" as a copy of the current stage's pumps?\n\nOK = copy current pumps · Cancel = start empty`);
    await flushPumpsSave();
    const newPumps = duplicate ? pumps.map(p=>({...p, id:_id++})) : [];
    const newMeta = {...meta}; // carry forward calc/check/review team; revision left as-is for user to bump
    const maxSort = stages.reduce((m,s)=>Math.max(m, s.sort_order||0), -1);
    const { data, error } = await sb.from("project_stages")
      .insert({ project_id:projectId, user_id:userId, stage_name:name, pumps:newPumps, meta:newMeta, sort_order:maxSort+1 })
      .select().single();
    if (error) { alert("Could not create stage: "+error.message); return; }
    setStages(s=>[...s, {id:data.id, stage_name:name, sort_order:maxSort+1}]);
    setCurrentStageId(data.id);
    setPumps(newPumps);
    setMeta(newMeta);
    setEditId(newPumps[0]?.id ?? null);
  };

  const renameStage = async (stg) => {
    const name = window.prompt("Rename stage:", stg.stage_name);
    if (!name || name===stg.stage_name) return;
    const { error } = await sb.from("project_stages").update({stage_name:name}).eq("id", stg.id);
    if (error) { alert("Rename failed: "+error.message); return; }
    setStages(s=>s.map(x=>x.id===stg.id ? {...x, stage_name:name} : x));
  };

  const deleteStage = async (stg) => {
    if (stages.length<=1) { alert("A project needs at least one stage."); return; }
    if (!window.confirm(`Delete stage "${stg.stage_name}"? This cannot be undone.`)) return;
    const { error } = await sb.from("project_stages").delete().eq("id", stg.id);
    if (error) { alert("Delete failed: "+error.message); return; }
    const remaining = stages.filter(x=>x.id!==stg.id);
    setStages(remaining);
    if (stg.id===currentStageId && remaining.length) {
      const next = remaining[0];
      const { data } = await sb.from("project_stages").select("pumps,meta").eq("id", next.id).single();
      const ps = (data && data.pumps) || [];
      setCurrentStageId(next.id); setPumps(ps); setMeta({...EMPTY_META, ...(data && data.meta)}); setEditId(ps[0]?.id ?? null);
    }
  };

  const signOut = () => sb.auth.signOut();

  const addPump = type => { const p={id:_id++,...DEFS[type]}; setPumps(ps=>[...ps,p]); setEditId(p.id); setTab("pumps"); };
  const delPump = id   => setPumps(ps=>ps.filter(p=>p.id!==id));
  const updPump = useCallback(u=>setPumps(ps=>ps.map(p=>p.id===u.id?u:p)),[]);
  const editing = pumps.find(p=>p.id===editId);
  const currentStage = stages.find(s=>s.id===currentStageId);
  // Combined object handed to CalcSheet/SummaryTable for print headers — merges
  // the shared project info with this stage's own revision/date/sign-off fields.
  // Stage value wins; blank falls back to the project default. Everything that
  // exports or prints reads this one object, so the sheet, the Excel title
  // block and the on-screen cards can never disagree about who signed.
  const projForDisplay = {...proj, stage: currentStage?.stage_name, revision:meta.revision, date:meta.date,
    calcBy:      meta.calcBy      || proj.calcBy      || "",
    calcDate:    meta.calcDate    || proj.calcDate    || "",
    checkedBy:   meta.checkedBy   || proj.checkedBy   || "",
    checkedDate: meta.checkedDate || proj.checkedDate || "",
    reviewedBy:  meta.reviewedBy  || proj.reviewedBy  || "",
    reviewedDate:meta.reviewedDate|| proj.reviewedDate|| ""};

  if (!stagesReady) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#86868b",fontSize:13}}>Loading project…</div>;
  }

  const btnStyle = (k) => ({
    padding:"10px 22px", fontSize:13, fontWeight:700, cursor:"pointer",
    border:"none", outline:"none",
    borderBottom: tab===k?"3px solid #007aff":"3px solid transparent",
    color: tab===k?"#007aff":"#86868b",
    background: tab===k?"#e8f0fe":"transparent",
    transition:"all 0.15s",
  });

  return (
    <div className="global-page" style={{minHeight:"100vh",background:"#f5f5f7"}}>
      <div className="pump-shell">
        <aside className={`pump-sidebar no-print ${sidebarOpen?"open":""}`}>
          <div className="pump-sidebar-brand">
            <div className="brand-mark"><div className="brand-icon">▥</div><div><h1>Pump Sizing Calculator</h1><p>MEP Engineering · Meinhardt Group</p></div></div>
          </div>
          <div className="sidebar-project">
            <div className="sidebar-project-label">Active project</div>
            <div className="sidebar-project-name">{proj.name||"Untitled Project"}</div>
            <div className="sidebar-project-meta">{proj.client||"No client"}<br/>Stage {projForDisplay.stage||"—"} · Rev {projForDisplay.revision||"—"}<br/>{projForDisplay.date||"—"}</div>
          </div>
          <div className="sidebar-nav">
            <button className="sidebar-nav-button" onClick={()=>{onBackToProjects();setSidebarOpen(false);}}><span className="sidebar-nav-icon">←</span>All Projects</button>
          </div>
          <div className="sidebar-section-label">Stage</div>
          <div className="sidebar-stage">
            <label>Active design stage</label>
            <select value={currentStageId||""} onChange={e=>switchStage(e.target.value)}>{stages.map(stg=><option key={stg.id} value={stg.id}>{stg.stage_name}</option>)}</select>
            <div className="sidebar-stage-actions"><button onClick={addStage} title="New stage">+ New</button><button onClick={()=>currentStage&&renameStage(currentStage)} title="Rename stage">Rename</button>{stages.length>1 && <button onClick={()=>currentStage&&deleteStage(currentStage)} title="Delete stage">Delete</button>}</div>
          </div>
          <div className="sidebar-section-label">Workspace</div>
          <nav className="sidebar-nav">
            {[["setup","⚙","Setup"],["pumps","⊕","Pump Inputs"],["schedule","▤","Pump Schedule"],["print","◈","Calculation Sheets"]].map(([key,icon,label])=><button key={key} className={`sidebar-nav-button ${tab===key?"active":""}`} onClick={()=>{setTab(key);setSidebarOpen(false);}}><span className="sidebar-nav-icon">{icon}</span>{label}{key==="pumps"&&<span className="sidebar-nav-pill">{pumps.length}</span>}</button>)}
          </nav>
          <div className="sidebar-status"><span className={`sidebar-status-dot ${saveStatus==="saving"?"saving":saveStatus==="error"?"error":""}`}/>{saveStatus==="saving"?"Saving…":saveStatus==="error"?"Save failed":"All changes saved"}</div>
          <div className="sidebar-actions">
            <button className="sidebar-action export" onClick={()=>exportWorkbook(projForDisplay, pumps, currentStage?.stage_name||"")}>↓ Export Excel</button>
            <button className="sidebar-action print" onClick={()=>window.print()}>▣ Print / PDF</button>
            <button className="sidebar-signout full" onClick={signOut}>Sign out</button>
          </div>
        </aside>
        <div className={`sidebar-backdrop no-print ${sidebarOpen?"open":""}`} onClick={()=>setSidebarOpen(false)}/>
        <main className="pump-main">
          <div className="pump-mobile-bar no-print"><button className="pump-mobile-menu" onClick={()=>setSidebarOpen(true)} aria-label="Open navigation">☰</button><div className="pump-mobile-title">{proj.name||"Pump Sizing Calculator"}</div><div className="pump-mobile-save">{saveStatus==="saving"?"Saving…":saveStatus==="error"?"Error":"Saved"}</div></div>
          <div className="app-content sidebar-content" style={{maxWidth: tab==="pumps" ? 1560 : 1180, margin:"0 auto", padding:"20px 24px"}}>

        {/* ── PROJECT SETUP ── */}
        {tab==="setup" && (
          <>
          <div style={{background:"white",borderRadius:16,border:"1px solid #d2d2d7",padding:28,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:11,fontWeight:800,color:"#1d1d1f",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:20}}>Project Information <span style={{color:"#86868b",fontWeight:600,textTransform:"none"}}>— shared across all stages</span></div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:16}}>
              <Field label="Project Name" value={proj.name}   onChange={v=>setProj(p=>({...p,name:v}))} />
              <Field label="Client"       value={proj.client} onChange={v=>setProj(p=>({...p,client:v}))} />
              <SignOff label="Default prepared by" team={team} who={proj.calcBy} when={proj.calcDate}
                onWho={v=>setProj(p=>({...p,calcBy:v}))} onWhen={v=>setProj(p=>({...p,calcDate:v}))} />
              <SignOff label="Default checked by" team={team} who={proj.checkedBy} when={proj.checkedDate}
                onWho={v=>setProj(p=>({...p,checkedBy:v}))} onWhen={v=>setProj(p=>({...p,checkedDate:v}))} />
              <SignOff label="Default approved by" team={team} who={proj.reviewedBy} when={proj.reviewedDate}
                onWho={v=>setProj(p=>({...p,reviewedBy:v}))} onWhen={v=>setProj(p=>({...p,reviewedDate:v}))} />
            </div>
          </div>

          <div style={{background:"white",borderRadius:16,border:"1px solid #d2d2d7",padding:28,marginTop:20,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:11,fontWeight:800,color:"#1d1d1f",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:20}}>
              Stage Submission Info <span style={{color:"#86868b",fontWeight:600,textTransform:"none"}}>— only for "{currentStage?.stage_name}"</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:16}}>
              <Field label="Revision"    value={meta.revision}   onChange={v=>setMeta(m=>({...m,revision:v}))} />
              <Field label="Date" type="date" value={meta.date} onChange={v=>setMeta(m=>({...m,date:v}))} />
            </div>
            {/* Leaving a signature blank inherits the project default set in
                Project Info above — so the common case needs filling in once,
                and a stage that was checked by someone else can still override. */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginTop:16}}>
              <SignOff label="Prepared by" team={team}
                placeholderWho={proj.calcBy ? "Project default ("+proj.calcBy+")" : "—"}
                who={meta.calcBy} when={meta.calcDate}
                onWho={v=>setMeta(m=>({...m,calcBy:v}))} onWhen={v=>setMeta(m=>({...m,calcDate:v}))} />
              <SignOff label="Checked by" team={team}
                placeholderWho={proj.checkedBy ? "Project default ("+proj.checkedBy+")" : "—"}
                who={meta.checkedBy} when={meta.checkedDate}
                onWho={v=>setMeta(m=>({...m,checkedBy:v}))} onWhen={v=>setMeta(m=>({...m,checkedDate:v}))} />
              <SignOff label="Approved by" team={team}
                placeholderWho={proj.reviewedBy ? "Project default ("+proj.reviewedBy+")" : "—"}
                who={meta.reviewedBy} when={meta.reviewedDate}
                onWho={v=>setMeta(m=>({...m,reviewedBy:v}))} onWhen={v=>setMeta(m=>({...m,reviewedDate:v}))} />
            </div>
            <div style={{marginTop:22,padding:"14px 18px",background:"#f5f5f7",border:"1px solid #d2d2d7",borderRadius:10,fontSize:11,color:"#424245",lineHeight:1.7}}>
              <b>Reference Data In This Tool:</b> Pipe materials — HDPE SDR-11, PPR SDR-7.4, UPVC Pressure PN16, GI (BS 1387 Medium), Carbon Steel Sch-40 (ASME B36.10).
              Head loss — Hazen-Williams or Darcy-Weisbach (Swamee-Jain friction factor), selectable per pump.
              Pump systems — Tank Recirculation, Filter Feed, Transfer, HEX Circulation, Booster, Sewage/Drainage, Irrigation.
              <br/><i>Note: GI and UPVC pipe dimensions are indicative catalogue values — verify against the manufacturer's current data sheet before issuing for construction.</i>
            </div>
            <div style={{display:"flex",gap:10,marginTop:22}}>
              <button onClick={()=>setTab("pumps")}
                style={{padding:"10px 28px",background:"#007aff",color:"white",border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer"}}>
                Next: Configure Pumps →
              </button>
            </div>
          </div>
          </>
        )}

        {/* ── PUMP INPUTS ── */}
        {tab==="pumps" && (
          <div style={{display:"flex",gap:16,alignItems:"flex-start"}}>
            {/* Pump list */}
            <div style={{width:190,flexShrink:0}}>
              <div style={{fontSize:9,fontWeight:800,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Pumps in Stage</div>
              {pumps.map(p=>(
                <div key={p.id} onClick={()=>setEditId(p.id)}
                  style={{cursor:"pointer",borderRadius:8,marginBottom:5,padding:"7px 10px",transition:"all 0.15s",
