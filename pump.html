// Fit-to-width page preview. The issue sheet is laid out at A4 width (210mm =
// 794px at 96dpi); this scales it down so the whole page is visible in the
// pane instead of overflowing. Scaled elements still reserve their UNSCALED
// box, so the page is taken out of flow and the wrapper is given the scaled
// height explicitly — otherwise there would be a large empty gap below it.
//
// Every one of these rules is reverted under @media print (see .ppreview in
// the stylesheet): printing must emit the sheet at true A4, unscaled.
function PrintPreview({children, active, measureKey}) {
  const A4 = 794;
  const boxRef = React.useRef(null);
  const pageRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const [h, setH] = React.useState(0);
  React.useLayoutEffect(() => {
    const box = boxRef.current, page = pageRef.current;
    if (!box || !page) return;
    const fit = () => {
      const w = box.clientWidth || A4;
      const sc = Math.min(1, w / A4);
      setScale(sc);
      setH(page.scrollHeight * sc);
    };
    fit();
    let ro;
    if (typeof ResizeObserver !== "undefined") { ro = new ResizeObserver(fit); ro.observe(box); }
    window.addEventListener("resize", fit);
    // Content height changes after fonts/images settle, so re-measure shortly after.
    const t = setTimeout(fit, 350);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", fit); clearTimeout(t); };
  }, [active, measureKey]);
  return (
    <div className="ppreview" ref={boxRef} style={{height: h || undefined}}>
      <div className="ppreview-page" ref={pageRef} style={{width: A4, transform: "scale("+scale+")"}}>
        {children}
      </div>
    </div>
  );
}

function formulaTraceForPump(p,res) {
  const safety = Number(res.safetyPct)||0;
  const flowFormula = p.type==='custom' ? `Q = ${p.flowFormula}${(p.flowUnit&&p.flowUnit!=='L/s')?` [${p.flowUnit} → L/s]`:''}` : p.type==='rcp' ? 'Q = V × recirculation % × 1000 ÷ t ÷ 3600' :
    (p.type==='ffp'||p.type==='tp') ? 'Q = V × 1000 ÷ t ÷ 3600' :
    p.type==='hex' ? 'Q = Cooling capacity ÷ (4.18 × ΔT)' :
    p.type==='sewage'&&p.flowMode==='population' ? 'Q = Population × lpcd × peak factor ÷ 86400' :
    p.type==='irrigation'&&p.flowMode==='area' ? 'Q = Area × application rate ÷ 3600' :
    p.type==='booster'&&isFuMode(p)&&FU_CODES[fuOf(p).code] ? `Q = ${FU_CODES[fuOf(p).code].unit} → flow, ${FU_CODES[fuOf(p).code].ref} (linear interpolation)` : 'Q = direct design input';
  const isDirect = (p.type==='booster'&&(p.flowMode||'direct')==='direct')||(p.type==='sewage'&&p.flowMode!=='population')||(p.type==='irrigation'&&p.flowMode!=='area');
  const vMax = Number(p.maxVelocity);
  const crit = res.crit||'velocity', useV = crit!=='pressure', useP = crit!=='velocity';
  const vOk = !useV || v2(res.velDesign)<=vMax;
  const pOk = !useP || res.gradOk;
  const sizeSteps = [
    ...(useV?[{purpose:'Calculate required internal diameter',formula:'Di = √(4Q ÷ πv)',result:`${res.reqDi.toFixed(1)} mm`,note:'Required diameter at the approved maximum velocity. Pipe velocity is checked at 0.01 m/s precision.'}]:[]),
    {purpose:'Select approved pipe size',
     formula: crit==='velocity' ? 'Select first approved pipe with internal diameter ≥ Di'
            : crit==='pressure' ? `Select first approved pipe with friction loss ≤ ${res.maxLoss} Pa/m`
            : `Select first approved pipe with ID ≥ Di and friction loss ≤ ${res.maxLoss} Pa/m`,
     result:`${res.pipe.od} mm OD${res.pipe.wall!==undefined?` × ${res.pipe.wall} mm wall`:""} × ${res.pipe.id} mm ID`,
     note:`From the approved ${(matOf(res.matKey)||{}).label} schedule. Size governed by ${res.governs}.`},
    {purpose:'Check actual pipe velocity',formula:'v = Q ÷ (πD² ÷ 4)',
     result:(safety>0?`Peak ${res.velPeak.toFixed(2)} / design ${res.velDesign.toFixed(2)} m/s`:`${res.velDesign.toFixed(2)} m/s`)+(useV?` ${vOk?'≤':'>'} ${vMax.toFixed(2)} ${vOk?'✓':'✗'}`:''),
     note:useV?(vOk?'Within the maximum velocity.':'Exceeds the maximum velocity — review pipe size.'):'Reported for information; velocity is not a sizing limit for this pump.'},
    {purpose:'Check friction gradient',formula:'i = hf ÷ L  (Pa/m = m/m × ρg)',
     result:`${res.gradDesign.toFixed(0)} Pa/m`+(useP?` ${pOk?'≤':'>'} ${res.maxLoss} ${pOk?'✓':'✗'}`:''),
     note:useP?(pOk?'Within the maximum friction loss.':'Exceeds the maximum friction loss — review pipe size.'):'Reported for information; friction loss is not a sizing limit for this pump.'},
  ];
  const method = p.headLossMethod==='DW' ? 'hf = f × (L / D) × (v² / 2g)' : 'hf = 10.7 × (Q / C)^1.852 × L ÷ D^4.87';
  return [
    {purpose:'Determine system flow',formula:flowFormula,result:`${res.flowTotal.toFixed(2)} L/s`,note:(()=>{ const ex=p.type==='booster'&&isFuMode(p)?fuExtrapInfo(p):null;
      const base=isDirect?'':'Flow is rounded up to the nearest 0.1 L/s by the calculation engine.';
      return ex?`EXTRAPOLATED: ${fuOf(p).units} ${ex.code.unit} exceeds the ${ex.code.label} table maximum (${ex.max} ${ex.code.unit} = ${ex.maxFlow.toFixed(2)} L/s). Flow extended linearly along the last table segment; not a code value. `+base:base; })()},
    ...(safety>0?[{purpose:'Apply flow safety factor',formula:`Qdesign = Qtotal × (1 + ${safety}/100)`,result:`${res.designFlow.toFixed(2)} L/s`,note:'Applies to the design flow used for duty and head-loss calculations.'}]:[]),
    {purpose:'Determine flow per duty pump',formula:res.set.sharing==='full'?'Qpump = Qdesign (Duty / Standby)':'Qpump = Qdesign ÷ number of duty pumps (Duty / Assist)',result:`${res.flowLsPerPump.toFixed(2)} L/s`,note:`${res.config}; ${res.set.installed} pumps installed.`},
    ...sizeSteps,
    {purpose:'Calculate pipe friction loss',formula:method,result:`${res.hf.toFixed(4)} m`,note:`${p.headLossMethod==='DW'?'Darcy-Weisbach with Swamee-Jain friction factor':'Hazen-Williams'} at design flow.`},
    {purpose:'Calculate fittings and valve loss',formula:`hfittings = hf × ${Number(p.fittingsPct)||0} ÷ 100`,result:`${res.hf_fit.toFixed(4)} m`,note:'Allowance applied to the calculated straight-pipe friction loss.'},
    {purpose:'Calculate total pump head',formula:'Htotal = (Static + residual + friction + fittings + equipment) × 1.10, rounded up',result:`${res.totalH.toFixed(0)} m`,note:'Includes 10% head safety margin.'},
    {purpose:'Calculate pump shaft power',formula:'Ps = Q × 9.81 × H ÷ ηp',result:`${res.pwrShaft.toFixed(3)} kW`,note:`Pump efficiency ηp = ${(Number(p.pumpEff)*100).toFixed(0)}%.`},
    {purpose:'Apply motor margin',formula:`Pm = Ps × (1 + ${res.motorMarginPct}/100)`,result:`${res.pwrReq.toFixed(3)} kW`,note:'Required motor output rating.'},
    {purpose:'Select approved motor size',formula:'Select first approved motor rating ≥ Pm',result:`${res.pwrSel} kW`,note:`Electrical input at duty = Ps ÷ ηm = ${res.pwrInput.toFixed(2)} kW (ηm = ${(Number(p.motorEff)*100).toFixed(0)}%).`},
  ];
}

// ISSUE DOCUMENT MODEL  —  ONE definition, THREE outputs
// ══════════════════════════════════════════════════════════════════════════
// The screen preview, printed PDF, and Excel workbook are all derived from the
// object returned here. Keeping content and ordering in one model reduces drift
// between outputs; add a section to `sections` to include it in every renderer.
//
// Renderers:  IssueSheet()      -> React  (screen + print/PDF)
//             writeCalcBlock()  -> ExcelJS (per-calc sheets + combined)
function buildIssueDoc(proj, pump, meta, stageName) {
  const res = safeCalculate(pump);
  if (!res || res.error) {
    return {blocked:true,
      title: (pump.name || 'Pump'),
      errors: (res && res.errors) || ['Calculation could not be produced.']};
  }
  const title = (pump.name || TYPE_LBL[pump.type] || 'Calculation') + (pump.tag ? ' \u2014 ' + pump.tag : '');
  const closure = closureOf(meta);
  return {
    blocked: false,
    project: proj.name || '\u2014',
    title,
    // Header cells. Same four in the same order everywhere.
    headerCells: [
      {label:'Revision',        value: proj.revision || '01'},
      {label:'Stage',           value: stageName || '\u2014'},
      {label:'Prepared / Date', value: (proj.calcBy || '\u2014') + (proj.calcDate ? ' \u00b7 ' + proj.calcDate : '')},
      {label:'Checked / Approved', value: (proj.checkedBy || '\u2014') + ' / ' + (proj.reviewedBy || '\u2014')}
    ],
    meta: {client: proj.client || '\u2014', stage: stageName || '\u2014'},
    sections: [
      {kind:'list',  title:'Design Basis Statement',
       items: basisOf(proj, meta, pump)},
      {kind:'table', title:'Parameters Used',
       head:['Parameter','Value used','Unit','Basis / Source'],
       rows: issueParamRows(pump, res),
       align:['left','right','left','left']},
      {kind:'table', title:'Calculation Trace \u2014 Method, Formula and Result',
       head:['Step','Purpose','Formula','Result'],
       rows: formulaTraceForPump(pump, res).map((t, i) =>
              [String(i+1), t.purpose + (t.note ? '\n' + t.note : ''), t.formula, t.result]),
       align:['left','left','left','right'], mono:[2], strong:[3]},
      {kind:'result', label:'Final selection', value: res.selStr || '\u2014'}
    ],
    closure: closure.status === 'closed' ? closure : null,
    // Anything not formally closed is a draft and is marked as such on every output.
    watermark: closure.status === 'closed' ? null : ('DRAFT \u2014 NOT FOR ISSUE \u00b7 ' + stageStatusLabel(meta).toUpperCase())
  };
}

                      style={{whiteSpace:'pre-line'}}>{v}</td>))}

  }

  return <div className="wf no-print">
    <div className="wf-top"><h3>Sign-off · Rev {meta.revision||'01'}</h3><span className={`stage-status ${draft?'draft':status}`}>{stageStatusLabel(meta)}</span></div>
    <ol className="wf-steps">
      <li className={meta.calcBy?'done':''}><b>Prepared</b><span>{meta.calcBy?nameOf(meta.calcBy):'Not set'}</span></li>

      <li className={closed?'done':(awaiting?'now':'')}><b>Associate / Approver</b><span>{closed?`${c.mep_lead_signed_by||c.closed_by||''} · ${fmtDay(c.closed_at)}`:'Pending'}</span></li>
    </ol>
    {draft && c.returned && <div className="wf-note warn"><b>Returned by {c.returned.by}</b> · {fmtWhen(c.returned.at)}<br/>{c.returned.comment}</div>}
    {draft && c.reopen_reason && !c.returned && <div className="wf-note"><b>Reopened by {c.reopened_by||'Admin'}</b> · {fmtWhen(c.reopened_at)}<br/>{c.reopen_reason}</div>}
    <div className="wf-actions">
      {draft && isDiscLead && <button disabled={busy||!!leadBlock} onClick={onLead} style={btn('#1559a6','#fff')}>Lead sign-off</button>}
      {awaiting && isApprover && <>
        <button disabled={busy||!!approverBlock} onClick={onApprover} style={btn('#16803a','#fff')}>Sign &amp; close</button>
        <button disabled={busy} onClick={onReturn} style={btn('#fff','#a76200','1px solid #f5c27a')}>Return</button>
      </>}
      {closed && isAdmin && <button disabled={busy} onClick={onReopen} style={btn('#fff','#b91c1c','1px solid #fca5a5')}>Reopen as new revision</button>}
    </div>
    {draft && isDiscLead && leadBlock && <div className="wf-why">{leadBlock}</div>}
    {draft && !isDiscLead && <div className="wf-why">Waiting for a Discipline Lead to sign.</div>}
    {awaiting && !isApprover && <div className="wf-why">Locked — waiting for Approver sign-off.</div>}
    {awaiting && approverBlock && <div className="wf-why">{approverBlock}</div>}
    {hist.length>0 && <details className="wf-hist"><summary>History ({hist.length})</summary>
      <ul>{hist.slice().reverse().map((h,i)=><li key={i}><b>{h.action}</b> — {h.by||h.email} · {fmtWhen(h.at)}{h.note?<em>“{h.note}”</em>:null}</li>)}</ul>
    </details>}
  </div>;
}
function LockedNotice() { return <div style={{marginBottom:12,padding:'9px 11px',background:'#fff4e0',border:'1px solid #fed7aa',borderRadius:8,fontSize:11,color:'#9a3412'}}>This stage is under formal review or closed. Calculation inputs and stage submission data are read-only. Only an administrator can reopen a closed stage.</div>; }

>)}</div>{status&&<div style={{marginTop:8,fontSize:10,color:/unavailable|could not/i.test(status)?'#b91c1c':'#16803a'}}>{status}</div>}</div>;

function AccessPendingScreen({session, reload}) {
  const email = (session && session.user && session.user.email || '').toLowerCase();
  const [state, setState] = React.useState('loading');
  const [message, setMessage] = React.useState('Checking access request…');
  React.useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const {data, error} = await sb.from('pending_users').select('id,status,requested_at,note').eq('email', email).maybeSingle();
        if (!alive) return;
        if (error) throw error;
        if (data) {
          setState(data.status || 'pending');
          setMessage(data.status === 'rejected' ? (data.note || 'Your access request was not approved. Contact a PumpCalcTool administrator.') : 'Your access request is awaiting review by a PumpCalcTool administrator.');
          return;
        }
        const {error: insertError} = await sb.from('pending_users').insert({email, status:'pending', requested_at:new Date().toISOString()});
        if (insertError) throw insertError;
        if (alive) { setState('pending'); setMessage('Your access request has been submitted. An administrator can approve it from Team & Access.'); }
      } catch (e) {
        if (alive) { setState('error'); setMessage('Access could not be checked or requested: ' + (e.message || e)); }
      }
    })();
    return () => { alive = false; };
  }, [email]);
  const blocked = state === 'rejected' || state === 'error';
  return <div style={{minHeight:'100vh',background:'#f5f5f7',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div style={{width:'min(520px,94vw)',background:'#fff',border:'1px solid #d2d2d7',borderRadius:18,padding:'34px 36px',boxShadow:'0 12px 40px rgba(0,0,0,.08)',textAlign:'center'}}>
      <div style={{width:52,height:52,borderRadius:14,margin:'0 auto 18px',background:blocked?'#fff0ee':'#e8faf0',color:blocked?'#c2410c':'#16803a',display:'flex',alignItems:'center',justifyContent:'center',fontSize:23,fontWeight:800}}>{blocked?'!':'✓'}</div>
      <div style={{fontSize:10,fontWeight:800,letterSpacing:'.12em',textTransform:'uppercase',color:'#86868b',marginBottom:8}}>MEP Calculator access</div>
      <h1 style={{fontSize:22,letterSpacing:'-.03em',margin:'0 0 10px',color:'#1d1d1f'}}>{state==='loading'?'Checking access…':state==='rejected'?'Access not approved':'Access request pending'}</h1>
      <p style={{fontSize:13,lineHeight:1.6,color:'#6e6e73',margin:'0 auto 18px',maxWidth:390}}>{message}</p>
      <div style={{fontSize:11,color:'#86868b',background:'#f5f5f7',borderRadius:8,padding:'9px 12px',marginBottom:18,overflowWrap:'anywhere'}}>{email}</div>
      <div style={{display:'flex',justifyContent:'center',gap:10}}>
        <button onClick={reload} style={{padding:'8px 14px',border:'1px solid #d2d2d7',background:'#fff',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>Check again</button>
        <button onClick={()=>sb.auth.signOut()} style={{padding:'8px 14px',border:'none',background:'#1d1d1f',color:'#fff',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>Sign out</button>
      </div>
    </div>
  </div>;
}

0px',gap:8,padding:'10px 12px',background:'#f5f5f7',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em',color:'#86868b'}}><div>Person</div><div>Email</div><div>Role</div><div>Scope</div><div></div></div>{roleRows.filter(r=>r.active!==false).map(r=>{const person=rows.find(x=>(x.email||'').toLowerCase()===(r.email||'').toLowerCase());return <div key={r.id} style={{display:'grid',gridTemplateColumns:'1.2fr 1.4fr 150px 140px 80px',gap:8,padding:'9px 12px',borderTop:'1px solid #f0f0f2',alignItems:'center',fontSize:12}}><div style={{fontWeight:700,color:'#1d1d1f'}}>{person?.name||'—'}</div><div style={{color:'#6e6e73',overflowWrap:'anywhere'}}>{r.email}</div><div>{pill(r.role)}</div><div style={{color:'#6e6e73'}}>{r.scope||'global'}</div><div>{canEdit&&<button disabled={busy||(r.role==='admin'&&(r.email||'').toLowerCase()===currentEmail)} onClick={()=>removeRole(r)} style={{padding:'4px 8px',border:'none',background:'transparent',color:'#b91c1c',fontSize:10,fontWeight:800,cursor:'pointer'}}>Remove</button>}</div></div>})}</div></div></div>}
    </div>
  </div>;
}
const IN = {width:'100%',minWidth:0,padding:'5px 7px',border:'1px solid #d2d2d7',borderRadius:6,fontSize:11,fontFamily:'inherit'};

// ── TEAM ────────────────────────────────────────────────────────────────────
// One fetch of the roster, shared by the badge, the sign-off dropdowns and the
// Team admin screen. Initials are what land on the calculation sheet, so the
// dropdowns show "Name (INI)" — picking the person, storing the initials.
const TeamCtx = React.createContext({team:[], me:null, reload:()=>{}});
function useTeamData(session) {
  const email = (session && session.user && session.user.email || '').toLowerCase();
  const [team, setTeam] = React.useState([]);
  const [roles, setRoles] = React.useState([]);
  const [ready, setReady] = React.useState(false);
  const [pendingCount, setPendingCount] = React.useState(0);
  const load = React.useCallback(async () => {
    setReady(false);
    const [teamRes, roleRes, pendingRes] = await Promise.all([
      sb.from('engineers').select('id,name,email,desig,initials,disc,office,is_admin,active').order('name'),
      sb.from('engineer_roles').select('id,email,role,scope,active,created_at').order('email'),
      sb.from('pending_users').select('id',{count:'exact',head:true}).eq('status','pending')
    ]);
    setTeam(teamRes.data || []);
    setRoles(roleRes.data || []);
    setPendingCount(pendingRes.count || 0);
    setReady(true);
  }, []);
  React.useEffect(() => { if (session) load(); else { setTeam([]); setRoles([]); setReady(false); } }, [load, session]);
  const me = team.find(t => (t.email||'').toLowerCase() === email) || null;
  const isAdmin = !!(me && me.active !== false && (me.is_admin || roles.some(r => r.active !== false && r.role === 'admin' && (r.email||'').toLowerCase() === email)));
  return {team, roles, me, isAdmin, ready, pendingCount, reload:load};
}
// Person + date, side by side. Falls back to a free-text input if the roster is
// empty or the stored value is someone no longer on it, so an old calc never
// loses its signature just because the person left.
function SignOff({label, who, when, onWho, onWhen, team, placeholderWho}) {
  const active = team.filter(t => t.active !== false && t.initials);
  const known  = !who || active.some(t => t.initials === who);
  return (
    <div>
      <label style={{display:"block",fontSize:10,fontWeight:700,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>{label}</label>
      <div style={{display:"flex",gap:6}}>
        {known ? (
          <select value={who||""} onChange={e=>onWho(e.target.value)}
            style={{flex:1,minWidth:0,padding:"7px 8px",border:"1px solid #d2d2d7",borderRadius:8,fontSize:12,background:"#fff",fontFamily:"inherit"}}>
            <option value="">{placeholderWho||"—"}</option>
            {active.map(t => <option key={t.id} value={t.initials}>{t.name} ({t.initials})</option>)}
          </select>
        ) : (
          <input value={who||""} onChange={e=>onWho(e.target.value)} title="Not on the current team list"
            style={{flex:1,minWidth:0,padding:"7px 8px",border:"1px solid #f0a500",borderRadius:8,fontSize:12,fontFamily:"inherit"}} />
        )}
        <input type="date" value={when||""} onChange={e=>onWhen(e.target.value)}
          style={{width:130,padding:"7px 8px",border:"1px solid #d2d2d7",borderRadius:8,fontSize:12,fontFamily:"inherit"}} />
      </div>
    </div>
  );
}

// Read-only signature box. Written only by the sign-off workflow, so the sheet
// always shows who actually signed — it cannot be typed in.
function SignedField({label, who, when, team, pending}) {
  const t=(team||[]).find(x=>(x.initials||'').toUpperCase()===String(who||'').toUpperCase());
  return <div>
    <label style={{display:"block",fontSize:10,fontWeight:700,color:"#86868b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>{label}</label>
    <div className={"signed-box"+(who?" on":"")}>
      {who ? <><b>{t?`${t.name} (${t.initials})`:who}</b><span>{fmtDay(when)} 🔒</span></> : <em>{pending}</em>}

}
// Signed-in user block, mirroring the Resource Plan sidebar.
// Reads from THIS project's own `engineers` table (see pump-engineers.sql) —
// a periodically refreshed COPY of the Resource Plan roster, because the two
// apps are separate Supabase projects and cannot read each other's data.
// If the email is not in the copy (new joiner not yet synced) it degrades to a
// name derived from the address rather than showing nothing.
function UserBadge({session, me}) {
  const email = (session && session.user && session.user.email) || "";
  const eng = me;
  const derived = email ? email.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, c => c.toUpperCase()) : "—";
  const name  = (eng && eng.name)  || derived;
  const desig = (eng && eng.desig) || "Meinhardt Group";
  const admin = !!(eng && eng.is_admin);
  return (
    <div style={{display:"flex",alignItems:"center",gap:9,minWidth:0}} title={email}>
      <div style={{width:30,height:30,borderRadius:9,flexShrink:0,background:"linear-gradient(135deg,#007aff,#5856d6)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(0,122,255,.2)"}}>
        <span style={{fontSize:13,fontWeight:700,color:"#fff"}}>{name.charAt(0).toUpperCase()}</span>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:700,color:"#1d1d1f",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",letterSpacing:"-.02em"}}>{name}</div>
        <div style={{display:"flex",alignItems:"center",gap:5,marginTop:2,flexWrap:"wrap"}}>
          <span style={{fontSize:9,color:"#8e8e93",lineHeight:1.3}}>{desig}</span>
          <span style={{flexShrink:0,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:6,background:"rgba(0,122,255,.1)",color:"#007aff"}}>{admin?"Admin":"Team"}</span>
        </div>
      </div>
    </div>
  );
}

function App({session, projectId, projectRow, onBackToProjects, team, roles=[], isAdmin=false}) {
  const userId = session.user.id;
  const [proj, setProj] = useState(projectRow.project); // shared across stages: name + client only
  const [pumps, setPumps] = useState([]);
  const [meta, setMeta]   = useState(EMPTY_META);        // PER-STAGE: revision/date/calcBy/checkedBy/approvedBy
  const [editId, setEditId]   = useState(null);
  const [pumpQuery, setPumpQuery] = useState("");
  const [printPick, setPrintPick] = useState(null);   // which calculation the sheets tab is showing
  React.useEffect(() => {
    // Keep a valid selection: first load, and after a pump is deleted.
    if (!pumps.length) { if (printPick!==null) setPrintPick(null); return; }
    if (!printPick || !pumps.some(p=>p.id===printPick)) setPrintPick(pumps[0].id);
  }, [pumps, printPick]);
  const [tab, _setTab]        = useState("setup");
  // Browser Back used to leave the site entirely from any in-app view, because
  // switching workspace tabs never touched history — the previous entry was
  // still whatever page the user arrived from (usually the Resource Plan).
  // Every navigation now pushes an entry, so Back walks back through the app
  // first and only leaves once there is nothing left to pop.
  const tabRef = React.useRef("setup");
  const setTab = React.useCallback((next, fromPop) => {
    if (next === tabRef.current) return;
    tabRef.current = next;
    if (!fromPop) { try { history.pushState({pumpNav:true, projectId, tab:next}, ""); } catch(e){} }
    _setTab(next);
  }, [projectId]);
  React.useEffect(() => {
    // Seed an entry for the view we land on, so the first Back has somewhere to go.
    try { history.replaceState({pumpNav:true, projectId, tab:tabRef.current}, ""); } catch(e){}
    const onPop = e => {
      const st = e.state;
      if (st && st.pumpNav && st.projectId === projectId && st.tab) setTab(st.tab, true);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
    // eslint-disable-next-line
  }, [projectId]);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [logoStatus, setLogoStatus] = useState('');
  const currentEmail = (session.user.email||'').toLowerCase();
  const myRoles = roles.filter(r=>r.active!==false && (r.email||'').toLowerCase()===currentEmail).map(r=>r.role);
  const engineerTeam = team.filter(t=>{ const rs=roles.filter(r=>r.active!==false && (r.email||'').toLowerCase()===(t.email||'').toLowerCase()).map(r=>r.role); return t.active!==false && (rs.includes('engineer') || rs.includes('admin') || t.is_admin); });
  const isDiscLead = isAdmin || myRoles.includes('lead');
  const isApprover = isAdmin || myRoles.includes('associate');
  const me = (team||[]).find(t=>(t.email||'').toLowerCase()===currentEmail) || null;
  const closure = closureOf(meta);
  const stageLocked = ['awaiting_approver','closed'].includes(closure.status||'draft');
  const uploadClientLogo = async (file) => {
    if (!file) return;
    const allowed=['image/png','image/jpeg','image/svg+xml'];
    if (!allowed.includes(file.type) || file.size>5242880) { setLogoStatus('Use a PNG, JPEG, or SVG client logo up to 5 MB.'); return; }
    setLogoStatus('Uploading client logo…');
    const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
    const path=`projects/${projectId}/${Date.now()}_${safe}`;
    const {error}=await sb.storage.from('mep-client-logos').upload(path,file,{upsert:false,contentType:file.type});
    if(error){setLogoStatus('Client-logo upload failed: '+error.message);return;}
    const {data}=sb.storage.from('mep-client-logos').getPublicUrl(path);
    setProj(x=>({...x,clientLogoUrl:data.publicUrl,clientLogoPath:path,clientLogoName:file.name}));
    setLogoStatus('Client logo uploaded. It will appear in issue sheets and exports.');
  };

  // ── Stages — each project can hold several independent stage snapshots ──
  // Pumps AND submission meta (revision/date/calc-check-review) are stored
  // per stage, so editing one stage never touches another.
  const [stages, setStages] = useState([]);          // [{id, stage_name, sort_order}]
  const [currentStageId, setCurrentStageId] = useState(null);
  const [stagesReady, setStagesReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data: existing } = await sb.from("project_stages")
        .select("id,stage_name,sort_order").eq("project_id", projectId).order("sort_order");
      let stageList = existing||[];
      if (!stageList.length) {
        // Lazy migration: first time this project is opened under the stages model,
        // turn its old flat pump list + old shared header fields into its first stage.
        const legacyMeta = {
          revision: projectRow.project?.revision || EMPTY_META.revision,
          date: projectRow.project?.date || EMPTY_META.date,
          calcBy: projectRow.project?.calcBy || "",
          // Checked/Approved belong to the stage workflow, not the legacy
          // project header. Do not migrate old names as current signatures.
          checkedBy: "",
          reviewedBy: "",
        };
        const { data: created, error } = await sb.from("project_stages")
          .insert({ project_id:projectId, user_id:userId, stage_name: projectRow.project?.stage || "Stage 1",
            pumps: projectRow.pumps||[], meta:legacyMeta, sort_order:0 })
          .select().single();
        if (!error && created) stageList = [{id:created.id, stage_name:created.stage_name, sort_order:0}];
      }
      if (cancelled) return;
      setStages(stageList);
      const remembered = (()=>{ try { return localStorage.getItem('mep_stage_'+projectId); } catch(e){ return null; } })();
      const first = stageList.find(x=>String(x.id)===String(remembered)) || stageList[stageList.length-1];
      if (first) {
        const { data: full } = await sb.from("project_stages").select("pumps,meta").eq("id", first.id).single();
        const ps = (full && full.pumps) || [];
        if (ps.length) _id = Math.max(_id, ...ps.map(p=>p.id)) + 1;
        setCurrentStageId(first.id);
        setPumps(ps);
        setMeta(normalizeStageMeta(full && full.meta));
        setEditId(ps[0]?.id ?? null);
        setTab(ps.length ? "schedule" : "setup");
      }
      setStagesReady(true);
    })();
    return () => { cancelled = true; };
  }, [projectId]);

  // ── Supabase autosave — shared project metadata (name/client and project JSON)
  const [saveStatus, setSaveStatus] = useState("saved"); // saving | saved | error
  const projDebounceRef  = useRef(null);
  const mountedProjRef   = useRef(false);

  useEffect(() => {
    if (!mountedProjRef.current) { mountedProjRef.current = true; return; }
    setSaveStatus("saving");
    if (projDebounceRef.current) clearTimeout(projDebounceRef.current);
    projDebounceRef.current = setTimeout(async () => {
      const { error } = await sb.from("pump_projects")
        .update({ name: proj.name||"Untitled Project", project:proj })
        .eq("id", projectId);
      setSaveStatus(error ? "error" : "saved");
      if (error) console.error(error);
    }, 1000);
    return () => {
      // Cleanup only cancels this timer. Explicit navigation, stage closure, and
      // export call the ordered flush helpers below; no stale cleanup write occurs.
      if (projDebounceRef.current) { clearTimeout(projDebounceRef.current); projDebounceRef.current = null; }
    };
  }, [proj, projectId]);

  const flushProjectSave = async () => {
    if (projDebounceRef.current) { clearTimeout(projDebounceRef.current); projDebounceRef.current=null; }
    const {error}=await sb.from("pump_projects").update({name:proj.name||"Untitled Project",project:proj}).eq("id",projectId);
    setSaveStatus(error?"error":"saved");
    if(error) throw error;
  };

  // ── Supabase autosave — pumps and submission metadata for active stage only ──
  const pumpsDebounceRef = useRef(null);

  useEffect(() => {
    if (!stagesReady || !currentStageId || stageLocked) return;
    setSaveStatus("saving");
    if (pumpsDebounceRef.current) clearTimeout(pumpsDebounceRef.current);
    pumpsDebounceRef.current = setTimeout(async () => {
      const { error } = await sb.from("project_stages").update({ pumps, meta }).eq("id", currentStageId);
      setSaveStatus(error ? "error" : "saved");
      if (error) console.error(error);
    }, 1000);
    return () => {
      // Cleanup must not perform a later asynchronous write, which could overwrite
      // a newer stage or a formal closure state.
      if (pumpsDebounceRef.current) { clearTimeout(pumpsDebounceRef.current); pumpsDebounceRef.current = null; }
    };
  }, [pumps, meta, currentStageId, stagesReady, stageLocked]);

  const flushPumpsSave = async () => {
    if (pumpsDebounceRef.current) { clearTimeout(pumpsDebounceRef.current); pumpsDebounceRef.current=null; }
    if (currentStageId && !stageLocked) {
      const {error}=await sb.from("project_stages").update({ pumps, meta }).eq("id", currentStageId);
      if(error) { setSaveStatus("error"); throw error; }
      setSaveStatus("saved");
    }
  };
  // ── Manual save ────────────────────────────────────────────────────────
  // Autosave is debounced and skipped while a stage is locked. This button forces
  // an immediate write for the project and active stage, then reports the result
  // instead of leaving the sidebar showing a stale "Saved" state.
  const [manualSave, setManualSave] = useState("");
  const saveNow = async () => {
    if (stageLocked) {
      setManualSave("Blocked — stage is " + stageStatusLabel(meta) + ". It must be reopened before it can be saved.");
      return;
    }
    setManualSave("Saving…");
    setSaveStatus("saving");
    try {
      await flushProjectSave();
      await flushPumpsSave();
      setManualSave("Saved at " + new Date().toLocaleTimeString());
    } catch (e) {
      setSaveStatus("error");
      setManualSave("SAVE FAILED: " + (e.message || e));
      console.error("Manual save failed", e);
    }
  };

  const exitProject = async () => {
    try { await flushProjectSave(); await flushPumpsSave(); } catch(e) { alert('Latest changes could not be saved: '+(e.message||e)); return; }
    onBackToProjects(); setSidebarOpen(false);
  };

  // Attempt an immediate save when the document becomes hidden so a restored tab
  // is less likely to resume from an older cloud snapshot. Browser lifecycle
  // events are best-effort; the explicit save/flush paths remain authoritative.
  useEffect(() => {
    const flushWhenHidden = () => {
      if (document.visibilityState !== 'hidden') return;
      flushProjectSave().catch(e=>console.error('Project save on tab hide failed',e));
      flushPumpsSave().catch(e=>console.error('Stage save on tab hide failed',e));
    };
    document.addEventListener('visibilitychange', flushWhenHidden);
    return () => document.removeEventListener('visibilitychange', flushWhenHidden);
  }, [proj, pumps, meta, currentStageId, stageLocked, stagesReady]);

  useEffect(()=>{ if(currentStageId){ try{ localStorage.setItem('mep_stage_'+projectId, currentStageId); }catch(e){} } },[currentStageId,projectId]);
  const switchStage = async (id) => {
    if (id === currentStageId) return;
    await flushPumpsSave();
    const { data } = await sb.from("project_stages").select("pumps,meta").eq("id", id).single();
    const ps = (data && data.pumps) || [];
    if (ps.length) _id = Math.max(_id, ...ps.map(p=>p.id)) + 1;
    setCurrentStageId(id);
    setPumps(ps);
    setMeta(normalizeStageMeta(data && data.meta));
    setEditId(ps[0]?.id ?? null);
  };

  const addStage = async () => {
    const name = window.prompt("New stage name (e.g. Concept, SD, DD, CD, IFC):", "");
    if (!name) return;
    const duplicate = window.confirm(`Start "${name}" as a copy of the current stage's pumps?\n\nOK = copy current pumps · Cancel = start empty`);
    await flushPumpsSave();
    const newPumps = duplicate ? pumps.map(p=>({...p, id:_id++})) : [];
    // Carry forward basis and preparer only. Signatures and closure never carry over.
    const newMeta = {...meta, revision:'01', checkedBy:'', checkedDate:'', reviewedBy:'', reviewedDate:'', closure:{status:'draft'}};
    const maxSort = stages.reduce((m,s)=>Math.max(m, s.sort_order||0), -1);
    const { data, error } = await sb.from("project_stages")
      .insert({ project_id:projectId, user_id:userId, stage_name:name, pumps:newPumps, meta:newMeta, sort_order:maxSort+1 })
      .select().single();
    if (error) { alert("Could not create stage: "+error.message); return; }
    setStages(s=>[...s, {id:data.id, stage_name:name, sort_order:maxSort+1}]);
    setCurrentStageId(data.id);
    setPumps(newPumps);
    setMeta(newMeta);
    setEditId(newPumps[0]?.id ?? null);
  };

  const renameStage = async (stg) => {
    const name = window.prompt("Rename stage:", stg.stage_name);
    if (!name || name===stg.stage_name) return;
    const { error } = await sb.from("project_stages").update({stage_name:name}).eq("id", stg.id);
    if (error) { alert("Rename failed: "+error.message); return; }
    setStages(s=>s.map(x=>x.id===stg.id ? {...x, stage_name:name} : x));
  };

  const deleteStage = async (stg) => {
    if (stages.length<=1) { alert("A project needs at least one stage."); return; }
    if (!window.confirm(`Delete stage "${stg.stage_name}"? This cannot be undone.`)) return;
    const { error } = await sb.from("project_stages").delete().eq("id", stg.id);
    if (error) { alert("Delete failed: "+error.message); return; }
    const remaining = stages.filter(x=>x.id!==stg.id);
    setStages(remaining);
    if (stg.id===currentStageId && remaining.length) {
      const next = remaining[0];
      const { data } = await sb.from("project_stages").select("pumps,meta").eq("id", next.id).single();
      const ps = (data && data.pumps) || [];
      setCurrentStageId(next.id); setPumps(ps); setMeta(normalizeStageMeta(data && data.meta)); setEditId(ps[0]?.id ?? null);
    }
  };

  const signOut = () => sb.auth.signOut();

  const addPump = type => { if(stageLocked) return; const p={id:_id++,...DEFS[type]}; setPumps(ps=>[...ps,p]); setEditId(p.id); setTab("pumps"); };
  const delPump = id   => { if(stageLocked) return; setPumps(ps=>ps.filter(p=>p.id!==id)); };
  const updPump = useCallback(u=>{ if(stageLocked) return; setPumps(ps=>ps.map(p=>p.id===u.id?u:p)); },[stageLocked]);
  const editing = pumps.find(p=>p.id===editId);
  const currentStage = stages.find(s=>s.id===currentStageId);
  const closureSnapshot = closure.snapshot || null;
  const issueProject = closureSnapshot?.project ? {...proj,...closureSnapshot.project} : proj;
  const issueMeta = closureSnapshot?.meta_before_closure ? {...meta,...closureSnapshot.meta_before_closure,closure:meta.closure} : meta;
  const issueStageName = closureSnapshot?.stage_name || currentStage?.stage_name;
  // The closure snapshot is used for issued outputs; therefore a later project
  // header or logo change cannot silently alter an approved stage package.
  const projForDisplay = {...issueProject, stage: issueStageName, revision:issueMeta.revision, date:issueMeta.date,
    calcBy:      issueMeta.calcBy      || issueProject.calcBy      || "",

    reviewedDate:issueMeta.reviewedDate|| ""};

  const issueExcel = async () => {
    try { await flushProjectSave(); await flushPumpsSave(); } catch(e) { alert('Save failed before export: '+(e.message||e)); return; }

  };

    const selected = pumps.find(p=>p.id===printPick);
    if (!selected) { alert("Select a calculation sheet first."); return; }

  };
  // ── Sign-off workflow. The Supabase mep_wf_* functions are the authorization
  //    boundary; these client checks provide early, user-friendly validation only.
  const wfCall = async (fn, args, failMsg) => {
    setSaveStatus('saving');
    const {data,error}=await sb.rpc(fn,{p_stage_id:currentStageId,...args});
    if(error){ setSaveStatus('error'); alert(failMsg+': '+error.message); return; }
    if (data && typeof data==='object') setMeta({...EMPTY_META, ...data});

  };

    if (!proj.clientLogoUrl) { alert('Upload the project client logo before Lead sign-off.'); return; }

// ─── REFERENCE DATA EDITOR ──────────────────────────────────────────────────────
// Generic editable grid used by every reference-data tab below. Rows are plain
// objects; new rows receive `_isNew:true` and a client-only `_key` for React's
// key prop. Saving upserts the current grid in one call; database-generated IDs
// are omitted for new rows, while natural keys are retained. Deleting a saved
// row is immediate and cannot be undone from this UI.
function newLocalKey() { return "new-"+Math.random().toString(36).slice(2); }

async function saveRefRows(tableName, rows, conflictKey, numericKeys, autoKey=(conflictKey==="id")) {
  const payload = rows.map(r => {
    const clean = {...r};
    delete clean._isNew; delete clean._key;
    for (const k of numericKeys) if (clean[k]!==undefined && clean[k]!=="") clean[k]=Number(clean[k]);
    // Only a database-generated key (serial id) is dropped on insert. Natural keys
    // (material_key, code) are typed by the user and must be sent.
    if (r._isNew && autoKey) delete clean[conflictKey];
    if (r._isNew && !autoKey && !String(clean[conflictKey]??"").trim()) throw new Error(`${conflictKey} is required for new rows.`);
    return clean;
  });
  return sb.from(tableName).upsert(payload, { onConflict: conflictKey });
}
async function deleteRefRow(tableName, conflictKey, value) {
  return sb.from(tableName).delete().eq(conflictKey, value);
}

function RefTable({columns, rows, setRows, onDeleteRow, newRowTemplate, disableKeyFor}) {
  const g = {display:"grid", gridTemplateColumns: columns.map(c=>c.width||"1fr").join(" ")+" 40px", gap:8, alignItems:"center"};
  const update = (i,key,val) => setRows(rs => rs.map((r,idx)=> idx===i ? {...r,[key]:val} : r));
  const addRow = () => setRows(rs => [...rs, {...newRowTemplate, _isNew:true, _key:newLocalKey()}]);
  const removeRow = async (i) => {
    const row = rows[i];
    if (!row._isNew) {
      if (!window.confirm("Delete this row from the database? This cannot be undone.")) return;
      const err = await onDeleteRow(row);
      if (err && err.error) { alert("Delete failed: "+err.error.message); return; }
    }
    setRows(rs => rs.filter((_,idx)=>idx!==i));
  };
  // The header row and the data rows share one grid template, so they must sit
  // inside the SAME horizontally-scrolling box — scrolling them separately
  // would let the labels drift out of line with the inputs on a phone.
  return (
    <div>
      <div className="refgrid-scroll">
        <div>
          <div style={{...g, marginBottom:6}}>
            {columns.map(c=><div key={c.key} style={{...lbl,marginBottom:0}}>{c.label}</div>)}
            <div/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:440,overflowY:"auto",paddingRight:4}}>
            {rows.map((r,i)=>(
              <div key={r.id||r._key} style={g}>
                {columns.map(c=>(
                  <input key={c.key} type={c.type||"text"} step={c.step} value={r[c.key]??""}
                    disabled={disableKeyFor && c.key===disableKeyFor && !r._isNew}
                    onChange={e=>update(i,c.key,e.target.value)}
                    style={{...inp, opacity:(disableKeyFor && c.key===disableKeyFor && !r._isNew)?0.55:1}} />
                ))}
                <button onClick={()=>removeRow(i)}
                  style={{background:"none",border:"none",color:"#d2d2d7",fontSize:15,cursor:"pointer"}}
                  onMouseOver={e=>e.target.style.color="#ef4444"} onMouseOut={e=>e.target.style.color="#d2d2d7"}>✕</button>
              </div>
            ))}
          </div>
        </div>
      </div>
      <button onClick={addRow}
        style={{marginTop:12,padding:"7px 16px",background:"white",color:"#424245",border:"1px solid #d2d2d7",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer"}}>
        + Add Row
      </button>
    </div>
  );
}

function RefTableTab({title, note, tableName, conflictKey, columns, numericKeys, newRowTemplate, transformIn, disableKeyFor, filterColumn, filterValue}) {
  const [rows, setRows] = useState(null);
  const [status, setStatus] = useState(""); // "", "saving", "saved", "error:<msg>"

  const load = useCallback(async () => {
    // The filter is applied in the QUERY, not after loading. Filtering only in
    // the view would still save every row back under the selected material,
    // which is how foreign dimensions ended up stored against the wrong key.
    let q = sb.from(tableName).select("*");
    if (filterColumn && filterValue) q = q.eq(filterColumn, filterValue);
    const { data, error } = await q.order("sort_order");
    if (error) { setStatus("error:"+error.message); return; }
    setRows((data||[]).map(transformIn || (r=>r)));
  }, [tableName, filterColumn, filterValue]);

  useEffect(() => { load(); }, [load]);

  const save = async () => {
    setStatus("saving");
    // sort_order is only rewritten when the view is scoped (or the table is
    // unfiltered by design). Saving the combined "All materials" view keeps each
    // row's existing order instead of renumbering every material globally.
    const scoped = !filterColumn || !!filterValue;
    const withOrder = rows.map((r,i)=>scoped ? ({...r, sort_order:i}) : r);
    let res;
    try { res = await saveRefRows(tableName, withOrder, conflictKey, numericKeys); }
    catch(e){ setStatus("error:"+e.message); return; }
    const { error } = res;
    if (error) { setStatus("error:"+error.message); return; }
    await loadReferenceData();
    await load();
    setStatus("saved");
  };

  if (rows===null) return <div style={{color:"#86868b",fontSize:13}}>Loading…</div>;
  return (
    <div>
      <div style={{fontSize:11,fontWeight:800,color:"#1d1d1f",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>{title}</div>
      {note && <div style={{fontSize:11,color:"#86868b",marginBottom:14}}>{note}</div>}
      <RefTable columns={columns} rows={rows} setRows={setRows} newRowTemplate={newRowTemplate}
        disableKeyFor={disableKeyFor}
        onDeleteRow={(row)=>deleteRefRow(tableName, conflictKey, row[conflictKey])} />
      <div style={{display:"flex",alignItems:"center",gap:12,marginTop:16}}>
        <button onClick={save}
          style={{padding:"9px 22px",background:"#007aff",color:"white",border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer"}}>
          Save Changes
        </button>
        {status==="saving" && <span style={{fontSize:11,color:"#86868b"}}>Saving…</span>}
        {status==="saved" && <span style={{fontSize:11,color:"#16a34a"}}>✓ Saved — live in the calculator now</span>}
        {status.startsWith("error:") && <span style={{fontSize:11,color:"#ff3b30"}}>{status.slice(6)}</span>}
      </div>
    </div>
  );
}

// ─── PROJECTS HOME — project list with owner and shared-access rows ────────────
function ProjectsHome({session, me, isAdmin, roles=[], pendingCount, onOpen, onOpenRefData, onOpenTeam}) {
  const myEmailPH=(session.user.email||'').toLowerCase();
  const canMepPH=isAdmin||roles.some(r=>r.active!==false&&(r.email||'').toLowerCase()===myEmailPH&&r.role==='associate');
  const [wfInfo, setWfInfo] = useState({}); // project_id -> {awaiting:[names], closed:n, awaitingMine:n}
  const userId = session.user.id;
  const [list, setList]   = useState(null); // null = loading
  const [stageCounts, setStageCounts] = useState({}); // project_id -> [stage_name,...]
  const [err, setErr]     = useState("");
  const [busy, setBusy]   = useState(false);

  const refresh = useCallback(async () => {
    const email = (session.user.email || '').trim().toLowerCase();
    // Owners are keyed by user_id; shared project access is keyed by email.
    // The original page queried only owner rows, so assigned users saw an empty list.
    const [{ data: owned, error: ownerError }, { data: memberships, error: memberError }] = await Promise.all([
      sb.from("pump_projects")
        .select("id,name,updated_at,user_id")
        .eq("user_id", userId)
        .order("updated_at", { ascending:false }),
      sb.from("project_members")
        .select("project_id,access_role")
        .eq("email", email)
    ]);
    if (ownerError) { setErr(ownerError.message); return; }
    if (memberError) setErr("Shared-project access is not configured: " + memberError.message);
    else setErr("");
    const memberIds = (memberships || []).map(m => m.project_id).filter(Boolean);
    let shared = [];
    if (memberIds.length) {
      const { data, error: sharedError } = await sb.from("pump_projects")
        .select("id,name,updated_at,user_id")
        .in("id", memberIds)
        .order("updated_at", { ascending:false });
      if (sharedError) setErr("Assigned projects are blocked by database access policy: " + sharedError.message);
      else if ((data || []).length < memberIds.length) setErr("Danish has project access records, but Supabase is not returning the assigned project rows. Check pump_projects RLS.");
      else shared = data || [];
    }
    const merged = new Map();
    for (const row of [...(owned || []), ...shared]) merged.set(row.id, row);
    const rows = [...merged.values()].sort((a,b) => new Date(b.updated_at||0) - new Date(a.updated_at||0));
    setList(rows);
    const allIds = rows.map(row => row.id).filter(Boolean);
    let stages = [];
    if (allIds.length) {
      const { data: stageRows } = await sb.from("project_stages")
        .select("project_id,stage_name,closure:meta->closure")
        .in("project_id", allIds);
      stages = stageRows || [];
    }
    const grouped = {}, wf = {};
    for (const s of stages) {
      (grouped[s.project_id] = grouped[s.project_id]||[]).push(s.stage_name);
      const w = wf[s.project_id] = wf[s.project_id] || {awaiting:[], closed:0, awaitingMine:0};
      const c = s.closure || {}, st = c.status || 'draft';
      if (st==='closed') w.closed++;
      if (st==='awaiting_approver') {
        w.awaiting.push(s.stage_name);
        if (canMepPH && (c.lead_signed_email||'').toLowerCase()!==myEmailPH) w.awaitingMine++;
      }
    }
    setStageCounts(grouped); setWfInfo(wf);
  }, [userId, session.user.email, canMepPH]);

  useEffect(() => { refresh(); }, [refresh]);

  const newProject = async (withSample) => {
    const name = window.prompt("New project name:", "Untitled Project");
    if (!name) return;
    setBusy(true);
    const project = {name, client:"", stage:"", calcBy:"", checkedBy:"", reviewedBy:"", date:new Date().toISOString().slice(0,10), revision:"01"};
    const { data, error } = await sb.from("pump_projects")
      .insert({ user_id:userId, name, is_autosave:false, project, pumps:[] })
      .select().single();
    if (error) { setBusy(false); alert("Could not create project: "+error.message); return; }
    const pumps = withSample ? DEMO.map(p=>({...p, id:_id++})) : [];
    await sb.from("project_stages").insert({ project_id:data.id, user_id:userId, stage_name:"Concept", pumps, sort_order:0 });
    setBusy(false);
    onOpen(data);
  };

  const openProject = async (id) => {
    const { data, error } = await sb.from("pump_projects").select("*").eq("id", id).single();
    if (error) { alert("Could not open project: "+error.message); return; }
    onOpen(data);
  };

  const renameProject = async (row) => {
    const name = window.prompt("Rename project:", row.name);
    if (!name || name===row.name) return;
    const { data: full, error: e1 } = await sb.from("pump_projects").select("project").eq("id",row.id).single();
    if (e1) { alert("Rename failed: "+e1.message); return; }
    const { error } = await sb.from("pump_projects")
      .update({ name, project:{...(full.project||{}), name} }).eq("id", row.id);
    if (error) { alert("Rename failed: "+error.message); return; }
    refresh();
  };

  const duplicateProject = async (row) => {
    const { data: full, error: e1 } = await sb.from("pump_projects").select("project").eq("id",row.id).single();
    if (e1) { alert("Duplicate failed: "+e1.message); return; }
    const { data: srcStages, error: e2 } = await sb.from("project_stages").select("stage_name,pumps,meta,sort_order").eq("project_id",row.id).order("sort_order");
    if (e2) { alert("Duplicate failed: "+e2.message); return; }
    const name = (row.name||"Untitled Project")+" (Copy)";
    const { data: created, error } = await sb.from("pump_projects")
      .insert({ user_id:userId, name, is_autosave:false, project:{...(full.project||{}), name}, pumps:[] })
      .select().single();
    if (error) { alert("Duplicate failed: "+error.message); return; }
    const clonedStages = (srcStages||[]).map(s=>({
      project_id:created.id, user_id:userId, stage_name:s.stage_name, sort_order:s.sort_order,
      pumps:(s.pumps||[]).map(p=>({...p, id:_id++})),
      // Keep preparer, revision, date and design basis; never copy signatures or closure.
      meta:{...EMPTY_META, ...(s.meta||{}), checkedBy:'', checkedDate:'', reviewedBy:'', reviewedDate:'', closure:{status:'draft'}},
    }));
    if (clonedStages.length) await sb.from("project_stages").insert(clonedStages);
    refresh();
  };

  const deleteProject = async (row) => {
    const w = wfInfo[row.id];
    if (w && (w.closed || w.awaiting.length)) { alert(`"${row.name}" has issued or in-review stages and cannot be deleted. Issued records are kept permanently.`); return; }
    if (!window.confirm(`Delete "${row.name}"? This cannot be undone.`)) return;
    const { error } = await sb.from("pump_projects").delete().eq("id", row.id);
    if (error) { alert("Delete failed: "+error.message); return; }
    refresh();
  };

  return (
    <div className="global-page" style={{minHeight:"100vh",background:"#f5f5f7"}}>
      <div className="app-header" style={{background:"rgba(255,255,255,.88)",backdropFilter:"blur(20px)",borderBottom:"1px solid #d2d2d7",color:"#1d1d1f",padding:"10px 20px"}}>
        <div style={{maxWidth:1000,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{fontSize:15,fontWeight:600,letterSpacing:"-0.01em"}}>Pump Calculator</div><span className="build-pill" title="Running build">{BUILD_LABEL}</span></div>
          <div style={{display:"flex",gap:14,alignItems:"center"}}>
            <UserBadge session={session} me={me} />
            {isAdmin && <button onClick={onOpenTeam}
              style={{padding:'5px 12px',background:'white',color:'#424245',border:'1px solid #d2d2d7',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer'}}>Team & Access{pendingCount>0 ? ` (${pendingCount})` : ''}</button>}
            <a href="spec.html" style={{padding:"5px 12px",background:"white",color:"#424245",border:"1px solid #d2d2d7",borderRadius:7,fontSize:11,fontWeight:600,textDecoration:"none"}}>§ Specifications</a>
            <button onClick={onOpenRefData}
              style={{padding:"5px 12px",background:"white",color:"#424245",border:"1px solid #d2d2d7",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer"}}>
              📊 Reference Data
            </button>
            <button onClick={()=>sb.auth.signOut()}
              style={{padding:"5px 12px",background:"transparent",color:"#8e8e93",border:"none",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer"}}>
              Sign Out
            </button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1000,margin:"0 auto",padding:"28px"}}>
        <div style={{display:"flex",gap:10,marginBottom:22}}>
          <button disabled={busy} onClick={()=>newProject(false)}
            style={{padding:"10px 22px",background:"#007aff",color:"white",border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:busy?"default":"pointer",opacity:busy?0.6:1}}>
            + New Project
          </button>
          <button disabled={busy} onClick={()=>newProject(true)}
            style={{padding:"10px 18px",background:"white",color:"#424245",border:"1px solid #d2d2d7",borderRadius:9,fontSize:13,fontWeight:700,cursor:busy?"default":"pointer",opacity:busy?0.6:1}}>
            + New Project from Sample Data
          </button>
        </div>

        {err && <div style={{fontSize:12,color:"#ff3b30",marginBottom:14}}>{err}</div>}

        {list===null ? (
          <div style={{color:"#86868b",fontSize:13}}>Loading projects…</div>
        ) : !list.length ? (
          <div style={{background:"white",borderRadius:16,border:"1px solid #d2d2d7",padding:40,textAlign:"center",color:"#86868b",fontSize:13}}>
            No projects yet — create one above to get started.
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {list.map(row=>(
              <div key={row.id} className="project-card"
                style={{background:"white",borderRadius:12,border:"1px solid #d2d2d7",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:14}}>
                <div style={{cursor:"pointer",flex:1}} onClick={()=>openProject(row.id)}>
                  <div style={{fontSize:14,fontWeight:800,color:"#1d1d1f"}}>📁 {row.name}</div>
                  <div style={{fontSize:11,color:"#86868b",marginTop:3}}>
                    {(stageCounts[row.id]||[]).length || 0} stage{(stageCounts[row.id]||[]).length===1?"":"s"}
                    {(stageCounts[row.id]||[]).length ? <> — {stageCounts[row.id].join(", ")}</> : null}
                    {" "}· Updated {new Date(row.updated_at).toLocaleString()}
                  </div>
                  {wfInfo[row.id] && (wfInfo[row.id].awaiting.length>0 || wfInfo[row.id].closed>0) && <div className="ph-chips">
                    {wfInfo[row.id].awaitingMine>0 && <span className="ph-chip you">● Your sign-off needed ({wfInfo[row.id].awaitingMine})</span>}
                    {wfInfo[row.id].awaiting.length>0 && <span className="ph-chip wait">Awaiting Associate / Approver: {wfInfo[row.id].awaiting.join(", ")}</span>}
                    {wfInfo[row.id].closed>0 && <span className="ph-chip ok">🔒 {wfInfo[row.id].closed} issued</span>}
                  </div>}
                </div>
                <div style={{display:"flex",gap:7,flexShrink:0}}>
                  <button onClick={()=>openProject(row.id)}
                    style={{padding:"7px 16px",background:"#007aff",color:"white",border:"none",borderRadius:10,fontSize:11,fontWeight:700,cursor:"pointer"}}>
                    Open
                  </button>
                  {row.user_id === userId && <>
                    <button onClick={()=>renameProject(row)}
                      style={{padding:"7px 14px",background:"white",color:"#424245",border:"1px solid #d2d2d7",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer"}}>
                      Rename
                    </button>
                    <button onClick={()=>duplicateProject(row)}
                      style={{padding:"7px 14px",background:"white",color:"#424245",border:"1px solid #d2d2d7",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer"}}>
                      Duplicate
                    </button>
                    <button onClick={()=>deleteProject(row)}
                      title={wfInfo[row.id]&&(wfInfo[row.id].closed||wfInfo[row.id].awaiting.length)?"Projects with issued or in-review stages cannot be deleted":"Delete project"}
                      style={{padding:"7px 14px",background:"white",color:"#ff3b30",border:"1px solid #fecaca",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer",opacity:(wfInfo[row.id]&&(wfInfo[row.id].closed||wfInfo[row.id].awaiting.length))?0.4:1}}>
                      Delete
                    </button>
                  </>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ROOT — Supabase authentication, reference-data, and workspace gate ─────
function RootApp() {
  const [session, setSession] = useState(undefined); // undefined=loading, null=logged out
  const {team, roles, me, isAdmin, ready:teamReady, pendingCount, reload:reloadTeam} = useTeamData(session);
  const [openProject, _setOpenProject] = useState(null); // full project row currently open, or null
  // Opening a project pushes a history entry; Back from the project's first
  // view therefore returns to the project list rather than leaving the site.
  const openRef = React.useRef(null);
  const setOpenProject = React.useCallback((row, fromPop) => {
    const prevId = openRef.current && openRef.current.id, nextId = row && row.id;
    openRef.current = row;
    if (!fromPop && prevId !== nextId) {
      try {
        if (nextId) history.pushState({pumpNav:true, projectId:nextId, tab:null}, "");
        else history.replaceState({pumpNav:true, projectId:null, tab:null}, "");
      } catch(e){}
    }
    _setOpenProject(row);
  }, []);
  // The list page owns a real history entry, so Back from a project lands on it.
  React.useEffect(() => {
    if (!openProject) { try { history.replaceState({pumpNav:true, projectId:null, tab:null}, ""); } catch(e){} }
  }, [openProject]);
  React.useEffect(() => {
    const onPop = e => {
      const st = e.state;
      // A null / foreign entry, or a list-level entry, means "no project open".
      if (!st || !st.pumpNav || !st.projectId) { if (openRef.current) setOpenProject(null, true); return; }
      // Tab-level entries for the open project are handled inside App.
      if (openRef.current && st.projectId !== openRef.current.id) setOpenProject(null, true);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [setOpenProject]);
  const [screen, setScreen] = useState("projects"); // "projects" | "refdata"
  const [refDataReady, setRefDataReady] = useState(false);
  const [refDataErr, setRefDataErr] = useState("");

  useEffect(() => {
    // Keep a stable React session identity for the same signed-in user. Supabase
    // sends TOKEN_REFRESHED when Chrome restores focus to a background tab; that
    // event updates the Supabase client token but must not remount this workspace.
    const applySession = (nextSession) => {
      setSession(previous => {
        // `undefined` is the initial loading sentinel, not a signed-out state.
        // It must always resolve on the first getSession result.
        if (previous === undefined) return nextSession || null;
        const previousUser = previous?.user?.id || null;
        const nextUser = nextSession?.user?.id || null;
        return previousUser === nextUser ? previous : (nextSession || null);
      });
    };
    sb.auth.getSession().then(({data})=>applySession(data.session||null));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess)=>{
      applySession(sess);
      if (!sess) { setOpenProject(null); setRefDataReady(false); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) return;
    let cancelled = false;
    loadReferenceData().then(ok => {
      if (cancelled) return;
      if (!ok) setRefDataErr("Could not load reference data from Supabase — using built-in defaults. Run supabase_refdata_setup.sql if you haven't yet.");
      setRefDataReady(true);
    });
    return () => { cancelled = true; };
  }, [session]);

  if (session === undefined) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#86868b",fontSize:13}}>Loading…</div>;
  }
  if (!session) return <AuthScreen />;
  if (!refDataReady || !teamReady) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#86868b",fontSize:13}}>Loading secure workspace…</div>;
  }
  if (!me || me.active === false) {
    return <AccessPendingScreen session={session} reload={reloadTeam} />;
  }
  if (refDataErr) {
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{maxWidth:480,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:12,padding:24,fontSize:13,color:"#7f1d1d"}}>
          {refDataErr}
          <div style={{marginTop:14}}>
            <button onClick={()=>{setRefDataErr("");}}
              style={{padding:"8px 18px",background:"#1d1d1f",color:"white",border:"none",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer"}}>
              Continue with built-in defaults
            </button>
          </div>
        </div>
      </div>
    );
  }
  if (openProject) {
    return (
      <App key={openProject.id} session={session} projectId={openProject.id} team={team}
        projectRow={openProject} roles={roles} isAdmin={isAdmin} onBackToProjects={()=>setOpenProject(null)} />
    );
  }
  if (screen === "refdata") {
    return <RefDataEditor onBack={()=>setScreen("projects")} />;
  }
  if (screen === "team") {
    return <TeamAccessAdmin onBack={()=>setScreen("projects")} session={session} team={team} roles={roles} reload={reloadTeam} canEdit={isAdmin} />;
  }
  return <ProjectsHome session={session} me={me} isAdmin={isAdmin} roles={roles} pendingCount={pendingCount} onOpen={setOpenProject} onOpenRefData={()=>setScreen("refdata")} onOpenTeam={()=>setScreen("team")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<RootApp />);
</script>
</body>
</html>
