<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Vendor Technical Submission · Meinhardt</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f5f7;--pn:#fff;--bd:#e1e1e6;--tx:#1d1d1f;--mu:#6e6e73;--ac:#007aff;--ok:#208a45;--okb:#e8faf0;--wa:#a76200;--wab:#fff4e0;--er:#b42318;--erb:#fff1f0}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:30px}
header .t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
header .h{font-size:16px;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--mu)}
.chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-wa{background:var(--wab);color:var(--wa)}.c-mu{background:#f0f0f2;color:var(--mu)}.c-er{background:var(--erb);color:var(--er)}
button{font:inherit;font-weight:700;border:1px solid #d2d2d7;background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:var(--tx)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,textarea,select{font:inherit;padding:6px 8px;border:1px solid #d2d2d7;border-radius:7px;width:100%;background:#fff;color:var(--tx)}
input:disabled,textarea:disabled{background:#f5f5f7}
label.f{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;align-items:start}
.plist{position:sticky;top:10px}
.pi{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;width:100%;text-align:left;background:none;font-weight:400}
.pi:hover{background:#f0f6ff}.pi.on{background:#e6f0ff;border-color:#b9d4ff}
.pi .n{flex:1;min-width:0}.pi b{display:block;font-size:12px}.pi em{font-style:normal;font-size:10.5px;color:var(--mu)}
.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:6px 0 10px}.bar div{height:6px;background:#34c759}
table{border-collapse:collapse;width:100%}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
td{padding:6px;border-bottom:1px dashed #e3e3e8;vertical-align:top}
tr.grp td{background:#f5f5f7;font-weight:800;font-size:11px;border-bottom:1px solid var(--bd)}
tr.dev td{background:var(--erb)}
.seg{display:inline-flex;border:1px solid #d2d2d7;border-radius:7px;overflow:hidden}
.seg label{padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;border-right:1px solid #d2d2d7;white-space:nowrap}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--ac);color:#fff}
.seg label.dv:has(input:checked){background:var(--er)}
.seg label.na:has(input:checked){background:#8e8e93}
.seg input:focus-visible+span{outline:2px solid var(--ac)}
.req{font-weight:700}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;font-weight:600}
.msg.e{background:var(--erb);color:var(--er)}.msg.i{background:#e7f1ff;color:#0a4fa0}.msg.s{background:var(--okb);color:var(--ok)}
.lock{background:var(--okb);color:var(--ok);border-radius:8px;padding:8px 12px;font-weight:700;margin-bottom:10px}
.act{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 0 2px;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.center{max-width:560px;margin:40px auto}
.decl{background:#fafafc;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:10px 0}
@media (max-width:820px){.layout{grid-template-columns:1fr}.plist{position:static}.grid2{grid-template-columns:1fr}
  .ftab thead{display:none}.ftab tr{display:block;border-bottom:1px solid var(--bd);padding:6px 0}.ftab td{display:block;border:0;padding:3px 6px}
  .ftab td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:800;color:var(--mu);text-transform:uppercase}}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214;--pn:#1c1c1f;--bd:#333338;--tx:#f2f2f5;--mu:#a1a1a8;--okb:#11301d;--wab:#3a2a0c;--erb:#3a1513}
  header,.act{background:#1c1c1f}input,textarea,select,button{background:#26262a;color:var(--tx);border-color:#3a3a40}
  input:disabled,textarea:disabled{background:#1f1f22}tr.grp td,.decl{background:#232327}.pi:hover{background:#22304a}.pi.on{background:#1f3355;border-color:#2c4f8a}
  .c-mu{background:#2a2a2e}.bar{background:#333}header img{background:#fff;border-radius:4px;padding:2px}}
</style>
</head>

  const SUPABASE_ANON_KEY = "sb_publishable_yKNkvfwVnk35wuOGOZJ0oQ_0cMI-0Ae";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:false}});
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dt = d => d ? new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : '—';
  const dtt = d => d ? new Date(d).toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
  const tok = (new URLSearchParams(location.hash.slice(1)).get('t')) || (new URLSearchParams(location.search).get('t')) || '';
  const S = {pkg:null, cur:0, edits:{}, dirty:false, busy:false, msg:null};

  window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

  async function load(keepCur) {
    const r = await sb.rpc('vp_open', {p_token:tok});
    if (r.error) { fatal(r.error.message); return; }
    S.pkg = r.data; S.edits = {}; S.dirty = false;
    if (!keepCur) { const i = S.pkg.items.findIndex(x => x.status !== 'Submitted'); S.cur = i < 0 ? 0 : i; }
    render();
  }
  function fatal(m) {
    $('hdr').textContent = 'Link unavailable';
    $('app').innerHTML = `<div class="center card"><b>We could not open this package.</b><p class="muted">${esc(m)}</p></div>`;
  }
  function setMsg(t, k) { S.msg = t ? {t, k:k || 'i'} : null; const m = $('msg'); if (m) { m.className = t ? 'msg ' + (k || 'i') : ''; m.textContent = t || ''; } }
  function errText(e) { return (e && e.message ? e.message : String(e)).replace(/^.*?ERROR:\s*/, ''); }

  function render() {
    const P = S.pkg;
    $('hdr').textContent = `${P.ref_no} · ${P.title}`;
    const done = P.items.filter(i => i.status === 'Submitted').length;
    $('hstat').innerHTML = P.status === 'Signed off' || P.status === 'Closed' ? '<span class="chip c-ok">Signed off 🔒</span>'
      : P.expired ? '<span class="chip c-er">Link expired</span>' : `<span class="chip c-wa">${done} / ${P.items.length} submitted</span>`;
    if (!P.identity && !P.readonly) return renderIdentity();
    const it = P.items[S.cur];
    const signedOff = P.status === 'Signed off' || P.status === 'Closed';
    $('app').innerHTML = `
      ${signedOff ? `<div class="card" style="border-color:#b7e4c7"><b>✔ Thank you — this package was signed off on ${esc(dtt(P.signed_at))} by ${esc(P.identity && P.identity.name)}.</b><div class="muted">Your submission is locked. Meinhardt will contact you if a revision is needed.</div></div>`
        : P.expired ? `<div class="msg e">This link expired on ${esc(dt(P.expires_at))}. Your saved work is kept — please ask Meinhardt for a new link.</div>` : ''}
      <div class="card">
        <div class="grid2">
          <div><div class="muted" style="font-size:11px">Requested by Meinhardt from</div><b>${esc(P.company)}</b>${P.contact ? ' · ' + esc(P.contact) : ''}</div>
          <div><div class="muted" style="font-size:11px">Required by · Link valid until</div><b>${esc(dt(P.due))}</b> · ${esc(dt(P.expires_at))}</div>
        </div>
        ${P.identity ? `<div style="margin-top:8px;font-size:12px">Responding as <b>${esc(P.identity.name)}</b>${P.identity.designation ? ' (' + esc(P.identity.designation) + ')' : ''}, ${esc(P.identity.company)}${P.identity.email ? ' · ' + esc(P.identity.email) : ''}
          ${!P.readonly ? ' <button type="button" id="chgId" style="padding:2px 8px;font-size:11px">Change</button>' : ''}</div>` : ''}
        ${P.message ? `<div class="decl" style="white-space:pre-wrap">${esc(P.message)}</div>` : ''}
      </div>
      <div class="layout">
        <div class="card plist">
          <b>Products</b><div class="bar"><div style="width:${P.items.length ? done / P.items.length * 100 : 0}%"></div></div>
          <div role="list">${P.items.map((x, i) => `<button type="button" role="listitem" class="pi ${i === S.cur ? 'on' : ''}" data-i="${i}">
            <span class="n"><b>${i + 1}. ${esc(x.name)}</b><em>${esc(x.ref || x.code)}${x.rev ? ' · Spec Rev ' + esc(x.rev) : ''}</em></span>
            ${x.status === 'Submitted' ? '<span class="chip c-ok">🔒</span>' : x.status === 'Draft' ? '<span class="chip c-wa">Draft</span>' : '<span class="chip c-mu">New</span>'}</button>`).join('')}</div>
          ${!P.readonly ? signoffBox(done) : ''}
        </div>
        <div class="card" id="pane">${it ? productPane(it) : '<span class="muted">No products in this package.</span>'}</div>
      </div>`;
    bind();
    if (S.msg) setMsg(S.msg.t, S.msg.k);
  }

  function renderIdentity() {
    const P = S.pkg;
    $('app').innerHTML = `<form class="center card" id="idf" novalidate>
      <b style="font-size:15px">Before you start</b>
      <p class="muted">Meinhardt has requested technical data for <b>${P.items.length}</b> product${P.items.length === 1 ? '' : 's'}. No account is needed. Please enter your details — they are recorded with your submission and sign-off.</p>
      ${P.message ? `<div class="decl" style="white-space:pre-wrap">${esc(P.message)}</div>` : ''}
      <div style="display:grid;gap:10px">
        <label class="f">Your full name *<input id="iN" autocomplete="name" required maxlength="120"></label>
        <label class="f">Company *<input id="iC" autocomplete="organization" required maxlength="160" value="${esc(P.company)}"></label>
        <div class="grid2"><label class="f">Email<input id="iE" type="email" autocomplete="email" maxlength="160" value="${esc(P.email || '')}"></label>
        <label class="f">Designation<input id="iD" autocomplete="organization-title" maxlength="120"></label></div>
      </div>
      <div id="msg"></div>
      <div style="margin-top:12px"><button class="pri" type="submit" id="iGo">Continue to products</button></div>
    </form>`;
    $('idf').addEventListener('submit', async e => {
      e.preventDefault();
      const n = $('iN').value.trim(), c = $('iC').value.trim(), m = $('iE').value.trim();
      if (!n || !c) return setMsg('Enter your name and company.', 'e');
      if (m && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return setMsg('Enter a valid email address.', 'e');
      $('iGo').disabled = true;
      const r = await sb.rpc('vp_identify', {p_token:tok, p_name:n, p_company:c, p_email:m, p_designation:$('iD').value.trim()});
      if (r.error) { $('iGo').disabled = false; return setMsg(errText(r.error), 'e'); }
      S.msg = null; load();
    });
  }

  function sortedFields(it) {
    return (it.fields || []).slice().sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.label).localeCompare(String(b.label)));
  }
  function val(it, f) {
    const e = (S.edits[it.id] || {})[f.id]; if (e) return e;
    return (it.responses || []).find(r => r.field_id === f.id) || {};
  }

  function productPane(it) {
    const P = S.pkg, locked = it.status === 'Submitted' || P.readonly, fl = sortedFields(it);
    const need = fl.filter(f => f.vendor_response !== false);
    const filled = need.filter(f => { const v = val(it, f); return v.compliance && (v.compliance === 'N/A' || (v.offered || '').trim()) && (v.compliance !== 'Deviation' || (v.comment || '').trim()); }).length;
    let lastG = null, rows = '';
    fl.forEach(f => {
      const g = f.grp || 'General';
      if (g !== lastG) { rows += `<tr class="grp"><td colspan="5">${esc(g)}</td></tr>`; lastG = g; }
      const v = val(it, f), dis = locked ? 'disabled' : '', spec = `${esc(f.required_value || '—')}${f.unit ? ' ' + esc(f.unit) : ''}`;
      if (f.vendor_response === false) {
        rows += `<tr><td data-l="Requirement" class="req">${esc(f.label)}</td><td data-l="Specified">${spec}</td><td colspan="3" class="muted" data-l="">For information — no response needed</td></tr>`;
        return;
      }
      const nm = 'c_' + f.id;
      const rb = (k, cls) => `<label class="${cls}"><input type="radio" name="${nm}" value="${k}" data-f="${f.id}" data-k="compliance" ${v.compliance === k ? 'checked' : ''} ${dis}><span>${k}</span></label>`;
      const inp = f.field_type === 'select' && (f.options || []).length
        ? `<select data-f="${f.id}" data-k="offered" ${dis} aria-label="Your offer for ${esc(f.label)}"><option value=""></option>${f.options.map(o => `<option ${o === v.offered ? 'selected' : ''}>${esc(o)}</option>`).join('')}${v.offered && !f.options.includes(v.offered) ? `<option selected>${esc(v.offered)}</option>` : ''}</select>`
        : f.field_type === 'longtext' ? `<textarea rows="2" data-f="${f.id}" data-k="offered" ${dis} aria-label="Your offer for ${esc(f.label)}">${esc(v.offered)}</textarea>`
        : `<input ${f.field_type === 'number' ? 'inputmode="decimal"' : ''} data-f="${f.id}" data-k="offered" value="${esc(v.offered)}" ${dis} aria-label="Your offer for ${esc(f.label)}" maxlength="2000">`;
      rows += `<tr class="${v.compliance === 'Deviation' ? 'dev' : ''}" data-row="${f.id}">
        <td data-l="Requirement" class="req">${esc(f.label)}</td>
        <td data-l="Specified">${spec}</td>
        <td data-l="Your offer" style="min-width:150px">${inp}</td>
        <td data-l="Compliance"><span class="seg" role="radiogroup" aria-label="Compliance for ${esc(f.label)}">${rb('Comply', '')}${rb('Deviation', 'dv')}${rb('N/A', 'na')}</span></td>
        <td data-l="Comment" style="min-width:150px"><input data-f="${f.id}" data-k="comment" value="${esc(v.comment)}" ${dis} placeholder="${v.compliance === 'Deviation' ? 'Required: explain the deviation' : ''}" aria-label="Comment for ${esc(f.label)}" maxlength="2000"></td></tr>`;
    });
    return `
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <b style="font-size:15px">${S.cur + 1}. ${esc(it.name)}</b><span class="chip c-mu">${esc(it.ref || it.code)}${it.rev ? ' · Spec Rev ' + esc(it.rev) : ''}</span>
        <span class="sp"></span><span class="muted" style="font-size:11px">${filled} / ${need.length} complete</span>
      </div>
      ${it.status === 'Submitted' ? `<div class="lock" style="margin-top:8px">🔒 Submitted ${esc(dtt(it.submitted_at))} — this product can no longer be edited.</div>` : ''}
      ${!locked ? `<p class="muted" style="margin:6px 0 8px">For each requirement enter what you offer and choose <b>Comply</b>, <b>Deviation</b> (comment required) or <b>N/A</b>.
        <button type="button" id="fillAll" style="padding:3px 9px;font-size:11px;margin-left:4px">Fill blanks as specified &amp; Comply</button></p>` : ''}
      <table class="ftab"><thead><tr><th>Requirement</th><th>Specified</th><th>Your offer</th><th>Compliance</th><th>Comment</th></tr></thead><tbody>${rows}</tbody></table>
      <div id="msg"></div>
      <div class="act">
        <button type="button" id="prev" ${S.cur === 0 ? 'disabled' : ''}>← Previous</button>
        <button type="button" id="next" ${S.cur >= S.pkg.items.length - 1 ? 'disabled' : ''}>Next →</button>
        <span class="sp"></span>
        ${!locked ? `<span id="dirty" class="muted" style="font-size:11px"></span><button type="button" id="save">Save draft</button><button type="button" class="ok" id="submit">Submit product</button>` : ''}
      </div>`;
  }

  function signoffBox(done) {
    const P = S.pkg, all = done === P.items.length && P.items.length > 0;
    return `<div class="decl" style="margin-top:12px">
      <b>Sign off package</b>
      ${!all ? `<div class="muted" style="font-size:11px;margin-top:4px">Available when all ${P.items.length} products are submitted (${done} done).</div>` : `
      <div style="font-size:11px;margin:6px 0">I confirm that the information submitted represents the products we propose for this specification package and has been reviewed by me on behalf of <b>${esc(P.identity && P.identity.company)}</b>.</div>
      <label style="display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;margin:6px 0"><input type="checkbox" id="sConf" style="width:auto"> I confirm the above</label>
      <label class="f">Name<input id="sN" value="${esc(P.identity && P.identity.name)}" maxlength="120"></label>
      <label class="f" style="margin-top:6px">Designation<input id="sD" value="${esc((P.identity && P.identity.designation) || '')}" maxlength="120"></label>
      <button type="button" class="ok" id="sGo" style="margin-top:8px;width:100%">Sign off &amp; lock package</button>`}
    </div>`;
  }

  function payload(it) {
    const e = S.edits[it.id] || {};
    return Object.keys(e).map(fid => ({field_id:fid, offered:e[fid].offered || '', compliance:e[fid].compliance || '', comment:e[fid].comment || ''}));
  }
  function edit(it, fid, k, v) {
    S.edits[it.id] = S.edits[it.id] || {};
    const base = val(it, {id:fid});
    S.edits[it.id][fid] = Object.assign({offered:base.offered || '', compliance:base.compliance || '', comment:base.comment || ''}, S.edits[it.id][fid] || {}, {[k]:v});
    S.dirty = true; const d = $('dirty'); if (d) d.textContent = '● unsaved changes';
  }
  async function save(it, submit) {
    if (S.busy) return false;
    S.busy = true; setButtons(true);
    const r = await sb.rpc('vp_save', {p_token:tok, p_item:it.id, p_resp:payload(it), p_submit:!!submit});
    S.busy = false; setButtons(false);
    if (r.error) { setMsg(errText(r.error) + (submit ? ' Your entries are still on screen — nothing was lost.' : ''), 'e'); return false; }
    // merge saved values back so they survive the reload
    S.msg = {t:submit ? `Submitted ${it.ref || it.code} — locked. ` + (S.pkg.items.filter(x => x.status !== 'Submitted' && x.id !== it.id).length ? 'Continue with the next product.' : 'All products submitted — please sign off the package.') : 'Draft saved.', k:'s'};
    await load(true);
    if (submit) { const n = S.pkg.items.findIndex(x => x.status !== 'Submitted'); if (n >= 0) { S.cur = n; render(); } }
    return true;
  }
  function setButtons(dis) { ['save', 'submit', 'sGo'].forEach(id => { const b = $(id); if (b) b.disabled = dis; }); }
  async function go(i) {
    if (i === S.cur) return;
    const it = S.pkg.items[S.cur];
    if (S.dirty && it && it.status !== 'Submitted' && !S.pkg.readonly) { if (!(await save(it, false))) return; }
    S.cur = i; S.msg = null; render(); window.scrollTo({top:0, behavior:'smooth'});
  }

  function bind() {
    const P = S.pkg, it = P.items[S.cur];
    document.querySelectorAll('.pi').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
    const chg = $('chgId'); if (chg) chg.addEventListener('click', () => { if (S.dirty && !confirm('Discard unsaved changes?')) return; S.dirty = false; renderIdentity(); const I = P.identity; $('iN').value = I.name || ''; $('iC').value = I.company || ''; $('iE').value = I.email || ''; $('iD').value = I.designation || ''; });
    if (!it) return;
    const pane = $('pane');
    pane.addEventListener('input', e => { const t = e.target; if (!t.dataset.f) return; edit(it, t.dataset.f, t.dataset.k, t.value); });
    pane.addEventListener('change', e => { const t = e.target; if (!t.dataset.f) return; edit(it, t.dataset.f, t.dataset.k, t.value);
      if (t.dataset.k === 'compliance') { const tr = pane.querySelector(`tr[data-row="${CSS.escape(t.dataset.f)}"]`); if (tr) { tr.classList.toggle('dev', t.value === 'Deviation'); const c = tr.querySelector('[data-k="comment"]'); if (c) { c.placeholder = t.value === 'Deviation' ? 'Required: explain the deviation' : ''; if (t.value === 'Deviation' && !c.value) c.focus(); } } } });
    const fa = $('fillAll'); if (fa) fa.addEventListener('click', () => {
      let n = 0;
      sortedFields(it).filter(f => f.vendor_response !== false).forEach(f => { const v = val(it, f);
        if (!v.compliance && !(v.offered || '').trim() && f.required_value) { edit(it, f.id, 'offered', f.required_value); edit(it, f.id, 'compliance', 'Comply'); n++; } });
      const keep = S.edits; render(); S.edits = keep; S.dirty = n > 0 || S.dirty; const d = $('dirty'); if (d && S.dirty) d.textContent = '● unsaved changes';
      setMsg(n ? `${n} blank field${n === 1 ? '' : 's'} filled with the specified value and marked Comply. Please check them, then Save or Submit.` : 'No blank fields with a specified value to fill.', 'i');
    });
    const pv = $('prev'); if (pv) pv.addEventListener('click', () => go(S.cur - 1));
    const nx = $('next'); if (nx) nx.addEventListener('click', () => go(S.cur + 1));
    const sv = $('save'); if (sv) sv.addEventListener('click', () => save(it, false));
    const sm = $('submit'); if (sm) sm.addEventListener('click', () => {
      if (!confirm(`Submit ${it.ref || it.code} – ${it.name}?\n\nOnce submitted this product is locked and cannot be edited.`)) return;
      save(it, true);
    });
    const sg = $('sGo'); if (sg) sg.addEventListener('click', async () => {
      if (!$('sConf').checked) return alert('Tick the declaration to sign off.');
      const n = $('sN').value.trim(); if (!n) return alert('Enter your name.');
      if (!confirm('Sign off and lock the whole package? This cannot be undone.')) return;
      sg.disabled = true;
      const r = await sb.rpc('vp_signoff', {p_token:tok, p_name:n, p_designation:$('sD').value.trim(), p_confirm:true});
      if (r.error) { sg.disabled = false; return alert(errText(r.error)); }
      S.msg = null; load(true);
    });
  }

  if (!tok) fatal('This link is incomplete. Please open the full link you received from Meinhardt.');
  else load(false).catch(e => fatal(errText(e)));
})();
</script>
</body>
</html>
